<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Director Panel | V24 Elite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
body { background: #050b14; font-family: 'Montserrat', sans-serif; color: #fff; padding: 20px; margin: 0; }
.container { max-width: 1200px; margin: auto; }
.card { background: linear-gradient(145deg, #0b1120, #030712); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0, 229, 255, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
h2 { margin-top: 0; color: #00e5ff; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; font-size: 18px; }
label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
input, select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; font-weight: bold; transition: 0.3s; box-sizing: border-box; font-family: 'Montserrat', sans-serif;}
input:focus, select:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
button { padding: 12px; margin: 5px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; border-radius: 8px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
button:active { transform: translateY(2px); box-shadow: none; }
.runBtn { width: 65px; height: 55px; font-size: 22px; border-radius: 10px; }
.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.gold { background: linear-gradient(135deg, #facc15, #ca8a04); color: #000; }
.scoreBox { font-size: 55px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
.badge { background: #1e293b; color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; }
.badge.active { background: #00e5ff; color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
.over-log { display: inline-block; padding: 5px 10px; background: #000; margin: 2px; border-radius: 5px; font-weight: bold; border: 1px solid #334155; }
.flex-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.flex-row input { margin: 0; width: 80px; text-align: center; font-size: 18px; }
</style>
</head>
<body>
<div class="container">

<div class="card">
<h2>1. Live Match Engine</h2>
<div class="grid">
    <div>
        <label>Team A Name</label><input id="teamA">
        <label style="color:#10b981;">Team A Logo</label><input type="file" id="teamALogo" accept="image/*">
    </div>
    <div>
        <label>Team B Name</label><input id="teamB">
        <label style="color:#10b981;">Team B Logo</label><input type="file" id="teamBLogo" accept="image/*">
    </div>
</div>
<div class="grid">
    <div>
        <label>Batsman 1 <button id="btnStrike1" class="badge active" onclick="setStrike(1)">ON STRIKE (▶)</button></label>
        <input id="b1Name">
        <div style="display:flex; gap:10px;"><input id="b1Runs" type="number" placeholder="Runs"><input id="b1Balls" type="number" placeholder="Balls"></div>
    </div>
    <div>
        <label>Batsman 2 <button id="btnStrike2" class="badge" onclick="setStrike(2)">SET STRIKE</button></label>
        <input id="b2Name">
        <div style="display:flex; gap:10px;"><input id="b2Runs" type="number" placeholder="Runs"><input id="b2Balls" type="number" placeholder="Balls"></div>
    </div>
</div>
<div class="grid">
    <div>
        <label>Bowler Name</label><input id="bowler">
        <div style="display:flex; gap:10px;"><input id="bowlerWickets" type="number" placeholder="Wickets"><input id="bowlerRuns" type="number" placeholder="Runs"></div>
    </div>
    <div><label>Target (2nd Innings)</label><input id="target" type="number"></div>
</div>
</div>

<div class="card" style="text-align: center;">
<div class="scoreBox" id="score">0/0</div>
<div id="overs" style="font-size:26px; color:#94a3b8; font-weight:bold;">0.0 Overs</div>
<div id="thisOver" style="margin-top:15px; min-height: 40px;"></div>
</div>

<div class="card">
<h2>3. Advanced Action Room</h2>
<div style="text-align: center; margin-bottom: 20px;">
    <button class="runBtn green" onclick="addRun(0)">0</button>
    <button class="runBtn green" onclick="addRun(1)">1</button>
    <button class="runBtn green" onclick="addRun(2)">2</button>
    <button class="runBtn green" onclick="addRun(3)">3</button>
    <button class="runBtn gold" onclick="addRun(4)">4</button>
    <button class="runBtn blue" onclick="addRun(5)">5</button>
    <button class="runBtn gold" onclick="addRun(6)">6</button>
    <button class="runBtn blue" style="width:auto; padding: 0 20px;" onclick="undoBall()">UNDO BALL</button>
</div>

<div class="grid">
    <div style="background: #020617; padding: 15px; border-radius: 8px; border: 1px solid #1e293b;">
        <label style="color:#00e5ff;">🛠️ Custom Extras Engine</label><br><br>
        <div class="flex-row">
            <button class="blue" style="width: 120px;" onclick="addSmartExtra('WD')">WIDE +</button>
            <input type="number" id="inWD" value="0" min="0"> RUNS
        </div>
        <div class="flex-row">
            <button class="gold" style="width: 120px;" onclick="addSmartExtra('NB')">NO BALL +</button>
            <input type="number" id="inNB" value="0" min="0"> RUNS
        </div>
        <div class="flex-row">
            <button class="blue" style="background:#7e22ce; width: 120px;" onclick="addSmartExtra('B')">BYE +</button>
            <input type="number" id="inB" value="1" min="1"> RUNS
        </div>
        <div class="flex-row">
            <button class="blue" style="background:#ea580c; width: 120px;" onclick="addSmartExtra('LB')">LEG BYE +</button>
            <input type="number" id="inLB" value="1" min="1"> RUNS
        </div>
    </div>
    
    <div style="background: #020617; padding: 15px; border-radius: 8px; border: 1px solid #1e293b;">
        <label style="color:#ef4444;">🔴 Advanced Wicket Engine</label><br><br>
        <select id="wicketTypeBox" style="font-size: 16px; padding: 10px;">
            <option value="BOWLED">Bowled</option>
            <option value="CAUGHT">Caught</option>
            <option value="CAUGHT BEHIND">Caught Behind</option>
            <option value="C & B">Caught & Bowled</option>
            <option value="LBW">LBW</option>
            <option value="STUMPED">Stumped</option>
            <option value="RUN OUT">Run Out</option>
            <option value="RETIRED HURT">Retired Hurt</option>
        </select>
        <button class="red" style="width: 100%; font-size: 20px; padding: 15px; margin-top: 10px;" onclick="processWicket()">🚨 OUT!</button>
    </div>
</div>
</div>

<div class="card">
<h2>📺 Broadcast Controls</h2>
<div class="grid">
    <div>
        <label>Live Ticker Message</label>
        <input id="tickerText" placeholder="Breaking news...">
    </div>
    <div>
        <label>Match Winner Team Text</label>
        <input id="winnerText" placeholder="E.g., RCB WON BY 5 WICKETS">
    </div>
</div>
<div style="display:flex; justify-content:space-between; flex-wrap: wrap; gap:10px;">
    <button class="blue" style="flex:1; background:#0f766e;" onclick="toggleScoreboard()">👁️ HIDE/SHOW SCOREBOARD</button>
    <button class="gold" style="flex:1;" onclick="toggleFlag('showWinner', true)">🏆 SHOW FULL SCREEN WINNER</button>
    <button class="red" style="flex:1;" onclick="toggleFlag('showWinner', false)">❌ HIDE WINNER</button>
</div>
</div>

<div class="card" style="display:flex; justify-content:space-between;">
<button class="green" style="width:48%; background:#2563eb;" onclick="startSecondInnings()">🔄 AUTO-SWAP & 2ND INNINGS</button>
<button class="red" style="width:48%; background:#7f1d1d;" onclick="hardReset()">RESET FULL MATCH</button>
</div>

</div>

<script>
// V24 ELITE KEY
const DB_KEY = "BPL_ELITE_V24"; 
let defaultData = { 
    teamA: "TEAM A", teamB: "TEAM B", teamALogo: "", teamBLogo: "", 
    score: 0, wickets: 0, balls: 0, target: 0, innings: 1, thisOver: [], history: [], 
    b1Name: "BAT 1", b1Runs: 0, b1Balls: 0, b2Name: "BAT 2", b2Runs: 0, b2Balls: 0, onStrike: 1, 
    bowler: "BOWLER", bowlerRuns: 0, bowlerWickets: 0, flashEvent: "", flashId: 0, 
    winnerText: "", showWinner: false, showScoreboard: true, 
    tickerText: "🏆 BARAHPURA PREMIER LEAGUE SEASON 1, 2026 | POWERED BY A2 SERIES | CONTACT: 8252001148 🏆" 
};
let matchData;
try { let saved = localStorage.getItem(DB_KEY); matchData = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData)); } catch(e) { matchData = JSON.parse(JSON.stringify(defaultData)); }

function saveData() { 
    try { localStorage.setItem(DB_KEY, JSON.stringify(matchData)); } catch(e) {}
}
function getOvers() { return Math.floor(matchData.balls / 6) + "." + (matchData.balls % 6); }
function saveHistory() { let snap = JSON.parse(JSON.stringify(matchData)); delete snap.history; matchData.history.push(snap); if(matchData.history.length > 30) matchData.history.shift(); }
function rotateStrike() { matchData.onStrike = matchData.onStrike === 1 ? 2 : 1; }
function triggerAnimation(type) { matchData.flashEvent = type; matchData.flashId = Date.now(); }

function checkAndClearOver() {
    let legal = matchData.thisOver.filter(b => !String(b).includes("WD") && !String(b).includes("NB")).length;
    if (legal >= 6) { matchData.thisOver = []; }
}

function addRun(run) {
    saveHistory(); checkAndClearOver(); run = parseInt(run);
    matchData.score += run; matchData.bowlerRuns += run; matchData.balls++; matchData.thisOver.push(run);
    if(matchData.onStrike === 1) { matchData.b1Runs += run; matchData.b1Balls++; } else { matchData.b2Runs += run; matchData.b2Balls++; }
    if(run === 4 || run === 6) triggerAnimation(run);
    if(run % 2 !== 0) rotateStrike();
    if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike();
    updateUI();
}

function processWicket() {
    saveHistory(); checkAndClearOver();
    let wType = document.getElementById("wicketTypeBox").value; 
    matchData.wickets++; matchData.balls++; matchData.thisOver.push("W");
    if(matchData.onStrike === 1) matchData.b1Balls++; else matchData.b2Balls++;
    if(wType !== "RUN OUT" && wType !== "RETIRED HURT") { matchData.bowlerWickets++; }
    
    // Send the exact wicket type selected by admin
    triggerAnimation(wType); 
    
    if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike();
    updateUI();
}

function addSmartExtra(type) {
    saveHistory(); checkAndClearOver();
    let extraRuns = parseInt(document.getElementById("in" + type).value) || 0;
    
    if(type === 'WD') {
        let total = 1 + extraRuns;
        matchData.score += total; matchData.bowlerRuns += total; 
        matchData.thisOver.push(extraRuns > 0 ? `WD+${extraRuns}` : `WD`);
        if(extraRuns % 2 !== 0) rotateStrike();
        triggerAnimation('WIDE');
    } 
    else if(type === 'NB') {
        let total = 1 + extraRuns;
        matchData.score += total; matchData.bowlerRuns += total; 
        matchData.thisOver.push(extraRuns > 0 ? `NB+${extraRuns}` : `NB`);
        if(extraRuns % 2 !== 0) rotateStrike();
        triggerAnimation('NO BALL');
    }
    else if(type === 'B') {
        matchData.score += extraRuns; matchData.balls++; 
        matchData.thisOver.push(`${extraRuns}B`);
        if(matchData.onStrike === 1) matchData.b1Balls++; else matchData.b2Balls++;
        if(extraRuns % 2 !== 0) rotateStrike();
        if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike();
    }
    else if(type === 'LB') {
        matchData.score += extraRuns; matchData.balls++; 
        matchData.thisOver.push(`${extraRuns}LB`);
        if(matchData.onStrike === 1) matchData.b1Balls++; else matchData.b2Balls++;
        if(extraRuns % 2 !== 0) rotateStrike();
        if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike();
    }
    updateUI();
}

function undoBall() { if(matchData.history.length === 0) return; let hist = matchData.history; let oldA = matchData.teamALogo, oldB = matchData.teamBLogo; matchData = hist.pop(); matchData.teamALogo = oldA; matchData.teamBLogo = oldB; matchData.history = hist; updateUI(); }

function startSecondInnings() { 
    if(!confirm("Start 2nd Innings? Teams and scores will swap!")) return;
    saveHistory();
    let tA = matchData.teamA, tB = matchData.teamB, lA = matchData.teamALogo, lB = matchData.teamBLogo;
    matchData.teamA = tB; matchData.teamB = tA; matchData.teamALogo = lB; matchData.teamBLogo = lA;
    matchData.target = matchData.score + 1; matchData.score = 0; matchData.wickets = 0; matchData.balls = 0; 
    matchData.b1Runs = 0; matchData.b1Balls = 0; matchData.b2Runs = 0; matchData.b2Balls = 0; 
    matchData.bowlerRuns = 0; matchData.bowlerWickets = 0; matchData.innings = 2; 
    matchData.thisOver = []; matchData.showWinner = false; updateUI(); 
}

function setStrike(n) { matchData.onStrike = n; updateUI(); }
function toggleFlag(flag, state) { matchData[flag] = state; updateUI(); }
function toggleScoreboard() { matchData.showScoreboard = !matchData.showScoreboard; updateUI(); }
function hardReset() { if(confirm("Sab clear ho jayega. Pakka?")) { localStorage.clear(); location.reload(); } }

function updateUI() {
    document.getElementById("score").innerText = matchData.score + "/" + matchData.wickets;
    document.getElementById("overs").innerText = getOvers() + " Overs";
    let html = ""; matchData.thisOver.forEach(b => html += `<span class="over-log">${b}</span>`);
    document.getElementById("thisOver").innerHTML = html;
    
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target", "winnerText", "tickerText"].forEach(id => { 
        let el = document.getElementById(id); 
        if(el && document.activeElement !== el) el.value = matchData[id] || ""; 
    });
    
    document.getElementById("btnStrike1").className = matchData.onStrike===1 ? "badge active" : "badge";
    document.getElementById("btnStrike2").className = matchData.onStrike===2 ? "badge active" : "badge";
    saveData();
}

document.addEventListener("DOMContentLoaded", () => {
    updateUI();
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target", "winnerText", "tickerText"].forEach(id => {
        document.getElementById(id).addEventListener("input", e => { matchData[id] = e.target.type === 'number' ? (parseInt(e.target.value)||0) : e.target.value; saveData(); });
    });
    
    const handleImage = (id, key) => {
        let el = document.getElementById(id); if(!el) return;
        el.addEventListener("change", e => {
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
            reader.onload = ev => { const img = new Image(); img.onload = () => { 
                const canvas = document.createElement("canvas"); let scale = 100 / img.width; if(scale > 1) scale = 1;
                canvas.width = img.width * scale; canvas.height = img.height * scale; canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height); 
                matchData[key] = canvas.toDataURL("image/jpeg", 0.4); saveData(); 
            }; img.src = ev.target.result; }; reader.readAsDataURL(file);
        });
    };
    handleImage("teamALogo", "teamALogo"); handleImage("teamBLogo", "teamBLogo");
});
</script>
</body>
</html>
