<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPL Final - Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #16213e; padding: 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #e94560; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .box { background: #0f3460; padding: 15px; border-radius: 8px; border: 1px solid #e94560; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: none; border-radius: 5px; font-weight: bold; }
        input, select { background: #fff; color: #333; }
        button { background: #e94560; color: white; cursor: pointer; text-transform: uppercase; font-size: 16px; transition: 0.3s; }
        button:hover { background: #ff2a4b; transform: scale(1.02); }
        .btn-green { background: #4caf50; } .btn-green:hover { background: #45a049; }
        .btn-red { background: #f44336; } .btn-red:hover { background: #da190b; }
        .title { font-size: 14px; color: #aaa; text-transform: uppercase; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>BPL Season 4 - Master Control</h1>
    
    <div class="grid">
        <!-- SCORE CONTROLS -->
        <div class="box">
            <span class="title">Main Score</span>
            <input type="text" id="batTeam" placeholder="Batting Team Name" value="TEAM A">
            <input type="number" id="runs" placeholder="Runs" value="0">
            <input type="number" id="wickets" placeholder="Wickets" value="0">
            <input type="number" id="overs" placeholder="Overs" value="0" step="0.1">
            <button onclick="updateScore()">Update Score</button>
        </div>

        <!-- CENTER STAGE ANIMATIONS -->
        <div class="box">
            <span class="title">Center Screen Events (Premium)</span>
            <button class="btn-green" onclick="triggerEvent('FOUR!')">🔥 4 RUNS 🔥</button>
            <button class="btn-green" onclick="triggerEvent('SIX!')">🚀 6 RUNS 🚀</button>
            <button class="btn-red" onclick="triggerEvent('WICKET!')">💀 WICKET 💀</button>
            <button onclick="clearEvent()">Clear Center Screen</button>
        </div>
    </div>

    <!-- ADVANCED PLAYER PROFILE SENDER -->
    <div class="box" style="margin-top: 20px;">
        <span class="title">Advanced Player Profile (Live Popup)</span>
        <div class="grid" style="margin-bottom: 0;">
            <div>
                <input type="text" id="playerName" placeholder="Player Name (e.g. Virat Kohli)">
                <input type="text" id="playerRole" placeholder="Role (e.g. Right Hand Batter)">
                <input type="text" id="playerStats" placeholder="Stats (e.g. 54 Runs | 32 Balls)">
            </div>
            <div>
                <select id="animStyle">
                    <option value="slide-bottom">Option 1: IPL Style (Slide Bottom)</option>
                    <option value="fly-left">Option 2: Newsflash (Fly Left)</option>
                    <option value="fade-center">Option 3: Cinematic (Fade Center)</option>
                </select>
                <button class="btn-green" onclick="showProfile()">Push Profile to Live</button>
                <button class="btn-red" onclick="hideProfile()">Hide Profile</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Machine Gun Polling Setup - Data saved instantly to local storage
    const DB_KEY = 'BPL_V4_FINAL_PRO';

    function init() {
        let data = JSON.parse(localStorage.getItem(DB_KEY));
        if(!data) {
            data = { runs: 0, wickets: 0, overs: 0, batTeam: 'TEAM A', event: '', showProfile: false, pName: '', pRole: '', pStats: '', pAnim: 'slide-bottom' };
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }
        document.getElementById('runs').value = data.runs;
        document.getElementById('wickets').value = data.wickets;
        document.getElementById('overs').value = data.overs;
        document.getElementById('batTeam').value = data.batTeam;
    }

    function updateScore() {
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        data.runs = document.getElementById('runs').value;
        data.wickets = document.getElementById('wickets').value;
        data.overs = document.getElementById('overs').value;
        data.batTeam = document.getElementById('batTeam').value;
        localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    function triggerEvent(eventName) {
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        data.event = eventName;
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        setTimeout(clearEvent, 4000); // Auto clear after 4 seconds
    }

    function clearEvent() {
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        data.event = '';
        localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    function showProfile() {
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        data.pName = document.getElementById('playerName').value;
        data.pRole = document.getElementById('playerRole').value;
        data.pStats = document.getElementById('playerStats').value;
        data.pAnim = document.getElementById('animStyle').value;
        data.showProfile = true;
        localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    function hideProfile() {
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || {};
        data.showProfile = false;
        localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    init();
</script>
</body>
</html>
