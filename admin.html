<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket OBS Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body {
            background: #0a0a0a; color: #d4af37; font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 40px; display: flex; justify-content: center;
        }
        .container {
            width: 100%; max-width: 800px; background: #111; padding: 30px; 
            border-radius: 12px; border: 1px solid #d4af37; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #333; padding-bottom: 15px; margin-top: 0;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #aaa; }
        input {
            width: 100%; background: #000; border: 1px solid #333; color: #fff;
            padding: 12px; font-size: 16px; border-radius: 6px; box-sizing: border-box;
            font-family: 'Montserrat', sans-serif; font-weight: 700;
        }
        input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 10px rgba(212,175,55,0.2); }
        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 30px; }
        button {
            background: linear-gradient(45deg, #111, #222); color: #d4af37; border: 1px solid #d4af37;
            padding: 15px; font-size: 14px; font-weight: 900; text-transform: uppercase;
            border-radius: 6px; cursor: pointer; transition: all 0.2s ease;
        }
        button:hover { background: #d4af37; color: #000; transform: translateY(-2px); }
        button.update-btn { background: #d4af37; color: #000; font-size: 18px; margin-top: 20px; }
        button.update-btn:hover { background: #fff; border-color: #fff; }
        button.danger { border-color: #ff3333; color: #ff3333; }
        button.danger:hover { background: #ff3333; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h1>Match Controller</h1>
    
    <div class="grid">
        <div>
            <label>Batting Team (e.g. IND)</label>
            <input type="text" id="team1" value="TEAM A">
        </div>
        <div>
            <label>Bowling Team (e.g. AUS)</label>
            <input type="text" id="team2" value="TEAM B">
        </div>
        <div>
            <label>Runs</label>
            <input type="number" id="runs" value="0">
        </div>
        <div>
            <label>Wickets</label>
            <input type="number" id="wickets" value="0">
        </div>
        <div class="full-width">
            <label>Overs (e.g. 14.2)</label>
            <input type="number" step="0.1" id="overs" value="0.0">
        </div>
    </div>

    <button class="update-btn full-width" onclick="updateScore()">Update Scoreboard</button>

    <h3 style="margin-top: 40px; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px;">Cinematic Triggers</h3>
    <div class="btn-group">
        <button onclick="triggerEvent('FOUR')">Four</button>
        <button onclick="triggerEvent('SIX')">Six</button>
        <button onclick="triggerEvent('WIDE')">Wide</button>
        <button class="danger" onclick="triggerEvent('WICKET')">Wicket</button>
    </div>
</div>

<script>
    // Initialize scoreboard on load
    function updateScore() {
        const data = {
            team1: document.getElementById('team1').value,
            team2: document.getElementById('team2').value,
            runs: document.getElementById('runs').value,
            wickets: document.getElementById('wickets').value,
            overs: document.getElementById('overs').value,
            timestamp: Date.now() // Forces event trigger
        };
        localStorage.setItem('cricket_score', JSON.stringify(data));
    }

    function triggerEvent(eventType) {
        // Automatically add runs/wickets for convenience
        let runsInput = document.getElementById('runs');
        let wktsInput = document.getElementById('wickets');
        
        if(eventType === 'FOUR') runsInput.value = parseInt(runsInput.value) + 4;
        if(eventType === 'SIX') runsInput.value = parseInt(runsInput.value) + 6;
        if(eventType === 'WIDE') runsInput.value = parseInt(runsInput.value) + 1;
        if(eventType === 'WICKET') wktsInput.value = parseInt(wktsInput.value) + 1;
        
        updateScore(); // Update board simultaneously

        // Trigger cinematic popup
        localStorage.setItem('cricket_event', JSON.stringify({ type: eventType, timestamp: Date.now() }));
    }

    // Push initial state
    updateScore();
</script>

</body>
</html>
