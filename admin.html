<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPL Scorer Panel</title>

<style>

body{
background:#071b4d;
font-family:Arial,sans-serif;
color:white;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:#102b72;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

h2{
margin-bottom:10px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:none;
border-radius:8px;
}

button{
padding:12px;
margin:5px;
font-size:18px;
font-weight:bold;
cursor:pointer;
border:none;
border-radius:10px;
}

.runBtn{
width:70px;
height:60px;
}

.green{
background:#1db954;
color:white;
}

.red{
background:#d62828;
color:white;
}

.blue{
background:#1976d2;
color:white;
}

.yellow{
background:#ffd23f;
color:black;
}

.scoreBox{
font-size:40px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Match Setup</h2>

<label>Team A</label>
<input id="teamA" value="ROYAL WARRIORS">

<label>Team B</label>
<input id="teamB" value="TIGER STRIKERS">

<label>Total Overs</label>
<input id="matchOvers" value="8">

<label>Target</label>
<input id="target" value="0">

<label>Team A Logo</label>
<input type="file" id="teamALogo">

<label>Team B Logo</label>
<input type="file" id="teamBLogo">

</div>

<div class="card">

<h2>Live Score</h2>

<div class="scoreBox" id="score">
0/0
</div>

<div id="overs">
0.0
</div>

<div id="thisOver">
-
</div>

</div>

<div class="card">

<h2>Batsman</h2>

<input id="striker" placeholder="Striker Name">

<input id="strikerRuns" placeholder="Striker Runs">

<input id="strikerBalls" placeholder="Striker Balls">

<input id="nonStriker" placeholder="Non Striker Name">

<input id="nonStrikerRuns" placeholder="Non Striker Runs">

<input id="nonStrikerBalls" placeholder="Non Striker Balls">
</div>

<div class="card">

<h2>Bowler</h2>

<input id="bowler" placeholder="Bowler Name">

<input id="bowlerRuns" placeholder="Runs Given">

<input id="bowlerWickets" placeholder="Wickets">
</div>

<div class="card">

<h2>Scoring Buttons</h2>

<button class="runBtn green">0</button>
<button class="runBtn green">1</button>
<button class="runBtn green">2</button>
<button class="runBtn green">3</button>

<br>

<button class="runBtn green">4</button>
<button class="runBtn green">5</button>

<button class="runBtn red">
6=OUT
</button>

<br>

<button class="blue">
WD
</button>

<button class="blue">
NB
</button>

<button class="yellow">
UNDO
</button>

</div>

<div class="card">

<h2>Innings Control</h2>

<button class="green">
START 2ND INNINGS
</button>

<button class="red">
RESET MATCH
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
