<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Studio Director | V26 Ultimate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
body { background: #020617; font-family: 'Montserrat', sans-serif; color: #fff; margin: 0; padding: 0; }
.header { background: #0f172a; padding: 15px 20px; text-align: center; border-bottom: 2px solid #00e5ff; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;}
.tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; font-weight: 900; cursor: pointer; border-radius: 8px; transition: 0.3s; text-transform: uppercase;}
.tab-btn.active { background: #00e5ff; color: #000; box-shadow: 0 0 15px rgba(0,229,255,0.5); border-color: #00e5ff; }
.container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
.tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card { background: linear-gradient(145deg, #0b1120, #030712); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0, 229, 255, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
h2 { margin-top: 0; color: #00e5ff; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; font-size: 18px; }
label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; font-weight: bold; transition: 0.3s; box-sizing: border-box; font-family: 'Montserrat', sans-serif;}
input:focus, select:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }

button { padding: 12px; margin: 5px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; border-radius: 8px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
button:active { transform: translateY(2px); box-shadow: none; }
.btn-green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.btn-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.btn-gold { background: linear-gradient(135deg, #facc15, #ca8a04); color: #000; }

.runBtn { width: 65px; height: 55px; font-size: 22px; border-radius: 10px; }
.scoreBox { font-size: 55px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); text-align: center;}
.player-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1e293b;}
.player-row input { margin-bottom: 0; }
</style>
</head>
<body>

<div class="header">
    <button class="tab-btn active" onclick="switchTab('tab-live')">🔴 Live Match</button>
    <button class="tab-btn" onclick="switchTab('tab-xi')">👥 Playing XI</button>
    <button class="tab-btn" onclick="switchTab('tab-profile')">👤 Pro Profile</button>
    <button class="tab-btn" onclick="switchTab('tab-vs')">⚡ Versus Clash</button>
</div>

<div class="container">

<!-- ================= TAB 1: LIVE MATCH ================= -->
<div id="tab-live" class="tab-content active">
    <div class="card">
        <h2>Live Score Engine</h2>
        <div class="grid">
            <div><label>Team A Name</label><input id="teamA"></div>
            <div><label>Team B Name</label><input id="teamB"></div>
        </div>
        <div class="grid">
            <div><label>Batsman 1</label><input id="b1Name"><div style="display:flex; gap:10px;"><input id="b1Runs" type="number" placeholder="Runs"><input id="b1Balls" type="number" placeholder="Balls"></div></div>
            <div><label>Batsman 2</label><input id="b2Name"><div style="display:flex; gap:10px;"><input id="b2Runs" type="number" placeholder="Runs"><input id="b2Balls" type="number" placeholder="Balls"></div></div>
        </div>
        <div class="grid">
            <div><label>Bowler</label><input id="bowler"><div style="display:flex; gap:10px;"><input id="bowlerWickets" type="number" placeholder="Wickets"><input id="bowlerRuns" type="number" placeholder="Runs"></div></div>
            <div><label>Target</label><input id="target" type="number"></div>
        </div>
    </div>

    <div class="card scoreBox" id="score">0/0 <br><span id="overs" style="font-size:26px; color:#94a3b8;">0.0 Overs</span></div>

    <div class="card" style="text-align: center;">
        <button class="runBtn btn-green" onclick="addRun(0)">0</button>
        <button class="runBtn btn-green" onclick="addRun(1)">1</button>
        <button class="runBtn btn-green" onclick="addRun(2)">2</button>
        <button class="runBtn btn-green" onclick="addRun(3)">3</button>
        <button class="runBtn btn-gold" onclick="addRun(4)">4</button>
        <button class="runBtn btn-blue" onclick="addRun(5)">5</button>
        <button class="runBtn btn-gold" onclick="addRun(6)">6</button>
        <br><br>
        <select id="wicketTypeBox" style="width:200px; display:inline-block;"><option value="BOWLED">Bowled</option><option value="CAUGHT">Caught</option><option value="RUN OUT">Run Out</option></select>
        <button class="btn-red" style="padding: 10px 30px;" onclick="processWicket()">🚨 OUT!</button>
    </div>

    <div class="card grid">
        <button class="btn-blue" onclick="toggleScoreboard()">👁️ TOGGLE SCOREBOARD</button>
        <button class="btn-gold" onclick="toggleFlag('showWinner', true)">🏆 SHOW WINNER</button>
    </div>
</div>

<!-- ================= TAB 2: PLAYING XI ================= -->
<div id="tab-xi" class="tab-content">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Team A - Playing XI</h2>
            <div>
                <button class="btn-blue" onclick="toggleFlag('showXiA', true)">SHOW TEAM A</button>
                <button class="btn-red" onclick="toggleFlag('showXiA', false)">HIDE</button>
            </div>
        </div>
        <div id="xiA-container"></div>
    </div>
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Team B - Playing XI</h2>
            <div>
                <button class="btn-blue" onclick="toggleFlag('showXiB', true)">SHOW TEAM B</button>
                <button class="btn-red" onclick="toggleFlag('showXiB', false)">HIDE</button>
            </div>
        </div>
        <div id="xiB-container"></div>
    </div>
</div>

<!-- ================= TAB 3: PRO PROFILE ================= -->
<div id="tab-profile" class="tab-content">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Player Profile Engine (Left Side)</h2>
            <div>
                <button class="btn-blue" onclick="toggleFlag('showProfile', true)">SHOW PROFILE</button>
                <button class="btn-red" onclick="toggleFlag('showProfile', false)">HIDE</button>
            </div>
        </div>
        <div class="grid">
            <div>
                <label>Player Name</label><input id="profName" placeholder="E.g. BABAR AZAM">
                <label>Photo (Auto-Compressed)</label><input type="file" id="profImg" accept="image/*">
            </div>
            <div>
                <label>Stat 1 (E.g. MATCHES)</label><input id="profS1L" placeholder="Label"><input id="profS1V" placeholder="Value">
                <label>Stat 2 (E.g. RUNS)</label><input id="profS2L" placeholder="Label"><input id="profS2V" placeholder="Value">
                <label>Stat 3 (E.g. STRIKE RATE)</label><input id="profS3L" placeholder="Label"><input id="profS3V" placeholder="Value">
            </div>
        </div>
    </div>
</div>

<!-- ================= TAB 4: VERSUS CLASH ================= -->
<div id="tab-vs" class="tab-content">
    <div class="card">
         <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Versus Clash Engine (Center)</h2>
            <div>
                <button class="btn-blue" onclick="toggleFlag('showVs', true)">SHOW CLASH</button>
                <button class="btn-red" onclick="toggleFlag('showVs', false)">HIDE</button>
            </div>
        </div>
        <div align="center" style="margin-bottom: 15px;"><label>Center Title</label><input id="vsTitle" placeholder="E.g. CAPTAINS / PARTNERSHIP" style="width:50%;"></div>
        <div class="grid">
            <div style="background:#1e293b; padding:15px; border-radius:8px;">
                <h3 style="color:#a855f7; margin-top:0;">LEFT SIDE</h3>
                <label>Name / Team</label><input id="vsLeftName">
                <label>Photo</label><input type="file" id="vsLeftImg" accept="image/*">
            </div>
            <div style="background:#1e293b; padding:15px; border-radius:8px;">
                <h3 style="color:#ef4444; margin-top:0;">RIGHT SIDE</h3>
                <label>Name / Team</label><input id="vsRightName">
                <label>Photo</label><input type="file" id="vsRightImg" accept="image/*">
            </div>
        </div>
    </div>
</div>

</div>

<script>
// V26 ULTIMATE KEY
const DB_KEY = "BPL_ULTRA_V26"; 
let defaultData = { 
    teamA: "TEAM A", teamB: "TEAM B", score: 0, wickets: 0, balls: 0, target: 0,
    b1Name: "BAT 1", b1Runs: 0, b1Balls: 0, b2Name: "BAT 2", b2Runs: 0, b2Balls: 0,
    bowler: "BOWLER", bowlerRuns: 0, bowlerWickets: 0, showScoreboard: true, showWinner: false, winnerText: "CHAMPIONS",
    
    // New Advanced Features State
    showXiA: false, showXiB: false, showProfile: false, showVs: false,
    xiA: Array(11).fill({name: "", img: ""}), xiB: Array(11).fill({name: "", img: ""}),
    profName: "", profImg: "", profS1L: "MATCHES", profS1V: "0", profS2L: "RUNS", profS2V: "0", profS3L: "STRIKE RATE", profS3V: "0",
    vsTitle: "CAPTAINS", vsLeftName: "", vsLeftImg: "", vsRightName: "", vsRightImg: ""
};

let matchData;
try { let saved = localStorage.getItem(DB_KEY); matchData = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData)); } catch(e) { matchData = JSON.parse(JSON.stringify(defaultData)); }

function saveData() { try { localStorage.setItem(DB_KEY, JSON.stringify(matchData)); } catch(e) { alert("Storage Limit Hit! Images too large."); } }

// Tab Switcher
function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
}

// 💥 NANO-COMPRESSION AI (Resizes to 150px max, converts to low-q WebP to save LS Quota) 💥
function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            const MAX_SIZE = 150; // VERY SMALL FOR LOCALSTORAGE SAFETY
            if(w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } 
            else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL("image/webp", 0.4)); // WebP is incredibly light
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function renderXiInputs() {
    ['A', 'B'].forEach(t => {
        let html = "";
        for(let i=0; i<11; i++) {
            html += `<div class="player-row">
                <input type="text" placeholder="Player ${i+1} Name" value="${matchData['xi'+t][i].name}" oninput="updateXi('${t}', ${i}, 'name', this.value)">
                <input type="file" accept="image/*" onchange="handleXiImg(this, '${t}', ${i})">
            </div>`;
        }
        document.getElementById(`xi${t}-container`).innerHTML = html;
    });
}

function updateXi(team, index, key, value) { matchData['xi'+team][index][key] = value; saveData(); }
function handleXiImg(input, team, index) {
    if(input.files[0]) compressImage(input.files[0], (base64) => { updateXi(team, index, 'img', base64); });
}

// Core Score Logic (Simplified for brevity)
function getOvers() { return Math.floor(matchData.balls / 6) + "." + (matchData.balls % 6); }
function addRun(r) { matchData.score += r; matchData.balls++; matchData.b1Runs += r; matchData.b1Balls++; updateUI(); }
function processWicket() { matchData.wickets++; matchData.balls++; matchData.bowlerWickets++; updateUI(); }
function toggleFlag(flag, state) { 
    // Auto-close others if opening a full screen graphic
    if(state && (flag === 'showXiA' || flag === 'showXiB' || flag === 'showVs' || flag === 'showWinner')) {
        matchData.showXiA = false; matchData.showXiB = false; matchData.showVs = false; matchData.showWinner = false;
    }
    matchData[flag] = state; updateUI(); 
}
function toggleScoreboard() { matchData.showScoreboard = !matchData.showScoreboard; updateUI(); }

function updateUI() {
    document.getElementById("score").innerText = matchData.score + "/" + matchData.wickets;
    document.getElementById("overs").innerText = getOvers() + " Overs";
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target", 
     "profName", "profS1L", "profS1V", "profS2L", "profS2V", "profS3L", "profS3V", "vsTitle", "vsLeftName", "vsRightName"].forEach(id => { 
        let el = document.getElementById(id); if(el && document.activeElement !== el) el.value = matchData[id] || ""; 
    });
    saveData();
}

document.addEventListener("DOMContentLoaded", () => {
    updateUI(); renderXiInputs();
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target",
     "profName", "profS1L", "profS1V", "profS2L", "profS2V", "profS3L", "profS3V", "vsTitle", "vsLeftName", "vsRightName"].forEach(id => {
        document.getElementById(id).addEventListener("input", e => { matchData[id] = e.target.type === 'number' ? (parseInt(e.target.value)||0) : e.target.value; saveData(); });
    });
    
    // Standalone Image Handlers
    ["profImg", "vsLeftImg", "vsRightImg"].forEach(id => {
        document.getElementById(id).addEventListener("change", e => {
            if(e.target.files[0]) compressImage(e.target.files[0], base64 => { matchData[id] = base64; saveData(); });
        });
    });
});
</script>
</body>
</html>
