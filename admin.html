<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Director | V33 Nano-Core</title>
<!-- Cropper.js for HD Cropping -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
body { background: #050b14; font-family: 'Montserrat', sans-serif; color: #fff; margin: 0; padding: 0; }
.header { background: #0f172a; padding: 15px 20px; text-align: center; border-bottom: 2px solid #00e5ff; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;}
.tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 15px; font-weight: 900; cursor: pointer; border-radius: 8px; transition: 0.3s; text-transform: uppercase; font-size: 12px;}
.tab-btn.active { background: #00e5ff; color: #000; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
.container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
.tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card { background: linear-gradient(145deg, #0b1120, #030712); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0, 229, 255, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
h2 { margin-top: 0; color: #00e5ff; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; font-size: 18px; }
label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; font-weight: bold; box-sizing: border-box; font-family: 'Montserrat', sans-serif;}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
button { padding: 12px; margin: 5px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; border-radius: 8px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
.runBtn { width: 65px; height: 55px; font-size: 22px; border-radius: 10px; }
.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.gold { background: linear-gradient(135deg, #facc15, #ca8a04); color: #000; }
.scoreBox { font-size: 55px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
.badge { background: #1e293b; color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; }
.badge.active { background: #00e5ff; color: #000; }
.over-log { display: inline-block; padding: 5px 10px; background: #000; margin: 2px; border-radius: 5px; font-weight: bold; border: 1px solid #334155; }
.flex-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.flex-row input { margin: 0; width: 80px; text-align: center; font-size: 18px; }
.player-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1e293b;}
.player-row input { margin-bottom: 0; }
.auto-fetch-box { background: rgba(0, 229, 255, 0.1); border: 2px dashed #00e5ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }

/* CROPPER MODAL CSS */
#cropModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
#cropContainer { width: 90%; max-width: 600px; height: 60vh; background: #000; }
.crop-controls { margin-top: 20px; display: flex; gap: 10px; }
</style>
</head>
<body>

<!-- HD STUDIO CROPPER MODAL -->
<div id="cropModal">
    <h2 style="color:#00e5ff;" id="cropTitle">✂️ SMART CROPPER</h2>
    <div id="cropContainer"><img id="cropImage" src="" style="max-width: 100%;"></div>
    <div class="crop-controls">
        <button class="red" onclick="closeCropper()">❌ CANCEL</button>
        <button class="green" onclick="saveCrop()">✅ SAVE CROP</button>
    </div>
</div>

<div class="header">
    <button class="tab-btn active" onclick="switchTab('tab-live')">🔴 Match Engine</button>
    <button class="tab-btn" onclick="switchTab('tab-xi')">👥 Playing XI</button>
    <button class="tab-btn" onclick="switchTab('tab-profile')">👤 3D Profile</button>
    <button class="tab-btn" onclick="switchTab('tab-vs')">⚡ Versus Clash</button>
</div>

<div class="container">

<!-- TAB 1: LIVE MATCH ENGINE -->
<div id="tab-live" class="tab-content active">
    <div class="card">
        <h2>1. Global Team Setup</h2>
        <div class="grid">
            <div><label>Team A Name</label><input id="teamA"><label style="color:#10b981;">Team A Logo</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.teamALogo = base64; saveData(); }, 300)" accept="image/*"></div>
            <div><label>Team B Name</label><input id="teamB"><label style="color:#10b981;">Team B Logo</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.teamBLogo = base64; saveData(); }, 300)" accept="image/*"></div>
        </div>
        <div class="grid">
            <div><label>Batsman 1 <button id="btnStrike1" class="badge active" onclick="setStrike(1)">STRIKE</button></label><input id="b1Name"><div style="display:flex; gap:10px;"><input id="b1Runs" type="number" placeholder="Runs"><input id="b1Balls" type="number" placeholder="Balls"></div></div>
            <div><label>Batsman 2 <button id="btnStrike2" class="badge" onclick="setStrike(2)">STRIKE</button></label><input id="b2Name"><div style="display:flex; gap:10px;"><input id="b2Runs" type="number" placeholder="Runs"><input id="b2Balls" type="number" placeholder="Balls"></div></div>
        </div>
        <div class="grid">
            <div><label>Bowler</label><input id="bowler"><div style="display:flex; gap:10px;"><input id="bowlerWickets" type="number" placeholder="W"><input id="bowlerRuns" type="number" placeholder="R"></div></div>
            <div><label>Target (2nd Innings)</label><input id="target" type="number"></div>
        </div>
    </div>

    <div class="card" style="text-align: center;">
        <div class="scoreBox" id="score">0/0</div>
        <div id="overs" style="font-size:26px; color:#94a3b8; font-weight:bold;">0.0 Overs</div>
        <div id="thisOver" style="margin-top:15px; min-height: 40px;"></div>
    </div>

    <div class="card">
        <h2>2. Action Room & Extras</h2>
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="runBtn green" onclick="addRun(0)">0</button>
            <button class="runBtn green" onclick="addRun(1)">1</button>
            <button class="runBtn green" onclick="addRun(2)">2</button>
            <button class="runBtn green" onclick="addRun(3)">3</button>
            <button class="runBtn gold" onclick="addRun(4)">4</button>
            <button class="runBtn blue" onclick="addRun(5)">5</button>
            <button class="runBtn gold" onclick="addRun(6)">6</button>
            <button class="runBtn blue" style="width:auto; padding: 0 20px;" onclick="undoBall()">UNDO</button>
        </div>
        <div class="grid">
            <div style="background: #020617; padding: 15px; border-radius: 8px; border: 1px solid #1e293b;">
                <label style="color:#00e5ff;">🛠️ Extras Engine</label><br><br>
                <div class="flex-row"><button class="blue" style="width: 120px;" onclick="addSmartExtra('WD')">WIDE +</button><input type="number" id="inWD" value="0"></div>
                <div class="flex-row"><button class="gold" style="width: 120px;" onclick="addSmartExtra('NB')">NO BALL +</button><input type="number" id="inNB" value="0"></div>
                <div class="flex-row"><button class="blue" style="background:#7e22ce; width: 120px;" onclick="addSmartExtra('B')">BYE +</button><input type="number" id="inB" value="1"></div>
                <div class="flex-row"><button class="blue" style="background:#ea580c; width: 120px;" onclick="addSmartExtra('LB')">LEG BYE +</button><input type="number" id="inLB" value="1"></div>
            </div>
            <div style="background: #020617; padding: 15px; border-radius: 8px; border: 1px solid #1e293b;">
                <label style="color:#ef4444;">🔴 Smart Wickets</label><br><br>
                <select id="wicketTypeBox"><option value="BOWLED">Bowled</option><option value="CAUGHT">Caught</option><option value="LBW">LBW</option><option value="STUMPED">Stumped</option><option value="RUN OUT">Run Out</option><option value="RETIRED HURT">Retired Hurt</option></select>
                <button class="red" style="width: 100%; padding: 15px; font-size: 18px;" onclick="processWicket()">🚨 OUT!</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>📺 Broadcast Controls (4 Premium Themes)</h2>
        <div class="grid">
            <div><label>Live Ticker Message</label><input id="tickerText"></div>
            <div>
                <label>WINNER SCREEN THEME</label>
                <select id="winnerTheme" onchange="matchData.winnerTheme = this.value; saveData();">
                    <option value="gold">🏆 Theme 1: Golden Glory</option>
                    <option value="cyber">🔵 Theme 2: Cyber Strike</option>
                    <option value="fire">🔴 Theme 3: Crimson Hellfire</option>
                    <option value="glass">💎 Theme 4: Premium Glass</option>
                </select>
                <input id="winnerText" placeholder="E.g. TEAM WON THE MATCH">
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; flex-wrap: wrap; gap:10px;">
            <button class="blue" style="flex:1; background:#0f766e;" onclick="toggleScoreboard()">👁️ TOGGLE SCOREBOARD</button>
            <button class="gold" style="flex:1;" onclick="toggleFlag('showWinner', true)">🏆 SHOW FULL WINNER</button>
            <button class="red" style="flex:1;" onclick="toggleFlag('showWinner', false)">❌ HIDE WINNER</button>
        </div>
    </div>

    <div class="card" style="display:flex; justify-content:space-between;">
        <button class="green" style="width:48%; background:#2563eb;" onclick="startSecondInnings()">🔄 SWAP / 2ND INNINGS</button>
        <button class="red" style="width:48%; background:#7f1d1d;" onclick="seasonEndWipe()">🗑️ SEASON END WIPE</button>
    </div>
</div>

<!-- TAB 2: PLAYING XI -->
<div id="tab-xi" class="tab-content">
    <div class="card">
        <h2>Custom Header Text</h2>
        <input id="xiTopText" placeholder="E.g. TEAM PLAYING XI">
    </div>
    
    <div class="card grid">
        <div style="background:#020617; padding:10px; border:1px solid #10b981; border-radius:5px;"><label style="color:#10b981;">Team A Custom Logo (For XI)</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.xiLogoA = base64; saveData(); }, 300)" accept="image/*"></div>
        <div style="background:#020617; padding:10px; border:1px solid #10b981; border-radius:5px;"><label style="color:#10b981;">Team B Custom Logo (For XI)</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.xiLogoB = base64; saveData(); }, 300)" accept="image/*"></div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Team A - Playing XI</h2>
            <div><button class="blue" onclick="toggleFlag('showXiA', true)">SHOW TEAM A</button><button class="red" onclick="toggleFlag('showXiA', false)">HIDE</button></div>
        </div>
        <div id="xiA-container"></div>
    </div>
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Team B - Playing XI</h2>
            <div><button class="blue" onclick="toggleFlag('showXiB', true)">SHOW TEAM B</button><button class="red" onclick="toggleFlag('showXiB', false)">HIDE</button></div>
        </div>
        <div id="xiB-container"></div>
    </div>
</div>

<!-- TAB 3: PRO PROFILE (3D) -->
<div id="tab-profile" class="tab-content">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>3D Profile Engine (FIFA Style)</h2>
            <div><button class="blue" onclick="toggleFlag('showProfile', true)">SHOW PROFILE</button><button class="red" onclick="toggleFlag('showProfile', false)">HIDE</button></div>
        </div>
        
        <div class="auto-fetch-box grid">
            <div>
                <label style="color:#00e5ff; font-size:14px;">⚡ FETCH FROM TEAM A ⚡</label>
                <select id="autoPlayerSelectA" style="background:#020617; border-color:#00e5ff;" onchange="autoFillProfile(this.value, 'A')">
                    <option value="">-- SELECT TEAM A PLAYER --</option>
                </select>
            </div>
            <div>
                <label style="color:#facc15; font-size:14px;">⚡ FETCH FROM TEAM B ⚡</label>
                <select id="autoPlayerSelectB" style="background:#020617; border-color:#facc15;" onchange="autoFillProfile(this.value, 'B')">
                    <option value="">-- SELECT TEAM B PLAYER --</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Player Name</label><input id="profName">
                <label>Manual Photo Override (Crop Tool)</label>
                <input type="file" onchange="triggerCrop(this, base64 => { matchData.profImg = base64; saveData(); }, 500)" accept="image/*">
                
                <label style="color:#dc2626; margin-top:15px;">Card Bottom Custom Logo</label>
                <input type="file" onchange="triggerCrop(this, base64 => { matchData.profLogo = base64; saveData(); }, 200)" accept="image/*">
            </div>
            <div>
                <label>Primary Stat Value (E.g. "1")</label><input id="profS1V" placeholder="E.g. 1">
                <label>Primary Stat Label (E.g. "Goal")</label><input id="profS1L" placeholder="E.g. Goal">
                <label>Team Nationality/Badge Name</label><input id="profS2V" placeholder="E.g. SPAIN">
            </div>
        </div>
    </div>
</div>

<!-- TAB 4: VERSUS CLASH -->
<div id="tab-vs" class="tab-content">
    <div class="card">
         <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Versus Clash Engine (E-Sports)</h2>
            <div><button class="blue" onclick="toggleFlag('showVs', true)">SHOW CLASH</button><button class="red" onclick="toggleFlag('showVs', false)">HIDE</button></div>
        </div>
        <div align="center" style="margin-bottom: 15px;"><label>Center Title</label><input id="vsTitle" placeholder="E.g. CAPTAINS" style="width:50%;"></div>
        <div class="grid">
            <div style="background:#1e293b; padding:15px; border-radius:8px;">
                <h3 style="color:#a855f7;">LEFT SIDE</h3>
                <label>Custom Team Name</label><input id="vsTeamLName" placeholder="Leave blank for Global Team A">
                <label>Custom Team Logo (Crop)</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.vsLogoL = base64; saveData(); }, 300)" accept="image/*">
                <hr style="border-color:#334155; margin:15px 0;">
                <label>Player Name</label><input id="vsLeftName">
                <label>Player Photo (Crop)</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.vsLeftImg = base64; saveData(); }, 500)" accept="image/*">
            </div>
            <div style="background:#1e293b; padding:15px; border-radius:8px;">
                <h3 style="color:#ef4444;">RIGHT SIDE</h3>
                <label>Custom Team Name</label><input id="vsTeamRName" placeholder="Leave blank for Global Team B">
                <label>Custom Team Logo (Crop)</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.vsLogoR = base64; saveData(); }, 300)" accept="image/*">
                <hr style="border-color:#334155; margin:15px 0;">
                <label>Player Name</label><input id="vsRightName">
                <label>Player Photo (Crop)</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.vsRightImg = base64; saveData(); }, 500)" accept="image/*">
            </div>
        </div>
    </div>
</div>

</div>

<script>
// V33 NANO CORE - CRASH PROOF
const DB_KEY = "BPL_ULTRA_V33"; 

let defaultData = { 
    teamA: "TEAM A", teamB: "TEAM B", teamALogo: "", teamBLogo: "", 
    score: 0, wickets: 0, balls: 0, target: 0, innings: 1, thisOver: [], history: [], 
    b1Name: "BAT 1", b1Runs: 0, b1Balls: 0, b2Name: "BAT 2", b2Runs: 0, b2Balls: 0, onStrike: 1, 
    bowler: "BOWLER", bowlerRuns: 0, bowlerWickets: 0, flashEvent: "", flashId: 0, 
    winnerText: "", showWinner: false, winnerTheme: "glass", showScoreboard: true, tickerText: "🏆 BARAHPURA PREMIER LEAGUE SEASON 1, 2026 🏆",
    showXiA: false, showXiB: false, xiTopText: "TEAM PLAYING XI", xiLogoA: "", xiLogoB: "",
    xiA: Array(11).fill({name: "", img: ""}), xiB: Array(11).fill({name: "", img: ""}),
    showProfile: false, profName: "YAMAL", profImg: "", profLogo: "", profS1V: "1", profS1L: "Goal", profS2V: "SPAIN",
    showVs: false, vsTitle: "CAPTAINS", vsTeamLName: "", vsLogoL: "", vsLeftName: "", vsLeftImg: "", vsTeamRName: "", vsLogoR: "", vsRightName: "", vsRightImg: ""
};

let matchData;
try { let saved = localStorage.getItem(DB_KEY); matchData = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData)); } catch(e) { matchData = JSON.parse(JSON.stringify(defaultData)); }

function saveData() { 
    try { localStorage.setItem(DB_KEY, JSON.stringify(matchData)); } 
    catch(e) { alert("🚨 Browser memory limit (5MB) saved you! But wait, try clearing your history or lowering image size."); } 
}

// 💥 NANO-CORE CROPPER LOGIC (Prevents Storage Crash) 💥
let cropper = null;
let currentCropCallback = null;
let currentCropSize = 300; 

function triggerCrop(inputElement, callback, size = 300) {
    if (inputElement.files && inputElement.files[0]) {
        currentCropSize = size; 
        document.getElementById('cropTitle').innerText = "✂️ SMART CROPPER (" + size + "px)";
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('cropImage').src = e.target.result;
            document.getElementById('cropModal').style.display = 'flex';
            if (cropper) cropper.destroy();
            cropper = new Cropper(document.getElementById('cropImage'), { aspectRatio: 1, viewMode: 1 });
            currentCropCallback = callback;
        };
        reader.readAsDataURL(inputElement.files[0]);
        inputElement.value = ''; 
    }
}

function closeCropper() { document.getElementById('cropModal').style.display = 'none'; if(cropper) cropper.destroy(); }

function saveCrop() {
    if(!cropper) return;
    // Compress at strict dynamic sizes to avoid LocalStorage Quota Error
    let canvas = cropper.getCroppedCanvas({ width: currentCropSize, height: currentCropSize });
    let base64 = canvas.toDataURL('image/webp', 0.65); // 0.65 is the sweet spot for visual quality + small size
    if(currentCropCallback) currentCropCallback(base64);
    closeCropper();
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
    if(tabId === 'tab-profile') populateProfileDropdown();
}

function populateProfileDropdown() {
    let selA = document.getElementById("autoPlayerSelectA"); let htmlA = `<option value="">-- SELECT TEAM A PLAYER --</option>`;
    matchData.xiA.forEach((p, i) => { if(p.name) htmlA += `<option value="${i}">${p.name}</option>`; }); selA.innerHTML = htmlA;
    let selB = document.getElementById("autoPlayerSelectB"); let htmlB = `<option value="">-- SELECT TEAM B PLAYER --</option>`;
    matchData.xiB.forEach((p, i) => { if(p.name) htmlB += `<option value="${i}">${p.name}</option>`; }); selB.innerHTML = htmlB;
}

function autoFillProfile(index, team) {
    if(index === "") return;
    let player = (team === 'A') ? matchData.xiA[index] : matchData.xiB[index];
    if(player) { matchData.profName = player.name; matchData.profImg = player.img; document.getElementById("profName").value = player.name; saveData(); }
}

function renderXiInputs() {
    ['A', 'B'].forEach(t => {
        let html = "";
        for(let i=0; i<11; i++) { 
            // 💥 XI Images forced to 200px max, keeping size tiny! 💥
            html += `<div class="player-row"><input type="text" placeholder="Player ${i+1}" value="${matchData['xi'+t][i].name}" oninput="updateXi('${t}', ${i}, 'name', this.value)"><input type="file" accept="image/*" onchange="triggerCrop(this, base64 => { updateXi('${t}', ${i}, 'img', base64); }, 200)"></div>`; 
        }
        document.getElementById(`xi${t}-container`).innerHTML = html;
    });
}
function updateXi(team, index, key, value) { matchData['xi'+team][index][key] = value; saveData(); }

function saveHistory() { 
    let snap = JSON.parse(JSON.stringify(matchData)); delete snap.history; 
    
    // 🔥 STRIP ALL HEAVY IMAGES FROM HISTORY TO PREVENT CRASH 🔥
    snap.xiA.forEach(p => p.img = ""); snap.xiB.forEach(p => p.img = "");
    snap.profImg = ""; snap.vsLeftImg = ""; snap.vsRightImg = ""; snap.teamALogo = ""; snap.teamBLogo = ""; snap.vsLogoL = ""; snap.vsLogoR = ""; snap.profLogo = ""; snap.xiLogoA = ""; snap.xiLogoB = "";
    
    matchData.history.push(snap); 
    if(matchData.history.length > 5) matchData.history.shift(); // Keep only 5 undos to save memory
}

function getOvers() { return Math.floor(matchData.balls / 6) + "." + (matchData.balls % 6); }
function rotateStrike() { matchData.onStrike = matchData.onStrike === 1 ? 2 : 1; }
function triggerAnimation(type) { matchData.flashEvent = type; matchData.flashId = Date.now(); }
function checkAndClearOver() { let legal = matchData.thisOver.filter(b => !String(b).includes("WD") && !String(b).includes("NB")).length; if (legal >= 6) matchData.thisOver = []; }

function addRun(run) { saveHistory(); checkAndClearOver(); run = parseInt(run); matchData.score += run; matchData.bowlerRuns += run; matchData.balls++; matchData.thisOver.push(run); if(matchData.onStrike === 1) { matchData.b1Runs += run; matchData.b1Balls++; } else { matchData.b2Runs += run; matchData.b2Balls++; } if(run === 4 || run === 6) triggerAnimation(run); if(run % 2 !== 0) rotateStrike(); if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike(); updateUI(); }
function processWicket() { saveHistory(); checkAndClearOver(); let wType = document.getElementById("wicketTypeBox").value; matchData.wickets++; matchData.balls++; matchData.thisOver.push("W"); if(matchData.onStrike === 1) matchData.b1Balls++; else matchData.b2Balls++; if(wType !== "RUN OUT" && wType !== "RETIRED HURT") matchData.bowlerWickets++; triggerAnimation(wType); if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike(); updateUI(); }
function addSmartExtra(type) { saveHistory(); checkAndClearOver(); let extraRuns = parseInt(document.getElementById("in" + type).value) || 0; if(type === 'WD') { let total = 1 + extraRuns; matchData.score += total; matchData.bowlerRuns += total; matchData.thisOver.push(extraRuns > 0 ? `WD+${extraRuns}` : `WD`); if(extraRuns % 2 !== 0) rotateStrike(); triggerAnimation('WIDE'); } else if(type === 'NB') { let total = 1 + extraRuns; matchData.score += total; matchData.bowlerRuns += total; matchData.thisOver.push(extraRuns > 0 ? `NB+${extraRuns}` : `NB`); if(extraRuns % 2 !== 0) rotateStrike(); triggerAnimation('NO BALL'); } else if(type === 'B' || type === 'LB') { matchData.score += extraRuns; matchData.balls++; matchData.thisOver.push(`${extraRuns}${type}`); if(matchData.onStrike === 1) matchData.b1Balls++; else matchData.b2Balls++; if(extraRuns % 2 !== 0) rotateStrike(); if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike(); } updateUI(); }
function undoBall() { if(matchData.history.length === 0) return; let hist = matchData.history; let old = { teamALogo: matchData.teamALogo, teamBLogo: matchData.teamBLogo, xiA: matchData.xiA, xiB: matchData.xiB, profImg: matchData.profImg, vsLeftImg: matchData.vsLeftImg, vsRightImg: matchData.vsRightImg, vsLogoL: matchData.vsLogoL, vsLogoR: matchData.vsLogoR, profLogo: matchData.profLogo, xiLogoA: matchData.xiLogoA, xiLogoB: matchData.xiLogoB }; matchData = hist.pop(); Object.assign(matchData, old); matchData.history = hist; updateUI(); }

function startSecondInnings() { if(!confirm("Start 2nd Innings?")) return; saveHistory(); let tA = matchData.teamA, tB = matchData.teamB, lA = matchData.teamALogo, lB = matchData.teamBLogo; matchData.teamA = tB; matchData.teamB = tA; matchData.teamALogo = lB; matchData.teamBLogo = lA; matchData.target = matchData.score + 1; matchData.score = 0; matchData.wickets = 0; matchData.balls = 0; matchData.b1Runs = 0; matchData.b1Balls = 0; matchData.b2Runs = 0; matchData.b2Balls = 0; matchData.bowlerRuns = 0; matchData.bowlerWickets = 0; matchData.innings = 2; matchData.thisOver = []; matchData.showWinner = false; updateUI(); }
function seasonEndWipe() { if(confirm("🚨 WARNING: Season End Data Wipe. Pakka?")) { localStorage.clear(); location.reload(); } }

function setStrike(n) { matchData.onStrike = n; updateUI(); }
function toggleScoreboard() { matchData.showScoreboard = !matchData.showScoreboard; updateUI(); }
function toggleFlag(flag, state) { if(state && (flag === 'showXiA' || flag === 'showXiB' || flag === 'showVs' || flag === 'showWinner' || flag === 'showProfile')) { matchData.showXiA = false; matchData.showXiB = false; matchData.showVs = false; matchData.showWinner = false; matchData.showProfile = false; } matchData[flag] = state; updateUI(); }

function updateUI() {
    document.getElementById("score").innerText = matchData.score + "/" + matchData.wickets;
    document.getElementById("overs").innerText = getOvers() + " Overs";
    let html = ""; matchData.thisOver.forEach(b => html += `<span class="over-log">${b}</span>`); document.getElementById("thisOver").innerHTML = html;
    
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target", "winnerText", "winnerTheme", "tickerText", "xiTopText", "profName", "profS1L", "profS1V", "profS2V", "vsTitle", "vsTeamLName", "vsLeftName", "vsTeamRName", "vsRightName"].forEach(id => { 
        let el = document.getElementById(id); if(el && document.activeElement !== el) el.value = matchData[id] || ""; 
    });
    document.getElementById("btnStrike1").className = matchData.onStrike===1 ? "badge active" : "badge";
    document.getElementById("btnStrike2").className = matchData.onStrike===2 ? "badge active" : "badge";
    saveData();
}

document.addEventListener("DOMContentLoaded", () => {
    updateUI(); renderXiInputs();
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target", "winnerText", "tickerText", "xiTopText", "profName", "profS1L", "profS1V", "profS2V", "vsTitle", "vsTeamLName", "vsLeftName", "vsTeamRName", "vsRightName"].forEach(id => {
        document.getElementById(id).addEventListener("input", e => { matchData[id] = e.target.type === 'number' ? (parseInt(e.target.value)||0) : e.target.value; saveData(); });
    });
});
</script>
