<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Director | V33 Nano-Core</title>
<!-- Cropper.js for HD Cropping -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
body { background: #050b14; font-family: 'Montserrat', sans-serif; color: #fff; margin: 0; padding: 0; }
.header { background: #0f172a; padding: 15px 20px; text-align: center; border-bottom: 2px solid #00e5ff; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;}
.tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 15px; font-weight: 900; cursor: pointer; border-radius: 8px; transition: 0.3s; text-transform: uppercase; font-size: 12px;}
.tab-btn.active { background: #00e5ff; color: #000; box-shadow: 0 0 15px rgba(0,229,255,0.5); }
.container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
.tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card { background: linear-gradient(145deg, #0b1120, #030712); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0, 229, 255, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
h2 { margin-top: 0; color: #00e5ff; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; font-size: 18px; }
label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; font-weight: bold; box-sizing: border-box; font-family: 'Montserrat', sans-serif;}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
button { padding: 12px; margin: 5px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; border-radius: 8px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
.runBtn { width: 65px; height: 55px; font-size: 22px; border-radius: 10px; }
.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.gold { background: linear-gradient(135deg, #facc15, #ca8a04); color: #000; }
.scoreBox { font-size: 55px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
.badge { background: #1e293b; color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; }
.badge.active { background: #00e5ff; color: #000; }
.over-log { display: inline-block; padding: 5px 10px; background: #000; margin: 2px; border-radius: 5px; font-weight: bold; border: 1px solid #334155; }
.flex-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.flex-row input { margin: 0; width: 80px; text-align: center; font-size: 18px; }
.player-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1e293b;}
.player-row input { margin-bottom: 0; }
.auto-fetch-box { background: rgba(0, 229, 255, 0.1); border: 2px dashed #00e5ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }


/* PREMIUM PROFILE + VERSUS CONTROL ROOM */
#tab-profile .card, #tab-vs .card{position:relative;overflow:hidden;background:radial-gradient(circle at top right,rgba(34,211,238,.08),transparent 28%),radial-gradient(circle at bottom left,rgba(139,92,246,.08),transparent 32%),linear-gradient(145deg,#0d1524,#030712);border-color:rgba(34,211,238,.28);box-shadow:0 18px 55px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.05)}
#tab-profile .card::before,#tab-vs .card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 44%,rgba(255,255,255,.03) 48%,transparent 52%)}
#tab-profile h2,#tab-vs h2{position:relative;color:#a5f3fc;border-bottom-color:rgba(34,211,238,.22);text-shadow:0 0 18px rgba(34,211,238,.14)}
#tab-profile .auto-fetch-box{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(34,211,238,.35);box-shadow:inset 0 0 25px rgba(34,211,238,.035)}
#tab-profile .grid>div,#tab-vs .grid>div{background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(0,0,0,.18));border:1px solid rgba(255,255,255,.06);padding:14px;border-radius:14px}
#tab-vs .grid>div{position:relative;overflow:hidden}
#tab-vs .grid>div:first-child{box-shadow:inset 3px 0 0 #22d3ee}
#tab-vs .grid>div:last-child{box-shadow:inset -3px 0 0 #8b5cf6}
#tab-vs .grid>div::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(34,211,238,.04),transparent 40%,rgba(139,92,246,.04))}
#tab-vs label{color:#94a3b8}
#tab-vs input,#tab-profile input,#tab-profile select{background:#070d18;border-color:#263449}
#tab-vs input:focus,#tab-profile input:focus,#tab-profile select:focus{border-color:#22d3ee;box-shadow:0 0 0 2px rgba(34,211,238,.10),0 0 18px rgba(34,211,238,.08);outline:none}

/* CROPPER MODAL CSS */
#cropModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
#cropContainer { width: 90%; max-width: 600px; height: 60vh; background: #000; }
.crop-controls { margin-top: 20px; display: flex; gap: 10px; }
</style>
</head>
<body>

<!-- HD STUDIO CROPPER MODAL -->

    <div class="card">

        <div class="grid">

            <div><label>Team B Name</label><input id="teamB"><label style="color:#10b981;">Team B Logo</label><input type="file" onchange="triggerCrop(this, base64 => { matchData.teamBLogo = base64; saveData(); }, 600)" accept="image/*"></div>
        </div>
        <div class="grid">
            <div><label>Batsman 1 <button id="btnStrike1" class="badge active" onclick="setStrike(1)">STRIKE</button></label><input id="b1Name"><div style="display:flex; gap:10px;"><input id="b1Runs" type="number" placeholder="Runs"><input id="b1Balls" type="number" placeholder="Balls"></div></div>
            <div><label>Batsman 2 <button id="btnStrike2" class="badge" onclick="setStrike(2)">STRIKE</button></label><input id="b2Name"><div style="display:flex; gap:10px;"><input id="b2Runs" type="number" placeholder="Runs"><input id="b2Balls" type="number" placeholder="Balls"></div></div>

<script>
// V33 NANO CORE - CRASH PROOF
const DB_KEY = "BPL_ULTRA_V33"; 

let defaultData = { 
    teamA: "TEAM A", teamB: "TEAM B", teamALogo: "", teamBLogo: "", 
    score: 0, wickets: 0, balls: 0, target: 0, innings: 1, thisOver: [], history: [], 
    b1Name: "BAT 1", b1Runs: 0, b1Balls: 0, b2Name: "BAT 2", b2Runs: 0, b2Balls: 0, onStrike: 1, 
    bowler: "BOWLER", bowlerRuns: 0, bowlerWickets: 0, flashEvent: "", flashId: 0, 
    winnerText: "", showWinner: false, winnerTheme: "glass", showScoreboard: true, tickerText: "🏆 BARAHPURA PREMIER LEAGUE SEASON 1, 2026 🏆",
    showXiA: false, showXiB: false, xiTopText: "TEAM PLAYING XI", xiLogoA: "", xiLogoB: "",
    xiA: Array.from({length:11}, () => ({name: "", img: ""})), xiB: Array.from({length:11}, () => ({name: "", img: ""})),
    showProfile: false, profLeague: "PLAYER SPOTLIGHT", profJersey: "18", profRole: "BATTER", profName: "PLAYER", profImg: "", profLogo: "", profTeam: "TEAM A",
    profS1V: "0", profS1L: "RUNS", profS2V: "0", profS2L: "STRIKE RATE", profS3V: "0", profS3L: "WICKETS",
    profMeta1: "RIGHT HAND", profMeta2: "INDIA", profMeta3: "ALL-ROUNDER",
    showVs: false, vsTitle: "CAPTAINS", vsTeamLName: "", vsLogoL: "", vsLeftName: "", vsLeftImg: "", vsTeamRName: "", vsLogoR: "", vsRightName: "", vsRightImg: ""
};

let matchData;
function createFreshData(){ return JSON.parse(JSON.stringify(defaultData)); }
function normalizeData(raw){
    const data = createFreshData();
    if(raw && typeof raw === 'object') Object.assign(data, raw);
    ['xiA','xiB'].forEach(key => {
        data[key] = Array.from({length:11}, (_,i) => {
            const p = (Array.isArray(data[key]) && data[key][i]) ? data[key][i] : {};
            return { name: String(p.name || ''), img: String(p.img || '') };
        });
    });
    data.history = Array.isArray(data.history) ? data.history : [];
    return data;
}
try { let saved = localStorage.getItem(DB_KEY); matchData = normalizeData(saved ? JSON.parse(saved) : null); } catch(e) { matchData = createFreshData(); }

const IMAGE_DB_NAME = "BPL_ULTRA_IMAGES_V2";
const IMAGE_STORE = "images";
const IMAGE_CACHE_NAME = "BPL_IMAGE_CACHE_V2";
let imageDbPromise = null;
let imageSaveBusy = false;
// Always keep the live blob in memory first. Persistence is best-effort and never blocks the UI.
const liveMemoryImages = new Map();

function withTimeout(promise, ms, label) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(label || "Operation timed out")), ms))
    ]);
}

function openImageDB() {
    if (imageDbPromise) return imageDbPromise;
    imageDbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
        const req = indexedDB.open(IMAGE_DB_NAME, 1);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(IMAGE_STORE)) db.createObjectStore(IMAGE_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("IndexedDB open failed"));
        req.onblocked = () => reject(new Error("IndexedDB blocked by browser context"));
    });
    return imageDbPromise;
}

function makeImageRef() { return "bplimg:" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }

async function persistImageToIndexedDB(ref, blob) {
    const db = await withTimeout(openImageDB(), 2500, "IndexedDB open timeout");
    await withTimeout(new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE, "readwrite");
        tx.objectStore(IMAGE_STORE).put(blob, ref);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error || new Error("Image save failed"));
        tx.onabort = () => reject(tx.error || new Error("Image save aborted"));
    }), 4000, "Image database save timeout");
}

async function putImageBlob(blob) {
    if (!(blob instanceof Blob) || blob.size === 0) throw new Error("Invalid image data");
    const ref = makeImageRef();
    // Make the image available immediately for OBS live relay.
    liveMemoryImages.set(ref, blob);
    // Persist in the background; NEVER make SAVE CROP wait for storage.
    (async () => {
        try {
            await persistImageToIndexedDB(ref, blob);
            return;
        } catch (e) {
            console.warn("BPL: IndexedDB image persistence failed; trying Cache API", e);
        }
        try { await persistImageToCache(ref, blob); }
        catch (e) { console.warn("BPL: Cache image persistence failed; live memory remains available", e); }
    })();
    return ref;
}

async function getImageBlob(ref) {
    if(!ref) return null;

    try {
        if (ref.startsWith("bplimg:")) {
            try {
                const db = await withTimeout(openImageDB(), 2000, "IndexedDB read timeout");
                const blob = await withTimeout(new Promise((resolve, reject) => {
                    const req = db.transaction(IMAGE_STORE, "readonly").objectStore(IMAGE_STORE).get(ref);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error || new Error("Image read failed"));
                }), 3000, "Image read timeout");
                if (blob) { liveMemoryImages.set(ref, blob); return blob; }
            } catch(e) {}
            if ('caches' in window) {
                try {
                    const cache = await caches.open(IMAGE_CACHE_NAME);
                    const res = await cache.match(new Request(location.origin + '/__bpl_image__/' + encodeURIComponent(ref)));
                    if (res) { const blob = await res.blob(); liveMemoryImages.set(ref, blob); return blob; }
                } catch(e) {}

        }
    } catch(e) {}
    return null;
}

async function blobFromCanvas(canvas, quality = 0.94) {
    if(!canvas || !canvas.width || !canvas.height) throw new Error("Crop canvas is empty");

    // OBS/CEF-safe encoder: prefer JPEG because older embedded Chromium builds can
    // hang on WebP toBlob(). Never leave the Save button waiting for a callback.
    const target = Math.min(1600, Math.max(300, canvas.width, canvas.height));
    let work = canvas;
    if(canvas.width !== target || canvas.height !== target){
        work = document.createElement('canvas');
        work.width = target; work.height = target;
        const ctx = work.getContext('2d', {alpha:false});
        if(!ctx) throw new Error('Canvas context unavailable');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,target,target);
        ctx.drawImage(canvas,0,0,target,target);
    }

    // 1) JPEG toBlob with a short hard timeout.
    try {
        const blob = await new Promise((resolve, reject) => {
            let settled = false;
            const finish = (fn, value) => { if(settled) return; settled=true; clearTimeout(timer); fn(value); };
            const timer = setTimeout(() => finish(reject, new Error('Canvas encoder timeout')), 2500);
            try {
                work.toBlob(b => b && b.size ? finish(resolve,b) : finish(reject,new Error('JPEG encoding failed')), 'image/jpeg', quality);
            } catch(e) { finish(reject,e); }
        });
        return blob;
    } catch(e) {
        console.warn('BPL: JPEG toBlob unavailable, using dataURL fallback', e);
    }

    // 2) Synchronous dataURL fallback. This works in embedded OBS/CEF builds
    // where toBlob is unreliable. It is immediately converted back to a Blob.
    try {
        const dataUrl = work.toDataURL('image/jpeg', quality);
        const comma = dataUrl.indexOf(',');
        if(comma < 0) throw new Error('Invalid canvas dataURL');
        const binary = atob(dataUrl.slice(comma + 1));
        const bytes = new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], {type:'image/jpeg'});
    } catch(e) {
        throw new Error('Photo encoding failed in this OBS browser: ' + (e && e.message || e));
    }
}

// HD cropper: quality is kept high, while image bytes are kept OUT of localStorage.
let cropper = null;
let currentCropCallback = null;
let currentCropSize = 1400;
let currentCropFile = null;

function triggerCrop(inputElement, callback, size = 1400) {
    if (inputElement.files && inputElement.files[0]) {
        currentCropSize = Math.max(300, Math.min(2048, Number(size) || 1400));
        document.getElementById('cropTitle').innerText = "✂️ HD SMART CROPPER (up to " + currentCropSize + "px)";
        const file = inputElement.files[0];
        currentCropFile = file;
        const objectUrl = URL.createObjectURL(file);
        document.getElementById('cropImage').src = objectUrl;
        document.getElementById('cropImage').dataset.objectUrl = objectUrl;
        document.getElementById('cropModal').style.display = 'flex';
            if (cropper) { try { cropper.destroy(); } catch(e) {} cropper = null; }
            const imgEl = document.getElementById('cropImage');
            const buildCropper = () => {
            if (typeof Cropper === 'function') {
                cropper = new Cropper(document.getElementById('cropImage'), { aspectRatio: 1, viewMode: 1, autoCropArea: 0.96, responsive: true, background: false, checkOrientation: true, guides: true, center: true, highlight: false, dragMode: 'move', zoomOnWheel: true, zoomOnTouch: true });
            } else {
                cropper = {
                    _native: true,
                    image: document.getElementById('cropImage'),
                    getImageData(){ return { naturalWidth: this.image.naturalWidth || currentCropSize, naturalHeight: this.image.naturalHeight || currentCropSize }; },
                    getCroppedCanvas(opts){
                        const img=this.image, sw=img.naturalWidth||img.width, sh=img.naturalHeight||img.height;
                        const side=Math.min(sw,sh), sx=(sw-side)/2, sy=(sh-side)/2;
                        const c=document.createElement('canvas'); c.width=opts.width; c.height=opts.height; const ctx=c.getContext('2d',{alpha:true}); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(img,sx,sy,side,side,0,0,c.width,c.height); return c;
                    }, destroy(){}
                };
            }
            };
            if (imgEl.complete && imgEl.naturalWidth) buildCropper();
            else imgEl.onload = buildCropper;
        currentCropCallback = callback;

function closeCropper() { const imgEl=document.getElementById('cropImage'); const u=imgEl && imgEl.dataset.objectUrl; if(u){ try{URL.revokeObjectURL(u);}catch(e){} delete imgEl.dataset.objectUrl; } if(imgEl) imgEl.onload = null; document.getElementById('cropModal').style.display = 'none'; if(cropper) { cropper.destroy(); cropper = null; } currentCropCallback = null; currentCropFile = null; }

async function saveCrop() {
    if(!cropper || imageSaveBusy) return;
    imageSaveBusy = true;
    const button = document.querySelector('#cropModal .green');
    const title = document.getElementById('cropTitle');
    if(button) { button.disabled = true; button.innerText = '⏳ PROCESSING...'; }

    const finishWithBlob = async (blob) => {
        if(!blob || !blob.size) throw new Error('Image encoding produced no data');
        if(title) title.innerText = '💾 SAVING PHOTO...';
        // The reference is created in memory immediately. Persistent storage is
        // deliberately best-effort and cannot block this save operation.
        const ref = await withTimeout(putImageBlob(blob), 5000, 'Live image staging timeout');
        if(!ref) throw new Error('Image staging failed');
        const cb = currentCropCallback;
        if(typeof cb === 'function') cb(ref);
        closeCropper();
        saveData();
        updateUI();
        // Give the worker one deterministic image push after the state ref exists.
        await broadcastVisibleImages();
        return true;
    };

    try {
        const imageInfo = cropper.getImageData ? cropper.getImageData() : {};
        const naturalW = Number(imageInfo.naturalWidth) || (currentCropFile && currentCropFile.width) || currentCropSize;
        const naturalH = Number(imageInfo.naturalHeight) || (currentCropFile && currentCropFile.height) || currentCropSize;
        const sourceLimit = Math.max(1, Math.floor(Math.min(naturalW, naturalH)));
        const outputSize = Math.max(300, Math.min(currentCropSize, sourceLimit, 1600));
        if(title) title.innerText = '⚡ PROCESSING HD PHOTO...';

        let canvas = null;
        try {
            canvas = cropper.getCroppedCanvas({width:outputSize,height:outputSize,imageSmoothingEnabled:true,imageSmoothingQuality:'high',fillColor:'transparent'});
        } catch(e) { console.warn('BPL crop canvas failed; using source image fallback', e); }

        if(canvas && canvas.width && canvas.height) {
            try {
                const blob = await blobFromCanvas(canvas, 0.94);
                await finishWithBlob(blob);
                return;
            } catch(e) {
                console.warn('BPL canvas encoding failed; trying original file fallback', e);
            }
        }

        // Last-resort OBS/CEF path: preserve the original file instead of failing
        // the upload. The image will still be sharp; cropping can be retried later.
        if(currentCropFile instanceof File && currentCropFile.size > 0) {
            await finishWithBlob(currentCropFile);
            return;
        }
        throw new Error('No usable image data available');
    } catch(err) {
        console.error('BPL photo save failed', err);
        if(title) title.innerText = '❌ SAVE FAILED — SELECT PHOTO AGAIN';
    } finally {
        imageSaveBusy = false;
        if(button) { button.disabled = false; button.innerText = '✅ SAVE CROP'; }
    }
}

        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener("input", e => { matchData[id] = e.target.type === 'number' ? (parseInt(e.target.value)||0) : e.target.value; saveData(); });
    });
});
</script>

</body>
</html>
