<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Director Panel | V27 Titan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
body { background: #050b14; font-family: 'Montserrat', sans-serif; color: #fff; margin: 0; padding: 0; }
.header { background: #0f172a; padding: 15px 20px; text-align: center; border-bottom: 2px solid #00e5ff; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;}
.tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 15px; font-weight: 900; cursor: pointer; border-radius: 8px; transition: 0.3s; text-transform: uppercase; font-size: 12px;}
.tab-btn.active { background: #00e5ff; color: #000; box-shadow: 0 0 15px rgba(0,229,255,0.5); border-color: #00e5ff; }
.container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
.tab-content { display: none; } .tab-content.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card { background: linear-gradient(145deg, #0b1120, #030712); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0, 229, 255, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
h2 { margin-top: 0; color: #00e5ff; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; font-size: 18px; }
label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; font-weight: bold; transition: 0.3s; box-sizing: border-box; font-family: 'Montserrat', sans-serif;}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
button { padding: 12px; margin: 5px; font-size: 14px; font-weight: 900; cursor: pointer; border: none; border-radius: 8px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
.runBtn { width: 65px; height: 55px; font-size: 22px; border-radius: 10px; }
.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.gold { background: linear-gradient(135deg, #facc15, #ca8a04); color: #000; }
.scoreBox { font-size: 55px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
.badge { background: #1e293b; color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; }
.badge.active { background: #00e5ff; color: #000; }
.over-log { display: inline-block; padding: 5px 10px; background: #000; margin: 2px; border-radius: 5px; font-weight: bold; border: 1px solid #334155; }
.flex-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.flex-row input { margin: 0; width: 80px; text-align: center; font-size: 18px; }
.player-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1e293b;}
.player-row input { margin-bottom: 0; }
</style>
</head>
<body>

<div class="header">
    <button class="tab-btn active" onclick="switchTab('tab-live')">🔴 Match Engine</button>
    <button class="tab-btn" onclick="switchTab('tab-xi')">👥 Playing XI</button>
    <button class="tab-btn" onclick="switchTab('tab-profile')">👤 Pro Profile</button>
    <button class="tab-btn" onclick="switchTab('tab-vs')">⚡ Versus Clash</button>
</div>

<div class="container">

<!-- ================= TAB 1: LIVE MATCH ENGINE (RESTORED V25 CORE) ================= -->
<div id="tab-live" class="tab-content active">
    
    <div class="card">
        <h2>1. Team Setup</h2>
        <div class="grid">
            <div><label>Team A Name</label><input id="teamA"><label style="color:#10b981;">Team A Logo</label><input type="file" id="teamALogo" accept="image/*"></div>
            <div><label>Team B Name</label><input id="teamB"><label style="color:#10b981;">Team B Logo</label><input type="file" id="teamBLogo" accept="image/*"></div>
        </div>
        <div class="grid">
            <div><label>Batsman 1 <button id="btnStrike1" class="badge active" onclick="setStrike(1)">STRIKE</button></label><input id="b1Name"><div style="display:flex; gap:10px;"><input id="b1Runs" type="number" placeholder="Runs"><input id="b1Balls" type="number" placeholder="Balls"></div></div>
            <div><label>Batsman 2 <button id="btnStrike2" class="badge" onclick="setStrike(2)">STRIKE</button></label><input id="b2Name"><div style="display:flex; gap:10px;"><input id="b2Runs" type="number" placeholder="Runs"><input id="b2Balls" type="number" placeholder="Balls"></div></div>
        </div>
        <div class="grid">
            <div><label>Bowler</label><input id="bowler"><div style="display:flex; gap:10px;"><input id="bowlerWickets" type="number" placeholder="W"><input id="bowlerRuns" type="number" placeholder="R"></div></div>
            <div><label>Target</label><input id="target" type="number"></div>
        </div>
    </div>

    <div class="card" style="text-align: center;">
        <div class="scoreBox" id="score">0/0</div>
        <div id="overs" style="font-size:26px; color:#94a3b8; font-weight:bold;">0.0 Overs</div>
        <div id="thisOver" style="margin-top:15px; min-height: 40px;"></div>
    </div>

    <div class="card">
        <h2>2. Action Room & Extras</h2>
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="runBtn green" onclick="addRun(0)">0</button>
            <button class="runBtn green" onclick="addRun(1)">1</button>
            <button class="runBtn green" onclick="addRun(2)">2</button>
            <button class="runBtn green" onclick="addRun(3)">3</button>
            <button class="runBtn gold" onclick="addRun(4)">4</button>
            <button class="runBtn blue" onclick="addRun(5)">5</button>
            <button class="runBtn gold" onclick="addRun(6)">6</button>
            <button class="runBtn blue" style="width:auto; padding: 0 20px;" onclick="undoBall()">UNDO</button>
        </div>
        <div class="grid">
            <div style="background: #020617; padding: 15px; border-radius: 8px; border: 1px solid #1e293b;">
                <label style="color:#00e5ff;">🛠️ Extras Engine</label><br><br>
                <div class="flex-row"><button class="blue" style="width: 120px;" onclick="addSmartExtra('WD')">WIDE +</button><input type="number" id="inWD" value="0"></div>
                <div class="flex-row"><button class="gold" style="width: 120px;" onclick="addSmartExtra('NB')">NO BALL +</button><input type="number" id="inNB" value="0"></div>
                <div class="flex-row"><button class="blue" style="background:#7e22ce; width: 120px;" onclick="addSmartExtra('B')">BYE +</button><input type="number" id="inB" value="1"></div>
                <div class="flex-row"><button class="blue" style="background:#ea580c; width: 120px;" onclick="addSmartExtra('LB')">LEG BYE +</button><input type="number" id="inLB" value="1"></div>
            </div>
            <div style="background: #020617; padding: 15px; border-radius: 8px; border: 1px solid #1e293b;">
                <label style="color:#ef4444;">🔴 Smart Wickets</label><br><br>
                <select id="wicketTypeBox">
                    <option value="BOWLED">Bowled</option><option value="CAUGHT">Caught</option><option value="CAUGHT BEHIND">Caught Behind</option>
                    <option value="LBW">LBW</option><option value="STUMPED">Stumped</option><option value="RUN OUT">Run Out</option><option value="RETIRED HURT">Retired Hurt</option>
                </select>
                <button class="red" style="width: 100%; padding: 15px; font-size: 18px;" onclick="processWicket()">🚨 OUT!</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>📺 Broadcast & Ticker</h2>
        <div class="grid">
            <div><label>Live Ticker Message</label><input id="tickerText"></div>
            <div><label>Match Winner Team Text</label><input id="winnerText"></div>
        </div>
        <div style="display:flex; justify-content:space-between; flex-wrap: wrap; gap:10px;">
            <button class="blue" style="flex:1; background:#0f766e;" onclick="toggleScoreboard()">👁️ TOGGLE SCOREBOARD</button>
            <button class="gold" style="flex:1;" onclick="toggleFlag('showWinner', true)">🏆 SHOW FULL WINNER</button>
            <button class="red" style="flex:1;" onclick="toggleFlag('showWinner', false)">❌ HIDE WINNER</button>
        </div>
    </div>
</div>

<!-- ================= TAB 2: PLAYING XI ================= -->
<div id="tab-xi" class="tab-content">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Team A - Playing XI</h2>
            <div><button class="blue" onclick="toggleFlag('showXiA', true)">SHOW TEAM A</button></div>
        </div>
        <div id="xiA-container"></div>
    </div>
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Team B - Playing XI</h2>
            <div><button class="blue" onclick="toggleFlag('showXiB', true)">SHOW TEAM B</button></div>
        </div>
        <div id="xiB-container"></div>
    </div>
    <button class="red" style="width:100%;" onclick="toggleFlag('showXiA', false); toggleFlag('showXiB', false);">❌ HIDE PLAYING XI</button>
</div>

<!-- ================= TAB 3: PRO PROFILE ================= -->
<div id="tab-profile" class="tab-content">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Player Profile Engine (Left Side)</h2>
            <div><button class="blue" onclick="toggleFlag('showProfile', true)">SHOW PROFILE</button><button class="red" onclick="toggleFlag('showProfile', false)">HIDE</button></div>
        </div>
        <div class="grid">
            <div><label>Player Name</label><input id="profName"><label>Photo (Auto-Compressed)</label><input type="file" id="profImg" accept="image/*"></div>
            <div>
                <label>Stat 1</label><input id="profS1L" placeholder="Label"><input id="profS1V" placeholder="Value">
                <label>Stat 2</label><input id="profS2L" placeholder="Label"><input id="profS2V" placeholder="Value">
                <label>Stat 3</label><input id="profS3L" placeholder="Label"><input id="profS3V" placeholder="Value">
            </div>
        </div>
    </div>
</div>

<!-- ================= TAB 4: VERSUS CLASH ================= -->
<div id="tab-vs" class="tab-content">
    <div class="card">
         <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Versus Clash Engine (Center)</h2>
            <div><button class="blue" onclick="toggleFlag('showVs', true)">SHOW CLASH</button><button class="red" onclick="toggleFlag('showVs', false)">HIDE</button></div>
        </div>
        <div align="center" style="margin-bottom: 15px;"><label>Center Title</label><input id="vsTitle" placeholder="E.g. CAPTAINS" style="width:50%;"></div>
        <div class="grid">
            <div style="background:#1e293b; padding:15px; border-radius:8px;"><h3 style="color:#a855f7;">LEFT SIDE</h3><label>Name / Team</label><input id="vsLeftName"><label>Photo</label><input type="file" id="vsLeftImg" accept="image/*"></div>
            <div style="background:#1e293b; padding:15px; border-radius:8px;"><h3 style="color:#ef4444;">RIGHT SIDE</h3><label>Name / Team</label><input id="vsRightName"><label>Photo</label><input type="file" id="vsRightImg" accept="image/*"></div>
        </div>
    </div>
</div>

</div>

<script>
// V27 TITAN KEY - Complete Data Structure (Merged V25 + V26)
const DB_KEY = "BPL_TITAN_V27"; 
let defaultData = { 
    teamA: "TEAM A", teamB: "TEAM B", teamALogo: "", teamBLogo: "", 
    score: 0, wickets: 0, balls: 0, target: 0, innings: 1, thisOver: [], history: [], 
    b1Name: "BAT 1", b1Runs: 0, b1Balls: 0, b2Name: "BAT 2", b2Runs: 0, b2Balls: 0, onStrike: 1, 
    bowler: "BOWLER", bowlerRuns: 0, bowlerWickets: 0, flashEvent: "", flashId: 0, 
    winnerText: "", showWinner: false, showScoreboard: true, 
    tickerText: "🏆 BARAHPURA PREMIER LEAGUE SEASON 1, 2026 | POWERED BY A2 SERIES 🏆",
    showXiA: false, showXiB: false, showProfile: false, showVs: false,
    xiA: Array(11).fill({name: "", img: ""}), xiB: Array(11).fill({name: "", img: ""}),
    profName: "BABAR", profImg: "", profS1L: "MATCHES", profS1V: "0", profS2L: "RUNS", profS2V: "0", profS3L: "STRIKE RATE", profS3V: "0",
    vsTitle: "PARTNERSHIP", vsLeftName: "", vsLeftImg: "", vsRightName: "", vsRightImg: ""
};

let matchData;
try { let saved = localStorage.getItem(DB_KEY); matchData = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData)); } catch(e) { matchData = JSON.parse(JSON.stringify(defaultData)); }

function saveData() { try { localStorage.setItem(DB_KEY, JSON.stringify(matchData)); } catch(e) { alert("Storage Limit! Use smaller photos."); } }

// Tab Switcher
function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
}

// 💥 NANO-COMPRESSION AI (Resizes to 120px to easily fit 25+ images in 5MB limit) 💥
function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            const MAX_SIZE = 120; // Extra aggressive compression for stability
            if(w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } 
            else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL("image/webp", 0.4)); // WebP is king for LocalStorage
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

// Render XI Inputs
function renderXiInputs() {
    ['A', 'B'].forEach(t => {
        let html = "";
        for(let i=0; i<11; i++) {
            html += `<div class="player-row"><input type="text" placeholder="Player ${i+1}" value="${matchData['xi'+t][i].name}" oninput="updateXi('${t}', ${i}, 'name', this.value)"><input type="file" accept="image/*" onchange="handleXiImg(this, '${t}', ${i})"></div>`;
        }
        document.getElementById(`xi${t}-container`).innerHTML = html;
    });
}
function updateXi(team, index, key, value) { matchData['xi'+team][index][key] = value; saveData(); }
function handleXiImg(input, team, index) { if(input.files[0]) compressImage(input.files[0], (base64) => { updateXi(team, index, 'img', base64); }); }

// Restored V25 Core Logic
function getOvers() { return Math.floor(matchData.balls / 6) + "." + (matchData.balls % 6); }
function saveHistory() { let snap = JSON.parse(JSON.stringify(matchData)); delete snap.history; matchData.history.push(snap); if(matchData.history.length > 30) matchData.history.shift(); }
function rotateStrike() { matchData.onStrike = matchData.onStrike === 1 ? 2 : 1; }
function triggerAnimation(type) { matchData.flashEvent = type; matchData.flashId = Date.now(); }
function checkAndClearOver() { let legal = matchData.thisOver.filter(b => !String(b).includes("WD") && !String(b).includes("NB")).length; if (legal >= 6) { matchData.thisOver = []; } }

function addRun(run) {
    saveHistory(); checkAndClearOver(); run = parseInt(run);
    matchData.score += run; matchData.bowlerRuns += run; matchData.balls++; matchData.thisOver.push(run);
    if(matchData.onStrike === 1) { matchData.b1Runs += run; matchData.b1Balls++; } else { matchData.b2Runs += run; matchData.b2Balls++; }
    if(run === 4 || run === 6) triggerAnimation(run);
    if(run % 2 !== 0) rotateStrike(); if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike();
    updateUI();
}

function processWicket() {
    saveHistory(); checkAndClearOver(); let wType = document.getElementById("wicketTypeBox").value; 
    matchData.wickets++; matchData.balls++; matchData.thisOver.push("W");
    if(matchData.onStrike === 1) matchData.b1Balls++; else matchData.b2Balls++;
    if(wType !== "RUN OUT" && wType !== "RETIRED HURT") { matchData.bowlerWickets++; }
    triggerAnimation(wType); if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike(); updateUI();
}

function addSmartExtra(type) {
    saveHistory(); checkAndClearOver(); let extraRuns = parseInt(document.getElementById("in" + type).value) || 0;
    if(type === 'WD') {
        let total = 1 + extraRuns; matchData.score += total; matchData.bowlerRuns += total; matchData.thisOver.push(extraRuns > 0 ? `WD+${extraRuns}` : `WD`);
        if(extraRuns % 2 !== 0) rotateStrike(); triggerAnimation('WIDE');
    } else if(type === 'NB') {
        let total = 1 + extraRuns; matchData.score += total; matchData.bowlerRuns += total; matchData.thisOver.push(extraRuns > 0 ? `NB+${extraRuns}` : `NB`);
        if(extraRuns % 2 !== 0) rotateStrike(); triggerAnimation('NO BALL');
    } else if(type === 'B' || type === 'LB') {
        matchData.score += extraRuns; matchData.balls++; matchData.thisOver.push(`${extraRuns}${type}`);
        if(matchData.onStrike === 1) matchData.b1Balls++; else matchData.b2Balls++;
        if(extraRuns % 2 !== 0) rotateStrike(); if(matchData.balls > 0 && matchData.balls % 6 === 0) rotateStrike();
    }
    updateUI();
}

function undoBall() { if(matchData.history.length === 0) return; matchData = matchData.history.pop(); updateUI(); }
function setStrike(n) { matchData.onStrike = n; updateUI(); }
function toggleScoreboard() { matchData.showScoreboard = !matchData.showScoreboard; updateUI(); }

function toggleFlag(flag, state) { 
    if(state && (flag === 'showXiA' || flag === 'showXiB' || flag === 'showVs' || flag === 'showWinner' || flag === 'showProfile')) {
        matchData.showXiA = false; matchData.showXiB = false; matchData.showVs = false; matchData.showWinner = false; matchData.showProfile = false;
    }
    matchData[flag] = state; updateUI(); 
}

function updateUI() {
    document.getElementById("score").innerText = matchData.score + "/" + matchData.wickets;
    document.getElementById("overs").innerText = getOvers() + " Overs";
    let html = ""; matchData.thisOver.forEach(b => html += `<span class="over-log">${b}</span>`); document.getElementById("thisOver").innerHTML = html;
    
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target", "winnerText", "tickerText", 
     "profName", "profS1L", "profS1V", "profS2L", "profS2V", "profS3L", "profS3V", "vsTitle", "vsLeftName", "vsRightName"].forEach(id => { 
        let el = document.getElementById(id); if(el && document.activeElement !== el) el.value = matchData[id] || ""; 
    });
    document.getElementById("btnStrike1").className = matchData.onStrike===1 ? "badge active" : "badge";
    document.getElementById("btnStrike2").className = matchData.onStrike===2 ? "badge active" : "badge";
    saveData();
}

document.addEventListener("DOMContentLoaded", () => {
    updateUI(); renderXiInputs();
    ["teamA", "teamB", "b1Name", "b1Runs", "b1Balls", "b2Name", "b2Runs", "b2Balls", "bowler", "bowlerRuns", "bowlerWickets", "target", "winnerText", "tickerText",
     "profName", "profS1L", "profS1V", "profS2L", "profS2V", "profS3L", "profS3V", "vsTitle", "vsLeftName", "vsRightName"].forEach(id => {
        document.getElementById(id).addEventListener("input", e => { matchData[id] = e.target.type === 'number' ? (parseInt(e.target.value)||0) : e.target.value; saveData(); });
    });
    
    ["teamALogo", "teamBLogo", "profImg", "vsLeftImg", "vsRightImg"].forEach(id => {
        let el = document.getElementById(id); if(!el) return;
        el.addEventListener("change", e => { if(e.target.files[0]) compressImage(e.target.files[0], base64 => { matchData[id] = base64; saveData(); }); });
    });
});
</script>
</body>
</html>
