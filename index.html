<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Premium TV Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: transparent; overflow: hidden; font-family: 'Roboto Condensed', sans-serif; }
    .overlay-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }

    .bottom-scorebar {
        position:absolute; bottom:55px; left:50%; transform:translateX(-50%);
        width:92%; height:90px; background: rgba(10, 15, 30, 0.95);
        border-top: 3px solid #ffcc00; border-bottom: 1px solid rgba(255, 204, 0, 0.3);
        display:flex; align-items:center;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.7), 0 0 15px rgba(255, 204, 0, 0.2);
        clip-path: polygon(1% 0, 99% 0, 100% 100%, 0% 100%);
    }

    .team-section { width: 220px; display:flex; align-items:center; justify-content:center; gap:12px; padding:0 10px; }
    .team-name { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 1px; }

    .score-center {
        width: 200px; text-align: center;
        background: linear-gradient(180deg, rgba(255, 204, 0, 0.15) 0%, transparent 100%);
        height: 100%; display: flex; flex-direction: column; justify-content: center;
        border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1);
    }
    
    .score-large { 
        font-family: 'Montserrat', sans-serif; font-size: 52px; font-weight: 900; line-height: 1;
        background: linear-gradient(90deg, #fff, #ffcc00, #fff); background-size: 200% auto;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: goldShine 3s linear infinite; filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.8));
    }
    @keyframes goldShine { to { background-position: 200% center; } }
    
    .overs-large { font-size: 16px; font-weight: 700; color: #ffcc00; letter-spacing: 2px; margin-top: -2px; }

    .batsman-panel, .bowler-panel { width: 250px; padding: 0 20px; }
    .batsman-row { display:flex; justify-content:space-between; align-items: center; padding: 3px 0; }
    .batsman-name { font-size: 16px; font-weight: 700; text-transform: uppercase; transition: all 0.3s ease; }
    .batsman-score { font-size: 18px; font-weight: 700; color: white; transition: all 0.3s ease; }
    .batsman-score span { font-size: 14px; color: #888; }

    /* The Strike Glow Effect */
    .on-strike { color: white; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
    .off-strike { color: #666; }
    .off-strike .batsman-score { color: #999; }
    .striker-icon { color: #ffcc00; font-size: 12px; margin-right: 5px; opacity: 0; }
    .on-strike .striker-icon { opacity: 1; }

    .bowler-name { font-size: 18px; font-weight: 700; color: #ffcc00; text-transform: uppercase; }
    .bowler-figures { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; color: white; letter-spacing: 1px; }
    
    .this-over { display:flex; gap:6px; margin-top:4px; }
    .ball { 
        width: 22px; height: 22px; border-radius: 50%; background: #333; color: white;
        display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 700;
        border: 1px solid #555;
    }
    .ball.run { background: #0056b3; border-color:#007bff; }
    .ball.four { background: #008a3c; border-color:#00e664; color:white; }
    .ball.six { background: #7b2cbf; border-color:#9d4edd; color:white; }
    .ball.wicket { background: #d62828; border-color:#ff4d4d; color:#ffcc00; font-weight: 900;}

    .need-panel { 
        width: 130px; text-align: center; background: rgba(255, 204, 0, 0.1); 
        padding: 5px; border-radius: 8px; border: 1px solid #ffcc00; margin: 0 10px;
    }
    .need-title { font-size: 12px; font-weight: 700; color: #ffcc00; letter-spacing: 1px; }
    .need-runs { font-family: 'Montserrat', sans-serif; font-size: 30px; font-weight: 900; color: white; line-height: 1; }

    .ticker-bar {
        position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
        width:90%; height:30px; background: #000; border-radius: 4px; overflow: hidden;
    }
    .ticker-content {
        white-space: nowrap; font-size: 14px; font-weight: 700; color: #ffcc00; line-height: 30px;
        letter-spacing: 2px; animation: tickerMove 25s linear infinite; text-transform: uppercase;
    }
    @keyframes tickerMove { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    #animation-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    
    @keyframes slamBlast {
        0% { transform: translate(-50%, -50%) scale(5); opacity: 0; filter: blur(10px); }
        15% { transform: translate(-50%, -50%) scale(1) skewX(-10deg); opacity: 1; filter: blur(0px); }
        85% { transform: translate(-50%, -50%) scale(1.1) skewX(0deg); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }

    .ipl-graphic {
        position: absolute; top: 35%; left: 50%;
        font-family: 'Montserrat', sans-serif; font-size: 110px; font-style: italic; font-weight: 900; 
        color: white; text-transform: uppercase; letter-spacing: 5px; padding: 15px 70px; 
        border-radius: 10px; animation: slamBlast 3.5s forwards; 
        text-shadow: 5px 5px 0px #000; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
    }
    
    .ipl-graphic.four { background: linear-gradient(90deg, #004e92, #000428); border-bottom: 8px solid #00c6ff; box-shadow: 0 20px 50px rgba(0, 198, 255, 0.5); }
    .ipl-graphic.six { background: linear-gradient(90deg, #cb2d3e, #ef473a); border-bottom: 8px solid #ffcc00; box-shadow: 0 20px 50px rgba(255, 204, 0, 0.5); }
    .ipl-graphic.wicket { background: #000; color: #ff2a2a; border-bottom: 8px solid #ff2a2a; box-shadow: 0 20px 50px rgba(255, 42, 42, 0.5); }
</style>
</head>
<body>

<div class="overlay-container">
    <div id="animation-container"></div>
    <div class="bottom-scorebar">
        <div class="team-section left">
            <div class="team-name" id="team1Name">TEAM A</div>
        </div>
        <div class="score-center">
            <div id="scoreLarge" class="score-large">0/0</div>
            <div id="oversLarge" class="overs-large">0.0 OVERS</div>
        </div>
        
        <div class="batsman-panel">
            <div class="batsman-row" id="rowB1">
                <div class="batsman-name"><span class="striker-icon">▶</span> <span id="b1NameDisplay">PLAYER 1</span></div>
                <div class="batsman-score" id="b1ScoreDisplay">0 <span>(0)</span></div>
            </div>
            <div class="batsman-row" id="rowB2">
                <div class="batsman-name"><span class="striker-icon">▶</span> <span id="b2NameDisplay">PLAYER 2</span></div>
                <div class="batsman-score" id="b2ScoreDisplay">0 <span>(0)</span></div>
            </div>
        </div>
        
        <div class="need-panel" id="targetBox" style="display:none;">
            <div class="need-title">TARGET</div>
            <div id="needRuns" class="need-runs">0</div>
        </div>
        <div class="bowler-panel">
            <div class="bowler-name" id="bowlerName">BOWLER</div>
            <div class="bowler-figures" id="bowlerFigures">0-0</div>
            <div class="this-over" id="thisOverBalls"></div>
        </div>
        <div class="team-section right">
            <div class="team-name" id="team2Name">TEAM B</div>
        </div>
    </div>
    <div class="ticker-bar">
        <div class="ticker-content">
            🏆 BHIKHANPUR PREMIUM LEAGUE LIVE 🏆 | SPONSORED BY DIGITAL PROMOTION | CONTACT : 8252001148 | LIKE & SUBSCRIBE
        </div>
    </div>
</div>

<script>
let lastFlashId = 0; 

function fireIPLAnimation(type) {
    const container = document.getElementById("animation-container");
    container.innerHTML = ""; 
    const animBox = document.createElement("div");
    
    if (type === 4) { animBox.className = "ipl-graphic four"; animBox.innerText = "FOUR!"; } 
    else if (type === 6) { animBox.className = "ipl-graphic six"; animBox.innerText = "MAXIMUM!"; } 
    else if (type === "W") { animBox.className = "ipl-graphic wicket"; animBox.innerText = "OUT!"; }

    container.appendChild(animBox);
    setTimeout(() => { animBox.remove(); }, 3500);
}

function loadData(){
    const data = JSON.parse(localStorage.getItem("bplData"));
    if(!data) return;

    if (data.flashId && data.flashId !== lastFlashId) {
        fireIPLAnimation(data.flashEvent);
        lastFlashId = data.flashId;
    }

    const score = (data.score || 0) + "-" + (data.wickets || 0);
    const overs = Math.floor((data.balls || 0)/6) + "." + ((data.balls || 0)%6);

    document.getElementById("scoreLarge").innerText = score;
    document.getElementById("oversLarge").innerText = overs + " OVERS";

    document.getElementById("team1Name").innerText = data.teamA;
    document.getElementById("team2Name").innerText = data.teamB;

    // Names and Scores assignment
    document.getElementById("b1NameDisplay").innerText = data.b1Name || "BATSMAN 1";
    document.getElementById("b1ScoreDisplay").innerHTML = `${data.b1Runs || 0} <span>(${data.b1Balls || 0})</span>`;
    
    document.getElementById("b2NameDisplay").innerText = data.b2Name || "BATSMAN 2";
    document.getElementById("b2ScoreDisplay").innerHTML = `${data.b2Runs || 0} <span>(${data.b2Balls || 0})</span>`;

    // THE GOLDEN GLOW STRIKE LOGIC
    if (data.onStrike === 1) {
        document.getElementById("rowB1").className = "batsman-row on-strike";
        document.getElementById("rowB2").className = "batsman-row off-strike";
    } else {
        document.getElementById("rowB1").className = "batsman-row off-strike";
        document.getElementById("rowB2").className = "batsman-row on-strike";
    }

    document.getElementById("bowlerName").innerText = data.bowler || "BOWLER";
    document.getElementById("bowlerFigures").innerText = `${data.bowlerWickets || 0}-${data.bowlerRuns || 0}`;

    const targetBox = document.getElementById("targetBox");
    if(data.innings === 2 && data.target > 0) {
        targetBox.style.display = "block";
        document.getElementById("needRuns").innerText = data.target;
    } else {
        targetBox.style.display = "none";
    }

    let html = "";
    (data.thisOver || []).forEach(ball => {
        let cls = "ball";
        if(ball === 4) cls += " four";
        else if(ball === 6) cls += " six";
        else if(ball === "W") cls += " wicket";
        else if(ball === "WD" || ball === "NB") cls += " extra";
        else cls += " run";
        html += `<span class="${cls}">${ball}</span>`;
    });
    document.getElementById("thisOverBalls").innerHTML = html;
}

window.addEventListener('storage', loadData);
loadData();
setInterval(loadData, 200); 
</script>
</body>
</html>
