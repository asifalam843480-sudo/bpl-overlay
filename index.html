<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPL Overlay</title>

<style>

body{
margin:0;
background:transparent;
overflow:hidden;
font-family:Arial,sans-serif;
}

.overlay{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:90%;
background:linear-gradient(90deg,#001f5c,#0039a6,#001f5c);
border-radius:20px;
padding:15px 25px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.league{
font-size:26px;
font-weight:bold;
margin-bottom:8px;
}

.score{
font-size:58px;
font-weight:bold;
line-height:1;
}

.overs{
font-size:24px;
margin-top:8px;
}

.target{
font-size:24px;
margin-top:8px;
color:#ffd23f;
font-weight:bold;
}

.thisOver{
font-size:18px;
margin-top:10px;
font-weight:bold;
}

.ticker{
position:absolute;
bottom:0;
width:100%;
height:40px;
background:#000;
color:white;
display:flex;
align-items:center;
padding-left:20px;
font-size:16px;
font-weight:bold;
overflow:hidden;
white-space:nowrap;
}

.ticker span{
display:inline-block;
padding-left:100%;
animation:scroll 18s linear infinite;
}

@keyframes scroll{
0%{
transform:translateX(0);
}
100%{
transform:translateX(-100%);
}
}

</style>

</head>

<body>

<div class="overlay">

<div>

<div class="league">
BHIKHANPUR PREMIUM LEAGUE - SEASON 4
</div>

<div id="score" class="score">
0/0
</div>

<div id="overs" class="overs">
0.0 OVERS
</div>

<div id="target" class="target">
TARGET : 0
</div>

<div id="thisOver" class="thisOver">
THIS OVER : -
</div>

</div>

</div>

<div class="ticker">
<span>
DIGITAL PROMOTION | ALL TYPE DIGITAL & PHYSICAL PROMOTION |
CONTACT : 8252001148 |
WHATSAPP : 8252001148
</span>
</div>

<script>

function loadData(){

const data =
JSON.parse(localStorage.getItem("bplData"));

if(!data){
return;
}

document.getElementById("score").innerText =
data.score + "/" + data.wickets;

document.getElementById("overs").innerText =
Math.floor(data.balls/6) +
"." +
(data.balls%6) +
" OVERS";

document.getElementById("target").innerText =
"TARGET : " +
(data.target || 0);

document.getElementById("thisOver").innerText =
"THIS OVER : " +
((data.thisOver || []).join(" ") || "-");

}

loadData();

setInterval(loadData,1000);

</script>

</body>
</html>
