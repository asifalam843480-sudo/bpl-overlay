<script>

function loadData(){

const data = JSON.parse(localStorage.getItem("bplData"));

if(!data) return;

const score =
(data.score || 0) + "/" + (data.wickets || 0);

const overs =
Math.floor((data.balls || 0)/6)
+ "."
+ ((data.balls || 0)%6);

if(document.getElementById("totalScore"))
document.getElementById("totalScore").innerText = score;

if(document.getElementById("scoreLarge"))
document.getElementById("scoreLarge").innerText = score;

if(document.getElementById("oversTop"))
document.getElementById("oversTop").innerText = overs;

if(document.getElementById("oversLarge"))
document.getElementById("oversLarge").innerText =
overs + " OVERS";

if(document.getElementById("needRuns"))
document.getElementById("needRuns").innerText =
data.target || 0;

if(document.getElementById("team1Name"))
document.getElementById("team1Name").innerText =
data.teamA || "TEAM A";

if(document.getElementById("team2Name"))
document.getElementById("team2Name").innerText =

if(document.getElementById("batsman1"))

if(document.getElementById("batsman2"))
document.getElementById("batsman2").innerText =
data.nonStriker || "NON STRIKER";

if(document.getElementById("bowlerName"))
document.getElementById("bowlerName").innerText =
data.bowler || "BOWLER";

}

loadData();

setInterval(loadData,1000);

</script>
