<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Overlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="overlay-container">

    <div class="score-box">
        <div class="score-details">
            <div id="totalScore" class="main-score">0/0</div>
            <div id="oversTop" class="overs">0.0</div>
        </div>
    </div>

    <div class="bottom-scorebar">
        <div class="team-section left">
            <div class="team-logo"><img id="team1Logo" src=""></div>
            <div class="team-name" id="team1Name">TEAM A</div>
        </div>

        <div class="score-center">
            <div id="scoreLarge" class="score-large">0/0</div>
            <div id="oversLarge" class="overs-large">0.0 OVERS</div>
        </div>

        <div class="batsman-panel">
            <div class="batsman-row">
                <div class="batsman-name" id="batsman1">STRIKER</div>
                <div class="batsman-score" id="batsman1Score">0 (0)</div>
            </div>
            <div class="batsman-row">
                <div class="batsman-name" id="batsman2">NON STRIKER</div>
                <div class="batsman-score" id="batsman2Score">0 (0)</div>
            </div>
        </div>

        <div class="need-panel" id="targetBox" style="display:none;">
            <div class="need-title">TARGET</div>
            <div id="needRuns" class="need-runs">0</div>
        </div>

        <div class="bowler-panel">
            <div class="bowler-name" id="bowlerName">BOWLER</div>
            <div class="bowler-figures" id="bowlerFigures">0-0</div>
            <div class="this-over" id="thisOverBalls"></div>
        </div>

        <div class="team-section right">
            <div class="team-logo"><img id="team2Logo" src=""></div>
            <div class="team-name" id="team2Name">TEAM B</div>
        </div>
    </div>

    <div class="ticker-bar">
        <div class="ticker-content">
            DIGITAL PROMOTION | ALL TYPE DIGITAL & PHYSICAL PROMOTION | CONTACT : 8252001148 | BHIKHANPUR PREMIUM LEAGUE
        </div>
    </div>
</div>

<script>
function loadData(){
    const data = JSON.parse(localStorage.getItem("bplData"));
    if(!data) return;

    const score = (data.score || 0) + "/" + (data.wickets || 0);
    const overs = Math.floor((data.balls || 0)/6) + "." + ((data.balls || 0)%6);

    document.getElementById("totalScore").innerText = score;
    document.getElementById("scoreLarge").innerText = score;
    document.getElementById("oversTop").innerText = overs;
    document.getElementById("oversLarge").innerText = overs + " OVERS";

    document.getElementById("team1Name").innerText = data.teamA;
    document.getElementById("team2Name").innerText = data.teamB;
    
    // Logos will automatically show if uploaded in Admin
    if(data.teamALogo) document.getElementById("team1Logo").src = data.teamALogo;
    if(data.teamBLogo) document.getElementById("team2Logo").src = data.teamBLogo;

    document.getElementById("batsman1").innerText = data.striker;
    document.getElementById("batsman2").innerText = data.nonStriker;
    document.getElementById("bowlerName").innerText = data.bowler;

    document.getElementById("batsman1Score").innerText = `${data.strikerRuns} (${data.strikerBalls})`;
    document.getElementById("batsman2Score").innerText = `${data.nonStrikerRuns} (${data.nonStrikerBalls})`;
    document.getElementById("bowlerFigures").innerText = `${data.bowlerWickets}-${data.bowlerRuns}`;

    // Target box logic
    const targetBox = document.getElementById("targetBox");
    if(data.innings === 2 && data.target > 0) {
        targetBox.style.display = "block";
        document.getElementById("needRuns").innerText = data.target;
    } else {
        targetBox.style.display = "none";
    }

    let html = "";
    (data.thisOver || []).forEach(ball => {
        let cls = "ball";
        if(ball === 4) cls += " four";
        if(ball === 6) cls += " six";
        if(ball === "W") cls += " wicket";
        html += `<span class="${cls}">${ball}</span>`;
    });
    document.getElementById("thisOverBalls").innerHTML = html;
}
setInterval(loadData, 500); // 500ms speed for instant update on stream
</script>
</body>
</html>
