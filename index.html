<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPL Premium Overlay V8 - Ultimate Glass Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: transparent; overflow: hidden; font-family: 'Montserrat', sans-serif; }
    .overlay-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    
    /* --- GLASSMORPHISM PREMIUM SCOREBAR --- */
    .bottom-scorebar { 
        position:absolute; bottom:50px; left:50%; transform:translateX(-50%); width:92%; height:90px; 
        background: rgba(10, 15, 30, 0.85); /* Semi-transparent sleek dark blue */
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-top: 2px solid rgba(255, 215, 0, 0.7); /* Premium Gold border */
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 12px 12px 4px 4px; /* Curved modern edges */
        display:flex; align-items:center; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 2px 10px rgba(255, 215, 0, 0.1); 
    }
    
    .team-section { width: 230px; display:flex; align-items:center; justify-content:center; gap:15px; padding:0 15px; }
    .team-logo img { width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); display: none; }
    .team-name { font-size: 20px; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; }
    
    .score-center { width: 240px; text-align: center; background: linear-gradient(180deg, rgba(255,215,0,0.1) 0%, transparent 100%); height: 100%; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); }
    .score-large { font-family: 'Bebas Neue', cursive; font-size: 64px; color: #ffffff; line-height: 0.9; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); }
    .overs-large { font-size: 15px; font-weight: 800; color: #ffd700; letter-spacing: 3px; }
    
    .batsman-panel, .bowler-panel { width: 280px; padding: 0 25px; }
    .batsman-row { display:flex; justify-content:space-between; align-items: center; padding: 4px 0; }
    .batsman-name { font-size: 15px; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap:8px; }
    .batsman-score { font-family: 'Bebas Neue', cursive; font-size: 26px; letter-spacing: 1px; }
    .batsman-score span { font-family: 'Montserrat', sans-serif; font-size: 13px; color: #a0aabf; font-weight: 600; }
    .on-strike { color: #ffffff; } .on-strike .batsman-score { color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.4); }
    .off-strike { color: #7885a0; } .off-strike .batsman-score { color: #7885a0; }
    .striker-icon { color: #00f0ff; font-size: 12px; opacity: 0; } .on-strike .striker-icon { opacity: 1; }
    
    .bowler-name { font-size: 16px; font-weight: 800; color: #ffd700; text-transform: uppercase; }
    .bowler-figures { font-family: 'Bebas Neue', cursive; font-size: 30px; color: #ffffff; letter-spacing: 2px; }
    
    .this-over { display:flex; gap:6px; margin-top:5px; }
    .ball { width: 22px; height: 22px; border-radius: 4px; background: rgba(0,0,0,0.5); color: #fff; display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); }
    .ball.run { background: rgba(0, 86, 179, 0.8); } .ball.four { background: #00b85c; color:#000; border:none; box-shadow: 0 0 5px #00b85c;} .ball.six { background: #9d4edd; border:none; box-shadow: 0 0 5px #9d4edd; } .ball.wicket { background: #e60000; color:#fff; border:none; } .ball.extra { background: rgba(230, 126, 34, 0.8); }
    
    .need-panel { width: 140px; text-align: center; background: rgba(255, 215, 0, 0.1); padding: 5px; border-radius: 6px; border: 1px solid rgba(255,215,0,0.3); margin: 0 10px; }
    .need-title { font-size: 11px; font-weight: 800; color: #ffd700; } .need-runs { font-family: 'Bebas Neue', cursive; font-size: 36px; color: white; line-height: 1; }
    
    .ticker-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); width:90%; height:28px; background: rgba(0,0,0,0.9); border-radius: 14px; border:1px solid rgba(255,255,255,0.1); overflow:hidden; z-index: 100;}
    .ticker-content { white-space: nowrap; font-size: 13px; font-weight: 600; color: #a0aabf; line-height: 28px; letter-spacing: 1px; animation: tickerMove 25s linear infinite; }
    .ticker-highlight { color: #ffd700; font-weight: 800; }
    @keyframes tickerMove { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    /* --- SLEEK BROADCAST ANIMATIONS (NO MORE SCREEN HOGGING) --- */
    #animation-container { position: fixed; bottom: 155px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; justify-content: center; align-items: flex-end; width: 100%; pointer-events: none; }
    
    .anim-graphic { 
        font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 45px; letter-spacing: 8px; line-height: 1; text-transform: uppercase;
        padding: 15px 50px; background: rgba(10, 15, 30, 0.95); backdrop-filter: blur(10px);
        border-radius: 8px; box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        display: flex; align-items: center; gap: 15px; opacity: 0;
    }
    
    /* Sleek 4 Boundary */
    .anim-4 { color: #00f0ff; border: 1px solid rgba(0,240,255,0.3); border-bottom: 4px solid #00f0ff; animation: sleekPop 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    /* Premium Gold 6 */
    .anim-6 { color: #ffd700; border: 1px solid rgba(255,215,0,0.3); border-bottom: 4px solid #ffd700; animation: sleekPop 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    /* Red Wicket Cut */
    .anim-w { color: #ffffff; background: #e60000; border-bottom: 4px solid #8b0000; animation: sleekPop 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; box-shadow: 0 10px 30px rgba(230,0,0,0.4); }

    @keyframes sleekPop { 
        0% { transform: translateY(40px) scale(0.9); opacity: 0; filter: blur(5px); } 
        15% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); } 
        85% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); } 
        100% { transform: translateY(-40px) scale(1.05); opacity: 0; filter: blur(5px); } 
    }

    /* --- LUXURY WINNER BANNER --- */
    #winnerBanner { display: none; position: fixed; inset: 0; z-index: 999999; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(10,15,30,0.9) 0%, rgba(0,0,0,0.98) 100%); pointer-events: none; }
    
    .winner-content { text-align: center; opacity: 0; transform: scale(0.95); animation: luxuryReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes luxuryReveal { to { opacity: 1; transform: scale(1); } }
    
    #winnerTitle { color: #a0aabf; font-size: 20px; letter-spacing: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
    #winnerDisplayHtml { color: #ffd700; font-size: 85px; font-family: 'Bebas Neue', cursive; text-transform: uppercase; text-shadow: 0 10px 30px rgba(255,215,0,0.3); line-height: 1; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="overlay-container">
    <div id="animation-container"></div>
    
    <div id="winnerBanner">
        <div class="winner-content">
            <div id="winnerTitle">MATCH CHAMPIONS</div>
            <div id="winnerDisplayHtml">TEAM WON</div>
        </div>
    </div>
    
    <div class="bottom-scorebar">
        <div class="team-section left">
            <div class="team-logo"><img id="team1Logo" src=""></div>
            <div class="team-name" id="team1Name">TEAM A</div>
        </div>
        <div class="score-center"><div id="scoreLarge" class="score-large">0-0</div><div id="oversLarge" class="overs-large">0.0 OVERS</div></div>
        <div class="batsman-panel">
            <div class="batsman-row" id="rowB1"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b1NameDisplay">BAT 1</span></div><div class="batsman-score" id="b1ScoreDisplay">0 <span>(0)</span></div></div>
            <div class="batsman-row" id="rowB2"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b2NameDisplay">BAT 2</span></div><div class="batsman-score" id="b2ScoreDisplay">0 <span>(0)</span></div></div>
        </div>
        <div class="need-panel" id="targetBox" style="display:none;"><div class="need-title">TARGET</div><div id="needRuns" class="need-runs">0</div></div>
        <div class="bowler-panel"><div class="bowler-name" id="bowlerName">BOWLER</div><div class="bowler-figures" id="bowlerFigures">0-0</div><div class="this-over" id="thisOverBalls"></div></div>
        <div class="team-section right">
            <div class="team-name" id="team2Name">TEAM B</div>
            <div class="team-logo"><img id="team2Logo" src=""></div>
        </div>
    </div>
    <div class="ticker-bar"><div class="ticker-content"><span class="ticker-highlight">🏆 BHIKHANPUR PREMIUM LEAGUE LIVE 🏆</span> &nbsp;|&nbsp; POWERED BY DIGITAL PROMOTION &nbsp;|&nbsp; FOR INQUIRIES CALL: 8252001148 &nbsp;|&nbsp; SUBSCRIBE NOW FOR MORE ACTION!</div></div>
</div>

<script>
let lastFlashId = 0; 
const DB_KEY = "BPL_PRO_V8_FINAL"; 
const syncChannel = new BroadcastChannel('bpl_live_sync');

function fireAnimation(type) {
    const container = document.getElementById("animation-container"); 
    container.innerHTML = ""; 
    const box = document.createElement("div");
    
    if(type === 4 || type === "4") { box.className = "anim-graphic anim-4"; box.innerHTML = "FOUR RUNS"; }
    else if(type === 6 || type === "6") { box.className = "anim-graphic anim-6"; box.innerHTML = "SIX RUNS"; }
    else if(type === "W") { box.className = "anim-graphic anim-w"; box.innerHTML = "WICKET"; }
    else if(type === "RO") { box.className = "anim-graphic anim-w"; box.innerHTML = "RUN OUT"; }
    
    if(box.className) {
        container.appendChild(box); 
        setTimeout(() => { if(container.contains(box)) box.remove(); }, 3500); 
    }
}

function setTxt(id, val) { let el = document.getElementById(id); if(el && el.innerText !== val) el.innerText = val || ""; }
function setHtml(id, val) { let el = document.getElementById(id); if(el && el.innerHTML !== val) el.innerHTML = val || ""; }
function setImg(id, val) { 
    let el = document.getElementById(id); 
    if(el) { if(!val) el.style.display = "none"; else { el.style.display = "block"; if(el.src !== val) el.src = val; } }
}

function renderData(data) {
    if(!data) return; 
    
    let wBanner = document.getElementById("winnerBanner");
    if(wBanner) { 
        if(data.showWinner) {
            wBanner.style.display = "flex";
            setTxt("winnerDisplayHtml", data.winnerText); 
        } else {
            wBanner.style.display = "none";
        }
    }
    
    if (data.flashId && data.flashId !== lastFlashId) { fireAnimation(data.flashEvent); lastFlashId = data.flashId; }
    
    setTxt("scoreLarge", data.score + "-" + data.wickets);
    setTxt("oversLarge", Math.floor(data.balls/6) + "." + (data.balls%6) + " OVERS");
    setTxt("team1Name", data.teamA); setTxt("team2Name", data.teamB);
    setImg("team1Logo", data.teamALogo); setImg("team2Logo", data.teamBLogo);
    
    setTxt("b1NameDisplay", data.b1Name); setHtml("b1ScoreDisplay", `${data.b1Runs} <span>(${data.b1Balls})</span>`);
    setTxt("b2NameDisplay", data.b2Name); setHtml("b2ScoreDisplay", `${data.b2Runs} <span>(${data.b2Balls})</span>`);
    document.getElementById("rowB1").className = data.onStrike === 1 ? "batsman-row on-strike" : "batsman-row off-strike";
    document.getElementById("rowB2").className = data.onStrike === 2 ? "batsman-row on-strike" : "batsman-row off-strike";
    
    setTxt("bowlerName", data.bowler); setTxt("bowlerFigures", `${data.bowlerWickets}-${data.bowlerRuns}`);
    const tb = document.getElementById("targetBox");
    if(tb) { tb.style.display = (data.innings === 2 && data.target > 0) ? "block" : "none"; setTxt("needRuns", data.target); }
    
    let tob = document.getElementById("thisOverBalls");
    if(tob) {
        let html = ""; (data.thisOver || []).forEach(ball => {
            let cls = "ball"; if(ball === 4 || ball === "4") cls += " four"; else if(ball === 6 || ball === "6") cls += " six"; else if(ball === "W" || ball === "RO") cls += " wicket"; else if(["WD","NB","1LB","4LB","5WD"].includes(ball)) cls += " extra"; else cls += " run";
            html += `<span class="${cls}">${ball}</span>`;
        }); setHtml("thisOverBalls", html);
    }
}

syncChannel.onmessage = (event) => { renderData(event.data); };
function loadInitial() { try { let saved = localStorage.getItem(DB_KEY); if(saved) renderData(JSON.parse(saved)); } catch(e) {} }
loadInitial();
</script>
</body>
</html>
