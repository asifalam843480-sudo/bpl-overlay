<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Premium Overlay | V24 Elite</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: transparent; overflow: hidden; font-family: 'Montserrat', sans-serif; }
    .overlay-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow: hidden;}
    
    /* =========================================
       📊 ULTRA-CLEAR SCOREBOARD
       ========================================= */
    .bottom-scorebar { 
        position:absolute; bottom:55px; left:50%; transform:translateX(-50%); 
        width:96%; max-width: 1500px; height:95px; 
        background: linear-gradient(180deg, rgba(8, 12, 20, 0.98), rgba(0, 0, 0, 1)); 
        border-top: 4px solid #00e5ff; 
        border-bottom: 2px solid rgba(0, 229, 255, 0.3); 
        display:flex; align-items:center; 
        box-shadow: 0 -15px 50px rgba(0,0,0,0.9), 0 0 20px rgba(0, 229, 255, 0.2); 
        clip-path: polygon(1% 0, 99% 0, 100% 100%, 0% 100%); 
        z-index:100;
        transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-in-out;
    }
    
    .bottom-scorebar.hidden-board { transform: translate(-50%, 150px) scale(0.95); opacity: 0; }
    
    .team-section { width: 230px; display:flex; align-items:center; justify-content:center; gap:15px; padding:0 15px; }
    .team-logo img { width: 70px; height: 70px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,1)); display: none; }
    .team-name { font-size: 26px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 3px 3px 6px rgba(0,0,0,1); }
    
    .score-center { 
        width: 250px; text-align: center; 
        background: radial-gradient(circle, rgba(0, 229, 255, 0.1) 0%, transparent 80%); 
        height: 100%; display: flex; flex-direction: column; justify-content: center; 
        border-left: 2px solid rgba(255,255,255,0.15); border-right: 2px solid rgba(255,255,255,0.15); 
    }
    .score-large { font-family: 'Bebas Neue', cursive; font-size: 75px; color: #ffffff; line-height: 0.9; text-shadow: 4px 6px 15px rgba(0,0,0,1); transition: 0.3s; }
    .overs-large { font-size: 18px; font-weight: 900; color: #00e5ff; letter-spacing: 4px; text-shadow: 2px 2px 5px rgba(0,0,0,1); }
    
    /* 💥 THE LAYOUT FIX: Perfect Vertical Centering to avoid top line collision */
    .batsman-panel, .bowler-panel { 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        height: 100%; 
        padding: 0 25px; 
    }
    
    .batsman-panel { width: 300px; }
    .bowler-panel { width: 350px; max-width: 350px; overflow: hidden; } 
    
    .batsman-row { display:flex; justify-content:space-between; align-items: center; padding: 2px 0; }
    .batsman-name { font-size: 17px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; gap:8px; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,1); }
    .batsman-score { font-family: 'Bebas Neue', cursive; font-size: 32px; letter-spacing: 1px; color:#ffffff; text-shadow: 2px 2px 5px rgba(0,0,0,1); }
    .batsman-score span { font-family: 'Montserrat', sans-serif; font-size: 14px; color: #cbd5e1; font-weight: 700; }
    .on-strike { background: rgba(0, 229, 255, 0.1); border-radius: 4px; padding: 0 5px; } 
    .on-strike .batsman-score { color: #00e5ff; }
    .off-strike { opacity: 0.8; } 
    .striker-icon { color: #00e5ff; font-size: 15px; opacity: 0; text-shadow: 0 0 5px #00e5ff; } .on-strike .striker-icon { opacity: 1; }
    
    /* Name perfectly centered vertically now */
    .bowler-name { font-size: 20px; font-weight: 900; color: #00e5ff; text-transform: uppercase; text-shadow: 2px 2px 5px rgba(0,0,0,1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .bowler-figures { font-family: 'Bebas Neue', cursive; font-size: 36px; color: #ffffff; letter-spacing: 2px; text-shadow: 3px 3px 10px rgba(0,0,0,1); }
    
    .this-over { display:flex; gap:5px; margin-top:3px; overflow: hidden; white-space: nowrap; max-width: 100%; }
    .ball { width: 24px; height: 24px; border-radius: 50%; background: #1e293b; color: white; display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 900; border: 1px solid #000; box-shadow: 0 2px 5px rgba(0,0,0,0.8); flex-shrink: 0; }
    .ball.run { background: #2563eb; } .ball.four { background: #facc15; color:#000; box-shadow: 0 0 8px #facc15; } .ball.six { background: #9333ea; box-shadow: 0 0 8px #9333ea; } .ball.wicket { background: #dc2626; color:#fff; box-shadow: 0 0 8px #dc2626; } .ball.extra { background: #ea580c; } .ball.lb { background: #7e22ce; color:white; }
    
    .need-panel { width: 140px; text-align: center; background: rgba(0, 229, 255, 0.15); padding: 5px; border-radius: 8px; border: 1px solid #00e5ff; margin: 0 10px; }
    .need-title { font-size: 14px; font-weight: 900; color: #00e5ff; text-shadow: 1px 1px 3px #000; } .need-runs { font-family: 'Bebas Neue', cursive; font-size: 45px; color: white; line-height: 1; text-shadow: 3px 3px 8px #000; }
    
    /* =========================================
       🚀 DYNAMIC CUSTOM TICKER
       ========================================= */
    .ticker-bar { 
        position:absolute; bottom:15px; left:50%; transform:translateX(-50%); 
        width:94%; max-width: 1500px; height:32px; 
        background: #000000; border-radius: 4px; border:1px solid #1e293b; 
        overflow:hidden; z-index:100; box-shadow: 0 0 20px rgba(0,0,0,0.9);
        transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-in-out;
    }
    .ticker-bar.hidden-board { transform: translate(-50%, 150px); opacity: 0; }
    
    .ticker-content { 
        white-space: nowrap; font-family: 'Montserrat', sans-serif; font-size: 15px; 
        font-weight: 900; color: #facc15; line-height: 32px; letter-spacing: 3px; 
        animation: tickerMove 25s linear infinite; text-shadow: 1px 1px 5px rgba(0,0,0,1); text-transform: uppercase;
    }
    @keyframes tickerMove { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    /* =========================================
       ⚡ ELITE BROADCAST OVERLAYS (NO BLUR, SOLID PRO BOX)
       ========================================= */
    #animation-container { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 9999; display: flex; justify-content: center; align-items: center; width: 100%;}
    
    .broadcast-event {
        position: relative;
        background: #020617; /* Slate Black */
        border: 1px solid #1e293b;
        padding: 25px 120px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,1);
        display: flex; align-items: center; justify-content: center;
        /* Sharp entry, absolute zero blur */
        animation: premiumSlideIn 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        overflow: hidden;
        border-radius: 4px;
    }
    
    /* Glowing Neon Accent Line at the Top */
    .broadcast-event::before {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    }
    
    .broadcast-text {
        font-family: 'Bebas Neue', cursive; 
        font-size: 140px; 
        color: #fff;
        margin: 0; letter-spacing: 12px; line-height: 1; text-transform: uppercase; 
        text-shadow: 0 10px 20px rgba(0,0,0,1);
        white-space: nowrap;
    }

    /* Event specific colors */
    .broadcast-event.four::before { background: #00e5ff; box-shadow: 0 0 20px #00e5ff; }
    .broadcast-event.four .broadcast-text { color: #00e5ff; }

    .broadcast-event.six::before { background: #facc15; box-shadow: 0 0 20px #facc15; }
    .broadcast-event.six .broadcast-text { color: #facc15; }

    .broadcast-event.danger::before { background: #ef4444; box-shadow: 0 0 20px #ef4444; }
    .broadcast-event.danger .broadcast-text { color: #ef4444; }

    .broadcast-event.alert::before { background: #a855f7; box-shadow: 0 0 20px #a855f7; }
    .broadcast-event.alert .broadcast-text { color: #a855f7; }

    /* Clean Slide In-Hold-Slide Out Animation (NO BLUR) */
    @keyframes premiumSlideIn { 
        0% { transform: translateY(100px); opacity: 0; clip-path: inset(100% 0 0 0); } 
        10% { transform: translateY(0); opacity: 1; clip-path: inset(0 0 0 0); } 
        90% { transform: translateY(0); opacity: 1; clip-path: inset(0 0 0 0); } 
        100% { transform: translateY(-100px); opacity: 0; clip-path: inset(0 0 100% 0); } 
    }

    /* =========================================
       🔥 CINEMATIC CHAMPIONSHIP TAKEOVER (PURE GOLD) 🔥
       ========================================= */
    #winnerBanner { 
        display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
        background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); 
        z-index: 999999; flex-direction: column; justify-content: center;
        align-items: center; text-align: center; overflow: hidden; 
        animation: premiumFadeIn 0.8s ease-out forwards;
    }

    .winner-content { position: relative; z-index: 10; animation: winnerPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    #winnerTitle { 
        color: #94a3b8; font-size: 35px; letter-spacing: 30px; margin-right: -30px; 
        font-family: 'Montserrat', sans-serif; font-weight:900; 
        text-transform: uppercase; margin-bottom: 20px;
    }

    /* Cinema-Grade 3D Gold Gradient */
    #winnerDisplayHtml { 
        background: linear-gradient(to bottom, #ffffff 0%, #facc15 40%, #ca8a04 60%, #a16207 100%);
        -webkit-background-clip: text; color: transparent;
        font-size: 190px; font-family: 'Bebas Neue', cursive; 
        filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.9));
        text-transform: uppercase; letter-spacing: 15px; line-height: 1.1; 
    }
    
    @keyframes premiumFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes winnerPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="overlay-container">
    <div id="animation-container"></div>
    
    <!-- FULL SCREEN WINNER -->
    <div id="winnerBanner">
        <div class="winner-content">
            <div id="winnerTitle">MATCH CHAMPIONS</div>
            <div id="winnerDisplayHtml">TEAM WON</div>
        </div>
    </div>
    
    <!-- SCOREBOARD -->
    <div class="bottom-scorebar" id="scoreBarEl">
        <div class="team-section left">
            <div class="team-logo"><img id="team1Logo" src=""></div>
            <div class="team-name" id="team1Name">TEAM A</div>
        </div>
        <div class="score-center"><div id="scoreLarge" class="score-large">0-0</div><div id="oversLarge" class="overs-large">0.0 OVERS</div></div>
        
        <div class="batsman-panel">
            <div class="batsman-row" id="rowB1"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b1NameDisplay">BAT 1</span></div><div class="batsman-score" id="b1ScoreDisplay">0 <span>(0)</span></div></div>
            <div class="batsman-row" id="rowB2"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b2NameDisplay">BAT 2</span></div><div class="batsman-score" id="b2ScoreDisplay">0 <span>(0)</span></div></div>
        </div>
        
        <div class="need-panel" id="targetBox" style="display:none;"><div class="need-title">TARGET</div><div id="needRuns" class="need-runs">0</div></div>
        
        <!-- EXTENDED BOWLER PANEL -->
        <div class="bowler-panel">
            <div class="bowler-name" id="bowlerName">BOWLER</div>
            <div class="bowler-figures" id="bowlerFigures">0-0</div>
            <div class="this-over" id="thisOverBalls"></div>
        </div>
        
        <div class="team-section right">
            <div class="team-name" id="team2Name">TEAM B</div>
            <div class="team-logo"><img id="team2Logo" src=""></div>
        </div>
    </div>
    
    <!-- DYNAMIC TICKER -->
    <div class="ticker-bar" id="tickerBarEl">
        <div class="ticker-content" id="tickerTextDisplay">
            🏆 BARAHPURA PREMIER LEAGUE SEASON 1, 2026 🏆
        </div>
    </div>
</div>

<script>
let lastFlashId = 0; 
const DB_KEY = "BPL_ELITE_V24"; 

function fireAnimation(type) {
    const container = document.getElementById("animation-container"); 
    container.innerHTML = ""; 
    const card = document.createElement("div");
    card.className = "broadcast-event"; 
    
    const txt = document.createElement("div");
    txt.className = "broadcast-text";

    let shouldShow = false;
    
    if(type === 4 || type === "4") { txt.innerText = "FOUR"; card.classList.add("four"); shouldShow = true; }
    else if(type === 6 || type === "6") { txt.innerText = "SIX"; card.classList.add("six"); shouldShow = true; }
    else if(type === "WIDE") { txt.innerText = "WIDE"; card.classList.add("alert"); shouldShow = true; }
    else if(type === "NO BALL") { txt.innerText = "NO BALL"; card.classList.add("alert"); shouldShow = true; }
    
    // 💥 BUG FIX: SMART WICKET TEXT PROCESSOR 💥
    else if(["BOWLED", "CAUGHT", "CAUGHT BEHIND", "C & B", "LBW", "STUMPED", "RUN OUT", "RETIRED HURT"].includes(type)) { 
        
        if (type === "RUN OUT" || type === "RETIRED HURT") {
            txt.innerText = type; // Shows exact text
        } else {
            txt.innerText = "WICKET"; // Shows generic WICKET for everything else
        }
        
        card.classList.add("danger"); 
        shouldShow = true; 
    }
    
    if(shouldShow) {
        card.appendChild(txt);
        container.appendChild(card); 
        setTimeout(() => { if(container.contains(card)) card.remove(); }, 3000); // Matched with CSS timing
    }
}

function setTxt(id, val) { let el = document.getElementById(id); if(el) el.innerText = val || ""; }
function setHtml(id, val) { let el = document.getElementById(id); if(el) el.innerHTML = val || ""; }
function setImg(id, val) { 
    let el = document.getElementById(id); 
    if(el) { if(!val || val.length < 50) el.style.display = "none"; else { el.style.display = "block"; el.src = val; } }
}

function loadData() {
    let data; try { let saved = localStorage.getItem(DB_KEY); if(!saved) return; data = JSON.parse(saved); } catch(e) { return; } if(!data) return; 
    
    let wBanner = document.getElementById("winnerBanner");
    if(wBanner) { 
        wBanner.style.display = data.showWinner ? "flex" : "none"; 
        setTxt("winnerDisplayHtml", data.winnerText); 
    }

    let sBar = document.getElementById("scoreBarEl");
    let tBar = document.getElementById("tickerBarEl");
    if(data.showScoreboard) {
        sBar.classList.remove("hidden-board");
        tBar.classList.remove("hidden-board");
    } else {
        sBar.classList.add("hidden-board");
        tBar.classList.add("hidden-board");
    }

    setTxt("tickerTextDisplay", data.tickerText);
    
    if (data.flashId && data.flashId !== lastFlashId) { fireAnimation(data.flashEvent); lastFlashId = data.flashId; }
    
    setTxt("scoreLarge", data.score + "-" + data.wickets);
    setTxt("oversLarge", Math.floor(data.balls/6) + "." + (data.balls%6) + " OVERS");
    setTxt("team1Name", data.teamA); setTxt("team2Name", data.teamB);
    setImg("team1Logo", data.teamALogo); setImg("team2Logo", data.teamBLogo);
    
    setTxt("b1NameDisplay", data.b1Name); setHtml("b1ScoreDisplay", `${data.b1Runs} <span>(${data.b1Balls})</span>`);
    setTxt("b2NameDisplay", data.b2Name); setHtml("b2ScoreDisplay", `${data.b2Runs} <span>(${data.b2Balls})</span>`);
    document.getElementById("rowB1").className = data.onStrike === 1 ? "batsman-row on-strike" : "batsman-row off-strike";
    document.getElementById("rowB2").className = data.onStrike === 2 ? "batsman-row on-strike" : "batsman-row off-strike";
    
    setTxt("bowlerName", data.bowler); setTxt("bowlerFigures", `${data.bowlerWickets}-${data.bowlerRuns}`);
    const tb = document.getElementById("targetBox");
    if(tb) { tb.style.display = (data.innings === 2 && data.target > 0) ? "block" : "none"; setTxt("needRuns", data.target); }
    
    let tob = document.getElementById("thisOverBalls");
    if(tob) {
        let html = ""; 
        let displayBalls = (data.thisOver || []).slice(-8); 
        displayBalls.forEach(ball => {
            let cls = "ball"; 
            if(ball === 4 || ball === "4") cls += " four"; 
            else if(ball === 6 || ball === "6") cls += " six"; 
            else if(ball === "W" || ball === "RO") cls += " wicket"; 
            else if(String(ball).includes("LB")) cls += " lb";
            else if(String(ball).includes("WD") || String(ball).includes("NB") || String(ball).includes("B")) cls += " extra"; 
            else cls += " run";
            html += `<span class="${cls}">${ball}</span>`;
        }); 
        setHtml("thisOverBalls", html);
    }
}

window.addEventListener('storage', loadData); 
setInterval(loadData, 200); 
loadData();
</script>
</body>
</html>
