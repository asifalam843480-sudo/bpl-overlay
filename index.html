<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPL Premium Overlay | Ultimate V16</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: transparent; overflow: hidden; font-family: 'Montserrat', sans-serif; }
    .overlay-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    
    /* =========================================
       📊 DEEP CONTRAST SCOREBOARD
       ========================================= */
    .bottom-scorebar { 
        position:absolute; bottom:55px; left:50%; transform:translateX(-50%); 
        width:94%; height:95px; 
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 1)); 
        border-top: 4px solid #00e5ff; 
        border-bottom: 2px solid rgba(0, 229, 255, 0.3); 
        display:flex; align-items:center; 
        box-shadow: 0 -10px 40px rgba(0,0,0,0.9), 0 0 20px rgba(0, 229, 255, 0.2); 
        clip-path: polygon(1% 0, 99% 0, 100% 100%, 0% 100%); 
        z-index:100;
    }
    
    .team-section { width: 230px; display:flex; align-items:center; justify-content:center; gap:15px; padding:0 15px; }
    .team-logo img { width: 70px; height: 70px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,1)); display: none; }
    .team-name { font-size: 24px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 4px 6px rgba(0,0,0,1); }
    
    .score-center { 
        width: 240px; text-align: center; 
        background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, transparent 80%); 
        height: 100%; display: flex; flex-direction: column; justify-content: center; 
        border-left: 2px solid rgba(255,255,255,0.1); border-right: 2px solid rgba(255,255,255,0.1); 
    }
    .score-large { font-family: 'Bebas Neue', cursive; font-size: 72px; color: #ffffff; line-height: 0.9; text-shadow: 3px 5px 15px rgba(0,0,0,1); transition: 0.3s; }
    .overs-large { font-size: 17px; font-weight: 900; color: #00e5ff; letter-spacing: 4px; text-shadow: 1px 2px 5px rgba(0,0,0,0.8); }
    
    .batsman-panel, .bowler-panel { width: 280px; padding: 0 25px; }
    .batsman-row { display:flex; justify-content:space-between; align-items: center; padding: 4px 0; }
    .batsman-name { font-size: 16px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; gap:8px; color: #f8fafc; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
    .batsman-score { font-family: 'Bebas Neue', cursive; font-size: 30px; letter-spacing: 1px; color:#ffffff; text-shadow: 2px 2px 5px rgba(0,0,0,1); }
    .batsman-score span { font-family: 'Montserrat', sans-serif; font-size: 14px; color: #94a3b8; font-weight: 700; }
    .on-strike { background: rgba(0, 229, 255, 0.1); border-radius: 4px; padding: 0 5px; } 
    .on-strike .batsman-score { color: #00e5ff; }
    .off-strike { opacity: 0.8; } 
    .striker-icon { color: #00e5ff; font-size: 14px; opacity: 0; text-shadow: 0 0 5px #00e5ff; } .on-strike .striker-icon { opacity: 1; }
    
    .bowler-name { font-size: 19px; font-weight: 900; color: #00e5ff; text-transform: uppercase; text-shadow: 1px 2px 5px rgba(0,0,0,0.9); }
    .bowler-figures { font-family: 'Bebas Neue', cursive; font-size: 34px; color: #ffffff; letter-spacing: 2px; text-shadow: 2px 2px 8px rgba(0,0,0,1); }
    
    .this-over { display:flex; gap:6px; margin-top:5px; }
    .ball { width: 26px; height: 26px; border-radius: 50%; background: #1e293b; color: white; display:flex; align-items:center; justify-content:center; font-size: 14px; font-weight: 900; border: 1px solid #000; box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .ball.run { background: #2563eb; } .ball.four { background: #d4af37; color:#000; box-shadow: 0 0 10px #d4af37; } .ball.six { background: #9333ea; box-shadow: 0 0 10px #9333ea; } .ball.wicket { background: #dc2626; color:#fff; box-shadow: 0 0 10px #dc2626; } .ball.extra { background: #ea580c; } .ball.lb { background: #7e22ce; color:white; }
    
    .need-panel { width: 140px; text-align: center; background: rgba(0, 229, 255, 0.15); padding: 5px; border-radius: 8px; border: 1px solid #00e5ff; margin: 0 10px; }
    .need-title { font-size: 13px; font-weight: 900; color: #00e5ff; } .need-runs { font-family: 'Bebas Neue', cursive; font-size: 42px; color: white; line-height: 1; text-shadow: 2px 2px 5px #000; }
    
    /* =========================================
       🚀 NEW BARAHPURA PREMIUM TICKER
       ========================================= */
    .ticker-bar { position:absolute; bottom:15px; left:50%; transform:translateX(-50%); width:92%; height:32px; background: #020617; border-radius: 4px; border:1px solid #1e293b; overflow:hidden; z-index:100; box-shadow: 0 0 15px rgba(0,0,0,0.8);}
    .ticker-content { white-space: nowrap; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 900; color: #00e5ff; line-height: 32px; letter-spacing: 3px; animation: tickerMove 25s linear infinite; text-shadow: 0 0 8px rgba(0, 229, 255, 0.4); text-transform: uppercase;}
    @keyframes tickerMove { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    /* =========================================
       ⚡ CYBER-HOLO OVERLAY (STRICTLY 2 SECONDS)
       ========================================= */
    #animation-container { perspective: 1200px; position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 9999; display: flex; justify-content: center; align-items: center; }
    
    .holo-banner {
        position: relative;
        /* Sleek Glassmorphism + Dark Gradient */
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(2, 6, 23, 0.98) 100%);
        padding: 40px 140px;
        /* Blade cut design */
        clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        border-left: 8px solid #fff;
        border-right: 8px solid #fff;
        box-shadow: 0 40px 100px rgba(0,0,0,1), inset 0 0 60px rgba(255,255,255,0.1);
        /* STRICTLY 2 SECONDS ANIMATION */
        animation: exactlyTwoSeconds 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    
    /* Rapid sweeping laser */
    .holo-banner::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
        transform: skewX(-25deg);
        animation: laserShine 1s infinite;
    }
    
    .holo-text {
        font-family: 'Bebas Neue', cursive;
        font-size: 170px;
        color: #fff;
        text-shadow: 0 10px 40px rgba(0,0,0,1);
        margin: 0; letter-spacing: 15px; line-height: 1; text-transform: uppercase;
        transform: skewX(5deg); /* Counter-balance the clip-path skew visually */
    }

    /* Professional Cyber Color Coding */
    .holo-banner.four { border-color: #00e5ff; box-shadow: 0 30px 80px rgba(0,0,0,1), inset 0 0 80px rgba(0, 229, 255, 0.4); }
    .holo-banner.four .holo-text { color: #00e5ff; text-shadow: 0 10px 50px rgba(0,229,255,0.9); }

    .holo-banner.six { border-color: #d4af37; box-shadow: 0 30px 80px rgba(0,0,0,1), inset 0 0 80px rgba(212, 175, 55, 0.4); }
    .holo-banner.six .holo-text { color: #d4af37; text-shadow: 0 10px 50px rgba(212,175,55,0.9); }

    .holo-banner.danger { border-color: #ff003c; box-shadow: 0 30px 80px rgba(0,0,0,1), inset 0 0 80px rgba(255, 0, 60, 0.5); }
    .holo-banner.danger .holo-text { color: #ff003c; text-shadow: 0 10px 50px rgba(255,0,60,1); }

    .holo-banner.alert { border-color: #ffaa00; box-shadow: 0 30px 80px rgba(0,0,0,1), inset 0 0 80px rgba(255, 170, 0, 0.4); }
    .holo-banner.alert .holo-text { color: #ffaa00; text-shadow: 0 10px 50px rgba(255,170,0,0.9); }

    /* NO BLUR - 2 SECONDS SHARP */
    @keyframes exactlyTwoSeconds { 
        0% { transform: scale(0.2) translateY(300px); opacity: 0; } 
        15% { transform: scale(1) translateY(0); opacity: 1; } /* 0.3s IN */
        85% { transform: scale(1) translateY(0); opacity: 1; } /* 1.4s HOLD */
        100% { transform: scale(1.4) translateY(-200px); opacity: 0; } /* 0.3s OUT - SHARP */
    }
    @keyframes laserShine { 0% { left: -100%; } 100% { left: 200%; } }

    /* =========================================
       🏆 ULTIMATE CINEMATIC MATCH WINNER
       ========================================= */
    #winnerBanner { 
        display: none; position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); 
        width: 100vw; text-align: center; 
        background: rgba(2, 6, 23, 0.98); 
        border-top: 10px solid #00e5ff; border-bottom: 10px solid #00e5ff; 
        padding: 60px 0; z-index: 999999; 
        animation: ultimateSlam 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        overflow: hidden; 
        box-shadow: 0 0 100px rgba(0, 229, 255, 0.7), inset 0 0 50px rgba(0, 229, 255, 0.2);
    }
    
    #winnerBanner::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 30%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        transform: skewX(-30deg); animation: winnerLaser 3s infinite 1s;
    }
    
    #winnerTitle { position: relative; color: #fff; font-size: 35px; letter-spacing: 30px; margin-bottom: 15px; font-family: 'Montserrat', sans-serif; font-weight:900; text-shadow: 0 5px 20px #000; text-transform: uppercase; }
    #winnerDisplayHtml { position: relative; color: #00e5ff; font-size: 130px; font-family: 'Bebas Neue', cursive; text-shadow: 0 15px 50px rgba(0,0,0,1), 0 0 40px rgba(0, 229, 255, 0.8); text-transform: uppercase; letter-spacing: 8px; line-height: 1; }
    
    @keyframes ultimateSlam { 0% { transform: translate(-50%, -200%) scale(1.5); opacity: 0; } 60% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    @keyframes winnerLaser { 0% { left: -100%; } 100% { left: 200%; } }
</style>
</head>
<body>
<div class="overlay-container">
    <div id="animation-container"></div>
    <div id="winnerBanner"><div id="winnerTitle">MATCH CHAMPION</div><div id="winnerDisplayHtml">TEAM WON</div></div>
    
    <div class="bottom-scorebar">
        <div class="team-section left">
            <div class="team-logo"><img id="team1Logo" src=""></div>
            <div class="team-name" id="team1Name">TEAM A</div>
        </div>
        <div class="score-center"><div id="scoreLarge" class="score-large">0-0</div><div id="oversLarge" class="overs-large">0.0 OVERS</div></div>
        <div class="batsman-panel">
            <div class="batsman-row" id="rowB1"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b1NameDisplay">BAT 1</span></div><div class="batsman-score" id="b1ScoreDisplay">0 <span>(0)</span></div></div>
            <div class="batsman-row" id="rowB2"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b2NameDisplay">BAT 2</span></div><div class="batsman-score" id="b2ScoreDisplay">0 <span>(0)</span></div></div>
        </div>
        <div class="need-panel" id="targetBox" style="display:none;"><div class="need-title">TARGET</div><div id="needRuns" class="need-runs">0</div></div>
        <div class="bowler-panel"><div class="bowler-name" id="bowlerName">BOWLER</div><div class="bowler-figures" id="bowlerFigures">0-0</div><div class="this-over" id="thisOverBalls"></div></div>
        <div class="team-section right">
            <div class="team-name" id="team2Name">TEAM B</div>
            <div class="team-logo"><img id="team2Logo" src=""></div>
        </div>
    </div>
    
    <!-- 💥 UPDATED BARAHPURA PREMIER LEAGUE TICKER -->
    <div class="ticker-bar">
        <div class="ticker-content">
            🏆 BARAHPURA PREMIER LEAGUE SEASON 1, 2026 | POWERED BY A2 SERIES | CONTACT NUMBER: 8252001148 | LIKE, SUBSCRIBE AND SHARE 🏆
        </div>
    </div>
</div>

<script>
let lastFlashId = 0; 
const DB_KEY = "BPL_ULTIMATE_V16"; 

function fireAnimation(type) {
    const container = document.getElementById("animation-container"); 
    container.innerHTML = ""; 
    const card = document.createElement("div");
    card.className = "holo-banner"; 
    
    const txt = document.createElement("div");
    txt.className = "holo-text";

    let shouldShow = false;
    
    if(type === 4 || type === "4") { txt.innerText = "FOUR RUNS"; card.classList.add("four"); shouldShow = true; }
    else if(type === 6 || type === "6") { txt.innerText = "MASSIVE SIX"; card.classList.add("six"); shouldShow = true; }
    else if(type === "W") { txt.innerText = "WICKET"; card.classList.add("danger"); shouldShow = true; }
    else if(type === "RO") { txt.innerText = "RUN OUT"; card.classList.add("danger"); shouldShow = true; }
    else if(type === "NB") { txt.innerText = "NO BALL"; card.classList.add("alert"); shouldShow = true; }
    
    if(shouldShow) {
        card.appendChild(txt);
        container.appendChild(card); 
        // 💥 STRICTLY 2 SECONDS DELETION TIMER TO MATCH CSS
        setTimeout(() => { if(container.contains(card)) card.remove(); }, 2000);
    }
}

function setTxt(id, val) { let el = document.getElementById(id); if(el) el.innerText = val || ""; }
function setHtml(id, val) { let el = document.getElementById(id); if(el) el.innerHTML = val || ""; }
function setImg(id, val) { 
    let el = document.getElementById(id); 
    if(el) { if(!val || val.length < 50) el.style.display = "none"; else { el.style.display = "block"; el.src = val; } }
}

function loadData() {
    let data; try { let saved = localStorage.getItem(DB_KEY); if(!saved) return; data = JSON.parse(saved); } catch(e) { return; } if(!data) return; 
    
    let wBanner = document.getElementById("winnerBanner");
    if(wBanner) { wBanner.style.display = data.showWinner ? "block" : "none"; setTxt("winnerDisplayHtml", data.winnerText); }
    
    if (data.flashId && data.flashId !== lastFlashId) { fireAnimation(data.flashEvent); lastFlashId = data.flashId; }
    
    setTxt("scoreLarge", data.score + "-" + data.wickets);
    setTxt("oversLarge", Math.floor(data.balls/6) + "." + (data.balls%6) + " OVERS");
    setTxt("team1Name", data.teamA); setTxt("team2Name", data.teamB);
    setImg("team1Logo", data.teamALogo); setImg("team2Logo", data.teamBLogo);
    
    setTxt("b1NameDisplay", data.b1Name); setHtml("b1ScoreDisplay", `${data.b1Runs} <span>(${data.b1Balls})</span>`);
    setTxt("b2NameDisplay", data.b2Name); setHtml("b2ScoreDisplay", `${data.b2Runs} <span>(${data.b2Balls})</span>`);
    document.getElementById("rowB1").className = data.onStrike === 1 ? "batsman-row on-strike" : "batsman-row off-strike";
    document.getElementById("rowB2").className = data.onStrike === 2 ? "batsman-row on-strike" : "batsman-row off-strike";
    
    setTxt("bowlerName", data.bowler); setTxt("bowlerFigures", `${data.bowlerWickets}-${data.bowlerRuns}`);
    const tb = document.getElementById("targetBox");
    if(tb) { tb.style.display = (data.innings === 2 && data.target > 0) ? "block" : "none"; setTxt("needRuns", data.target); }
    
    let tob = document.getElementById("thisOverBalls");
    if(tob) {
        let html = ""; (data.thisOver || []).forEach(ball => {
            let cls = "ball"; 
            if(ball === 4 || ball === "4") cls += " four"; 
            else if(ball === 6 || ball === "6") cls += " six"; 
            else if(ball === "W" || ball === "RO") cls += " wicket"; 
            else if(String(ball).includes("LB")) cls += " lb";
            else if(["WD","NB","4LB","5B"].includes(ball)) cls += " extra"; 
            else cls += " run";
            html += `<span class="${cls}">${ball}</span>`;
        }); setHtml("thisOverBalls", html);
    }
}

window.addEventListener('storage', loadData); 
setInterval(loadData, 200); 
loadData();
</script>
</body>
</html>
