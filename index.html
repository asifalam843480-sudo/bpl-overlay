<script>
let lastFlashId = 0; 
// 💥 THE V33 KEY 💥
const DB_KEY = "BPL_ULTRA_V33"; 

function fireAnimation(type) {
    if(type === "WIDE") return; 
    const container = document.getElementById("animation-container"); container.innerHTML = ""; 
    const card = document.createElement("div"); card.className = "pro-event"; 
    const txt = document.createElement("div"); txt.className = "pro-text";
    let shouldShow = false;
    
    if(type === 4 || type === "4") { txt.innerText = "FOUR"; card.classList.add("four"); shouldShow = true; }
    else if(type === 6 || type === "6") { txt.innerText = "SIX"; card.classList.add("six"); shouldShow = true; }
    else if(type === "NO BALL") { txt.innerText = "NO BALL"; card.classList.add("alert"); shouldShow = true; }
    else if(["BOWLED", "CAUGHT", "CAUGHT BEHIND", "LBW", "STUMPED", "RUN OUT", "RETIRED HURT"].includes(type)) { 
        txt.innerText = (type === "RUN OUT" || type === "RETIRED HURT") ? type : "WICKET"; card.classList.add("danger"); shouldShow = true; 
    }
    
    if(shouldShow) { card.appendChild(txt); container.appendChild(card); setTimeout(() => { if(container.contains(card)) card.remove(); }, 1800); }
}

function setTxt(id, val) { let el = document.getElementById(id); if(el) el.innerText = val || ""; }
function setHtml(id, val) { let el = document.getElementById(id); if(el) el.innerHTML = val || ""; }
function setImg(id, val) { let el = document.getElementById(id); if(el) { if(!val || val.length < 50) el.style.display = "none"; else { el.style.display = "block"; el.src = val; } } }
function setGraphicImg(id, val) { let el = document.getElementById(id); if(el) { if(!val || val.length < 20) el.style.opacity = "0"; else { el.style.opacity = "1"; el.src = val; } } }

function loadData() {
    let data; try { let saved = localStorage.getItem(DB_KEY); if(!saved) return; data = JSON.parse(saved); } catch(e) { return; } if(!data) return; 
    
    let wBanner = document.getElementById("winnerBanner"); 
    if(wBanner) { wBanner.style.display = data.showWinner ? "flex" : "none"; wBanner.className = "theme-" + (data.winnerTheme || "glass"); setTxt("winnerDisplayHtml", data.winnerText); }
    
    let sBar = document.getElementById("scoreBarEl"); let tBar = document.getElementById("tickerBarEl");
    if(data.showScoreboard) { sBar.classList.remove("hidden-board"); tBar.classList.remove("hidden-board"); } else { sBar.classList.add("hidden-board"); tBar.classList.add("hidden-board"); }
    
    setTxt("tickerTextDisplay", data.tickerText);
    if (data.flashId && data.flashId !== lastFlashId) { fireAnimation(data.flashEvent); lastFlashId = data.flashId; }
    
    setTxt("scoreLarge", data.score + "-" + data.wickets); setTxt("oversLarge", Math.floor(data.balls/6) + "." + (data.balls%6) + " OVERS");
    setTxt("team1Name", data.teamA); setTxt("team2Name", data.teamB); setImg("team1Logo", data.teamALogo); setImg("team2Logo", data.teamBLogo);
    
    setTxt("b1NameDisplay", data.b1Name); setHtml("b1ScoreDisplay", `${data.b1Runs} <span>(${data.b1Balls})</span>`);
    setTxt("b2NameDisplay", data.b2Name); setHtml("b2ScoreDisplay", `${data.b2Runs} <span>(${data.b2Balls})</span>`);
    document.getElementById("rowB1").className = data.onStrike === 1 ? "batsman-row on-strike" : "batsman-row off-strike";
    document.getElementById("rowB2").className = data.onStrike === 2 ? "batsman-row on-strike" : "batsman-row off-strike";
    setTxt("bowlerName", data.bowler); setTxt("bowlerFigures", `${data.bowlerWickets}-${data.bowlerRuns}`);
    
    const tb = document.getElementById("targetBox");
    if(tb) { tb.style.display = (data.innings === 2 && data.target > 0) ? "block" : "none"; setTxt("needRuns", data.target); }

    let tob = document.getElementById("thisOverBalls");
    if(tob) {
        let html = ""; let displayBalls = (data.thisOver || []).slice(-8); 
        displayBalls.forEach(ball => {
            let cls = "ball"; 
            if(ball === 4 || ball === "4") cls += " four"; else if(ball === 6 || ball === "6") cls += " six"; else if(ball === "W" || ball === "RO") cls += " wicket"; else if(String(ball).includes("LB")) cls += " lb"; else if(String(ball).includes("WD") || String(ball).includes("NB") || String(ball).includes("B")) cls += " extra"; else cls += " run";
            html += `<span class="${cls}">${ball}</span>`;
        }); 
        setHtml("thisOverBalls", html);
    }

    let xiBanner = document.getElementById("xiBanner");
    if(data.showXiA || data.showXiB) {
        let teamData = data.showXiA ? data.xiA : data.xiB; 
        setTxt("xiTitle", data.xiTopText || "TEAM PLAYING XI");
        let activeLogo = data.showXiA ? (data.xiLogoA || data.teamALogo) : (data.xiLogoB || data.teamBLogo);
        setImg("xiLogoOut", activeLogo);
        let html = ""; teamData.forEach(p => { if(p.name || p.img) { let imgSrc = (p.img && p.img.length > 20) ? p.img : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='; html += `<div class="xi-card"><img src="${imgSrc}"><div class="name">${p.name}</div></div>`; } });
        document.getElementById("xiGrid").innerHTML = html; xiBanner.classList.add("active");
    } else { xiBanner.classList.remove("active"); }

    let profBanner = document.getElementById("profileBanner");
    if(data.showProfile) {
        setTxt("pNameOut", data.profName); setGraphicImg("pImgOut", data.profImg);
        setTxt("pS1V", data.profS1V); setTxt("pS1L", data.profS1L); setTxt("pS2V", data.profS2V);
        setImg("pLogoOut", data.profLogo); 
        profBanner.classList.add("active");
    } else { profBanner.classList.remove("active"); }

    let vsBanner = document.getElementById("vsBanner");
    if(data.showVs) {
        setTxt("vTitleOut", data.vsTitle || "VS"); 
        setTxt("vNameL", data.vsLeftName); setGraphicImg("vImgL", data.vsLeftImg); 
        setTxt("vNameR", data.vsRightName); setGraphicImg("vImgR", data.vsRightImg);
        
        setTxt("vsTeamLOut", data.vsTeamLName || data.teamA); setImg("vsLogoLOut", data.vsLogoL || data.teamALogo);
        setTxt("vsTeamROut", data.vsTeamRName || data.teamB); setImg("vsLogoROut", data.vsLogoR || data.teamBLogo);
        
        vsBanner.classList.add("active");
    } else { vsBanner.classList.remove("active"); }
}

window.addEventListener('storage', loadData); setInterval(loadData, 50); loadData();
</script>
