<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPL Final - OBS Overlay</title>
    <style>
        /* 1920x1080 FIXED CANVAS FOR FULL HD BROADCAST */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; position: relative; }

        /* THE PREMIUM SCOREBAR (Glassmorphism Gold & Black) */
        .score-bar {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 1200px; height: 80px;
            background: rgba(10, 10, 20, 0.85); backdrop-filter: blur(10px);
            border: 2px solid #d4af37; border-radius: 40px;
            display: flex; align-items: center; justify-content: space-between;
            color: white; font-weight: bold; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .team-name { font-size: 35px; width: 300px; text-align: center; background: #d4af37; color: #000; height: 100%; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        .score { font-size: 55px; letter-spacing: 2px; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
        .overs { font-size: 30px; color: #d4af37; width: 200px; text-align: center; }

        /* CENTER EVENT ANIMATION (4, 6, WICKET) */
        .center-event {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 150px; font-weight: 900; color: #fff;
            text-transform: uppercase; text-shadow: 0 0 20px #e94560, 0 0 40px #000;
            opacity: 0; transition: all 0.3s ease-out;
        }
        .center-event.active { transform: translate(-50%, -50%) scale(1); opacity: 1; animation: pulse 0.5s infinite alternate; }

        /* ADVANCED PLAYER PROFILE CARD */
        .player-profile {
            position: absolute; background: linear-gradient(135deg, rgba(15,32,60,0.95), rgba(20,20,40,0.95));
            border-left: 8px solid #d4af37; border-top-right-radius: 20px; border-bottom-right-radius: 20px;
            padding: 30px; color: white; width: 600px; box-shadow: 20px 20px 50px rgba(0,0,0,0.7);
            opacity: 0; pointer-events: none;
        }
        
        .p-name { font-size: 45px; font-weight: 900; color: #d4af37; text-transform: uppercase; margin-bottom: 5px; }
        .p-role { font-size: 22px; color: #aaa; letter-spacing: 2px; margin-bottom: 15px; }
        .p-stats { font-size: 35px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; display: inline-block;}

        /* ANIMATION OPTIONS (TRIGGERED BY ADMIN) */
        .slide-bottom { bottom: -200px; left: 50%; transform: translateX(-50%); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .slide-bottom.show { bottom: 150px; opacity: 1; }

        .fly-left { top: 70%; left: -600px; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .fly-left.show { left: 100px; opacity: 1; }

        .fade-center { top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.8); transition: all 0.5s ease; border-radius: 20px; border-left: none; border-bottom: 8px solid #d4af37; text-align: center;}
        .fade-center.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(1.1); } }
    </style>
</head>
<body>

    <!-- Center Event Popup -->
    <div id="eventPopup" class="center-event">SIX!</div>

    <!-- Live Player Profile Popup -->
    <div id="profileCard" class="player-profile">
        <div class="p-name" id="dispName">Virat Kohli</div>
        <div class="p-role" id="dispRole">Right Hand Batter</div>
        <div class="p-stats" id="dispStats">0 Runs | 0 Balls</div>
    </div>

    <!-- Main Score Bar -->
    <div class="score-bar">
        <div class="team-name" id="dispTeam">TEAM A</div>
        <div class="score"><span id="dispRuns">0</span> - <span id="dispWickets">0</span></div>
        <div class="overs">OVERS: <span id="dispOvers">0.0</span></div>
    </div>

    <script>
        const DB_KEY = 'BPL_V4_FINAL_PRO';

        function updateOverlay() {
            let data = JSON.parse(localStorage.getItem(DB_KEY));
            if (!data) return;

            // Score Update
            document.getElementById('dispRuns').innerText = data.runs;
            document.getElementById('dispWickets').innerText = data.wickets;
            document.getElementById('dispOvers').innerText = data.overs;
            document.getElementById('dispTeam').innerText = data.batTeam;

            // Center Event Logic
            const eventPopup = document.getElementById('eventPopup');
            if (data.event !== '') {
                eventPopup.innerText = data.event;
                if (data.event === 'WICKET!') { eventPopup.style.textShadow = '0 0 20px #ff0000, 0 0 40px #000'; } 
                else { eventPopup.style.textShadow = '0 0 20px #d4af37, 0 0 40px #000'; }
                eventPopup.classList.add('active');
            } else {
                eventPopup.classList.remove('active');
            }

            // Player Profile Logic
            const profileCard = document.getElementById('profileCard');
            if (data.showProfile) {
                document.getElementById('dispName').innerText = data.pName;
                document.getElementById('dispRole').innerText = data.pRole;
                document.getElementById('dispStats').innerText = data.pStats;
                
                // Remove old classes, apply selected animation from Admin
                profileCard.className = 'player-profile ' + data.pAnim;
                // Timeout ensures the class registers before adding 'show'
                setTimeout(() => profileCard.classList.add('show'), 50);
            } else {
                profileCard.classList.remove('show');
            }
        }

        // Machine Gun Polling (Checks data every 200 milliseconds)
        setInterval(updateOverlay, 200);
    </script>
</body>
</html>
