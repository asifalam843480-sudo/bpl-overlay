<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPL Overlay</title>

<style>

body{
margin:0;
background:transparent;
overflow:hidden;
font-family:Arial,sans-serif;
}

.overlay{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:90%;

background:linear-gradient(
90deg,
#001f5c,
#0039a6,
#001f5c
);

border-radius:20px;
padding:15px;

color:white;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:0 0 20px rgba(0,0,0,.4);
}

.score{
font-size:50px;
font-weight:bold;
}

.overs{
font-size:24px;
margin-top:5px;
}

.target{
font-size:24px;
color:#ffd23f;
}

.thisOver{
font-size:20px;
margin-top:10px;
}

.ticker{
position:absolute;
bottom:0;
width:100%;
height:35px;
background:#000;

color:white;

display:flex;
align-items:center;

padding-left:20px;

font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="overlay">

<div>
<h2>BHIKHANPUR PREMIUM LEAGUE</h2>

<div id="score" class="score">
0/0
</div>

<div id="overs" class="overs">
0.0
</div>

<div id="target" class="target">
Target : 0
</div>

<div id="thisOver" class="thisOver">
-
</div>

</div>

</div>

<div class="ticker">

DIGITAL PROMOTION |
CONTACT : 8252001148 |
WHATSAPP : 8252001148

</div>

<script>

function loadData(){

const data =
JSON.parse(
localStorage.getItem("bplData")
);

if(!data) return;

document.getElementById(
"score"
).innerText =
data.score + "/" +
data.wickets;

document.getElementById(
"overs"
).innerText =
Math.floor(data.balls/6)
+"."+
(data.balls%6);

document.getElementById(
"target"
).innerText =
"Target : "+
data.target;

document.getElementById(
"thisOver"
).innerText =
data.thisOver.join(" ");

}

loadData();

setInterval(
loadData,
1000
);

</script>

</body>
</html>
