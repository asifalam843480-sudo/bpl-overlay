<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Premium Overlay | V26 Ultimate</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: transparent; overflow: hidden; font-family: 'Montserrat', sans-serif; }
    .overlay-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow: hidden;}
    
    /* =========================================
       📊 BASE SCOREBOARD (UNCHANGED CORE)
       ========================================= */
    .bottom-scorebar { 
        position:absolute; bottom:30px; left:50%; transform:translateX(-50%); 
        width:96%; max-width: 1500px; height:95px; 
        background: linear-gradient(180deg, rgba(5, 8, 15, 0.98), rgba(0, 0, 0, 1)); 
        border-top: 4px solid #00e5ff; display:flex; align-items:center; 
        box-shadow: 0 -15px 50px rgba(0,0,0,0.9); clip-path: polygon(1% 0, 99% 0, 100% 100%, 0% 100%); 
        z-index:100; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s;
    }
    .bottom-scorebar.hidden-board { transform: translate(-50%, 150px) scale(0.95); opacity: 0; }
    .team-section { width: 230px; display:flex; align-items:center; justify-content:center; }
    .team-name { font-size: 26px; font-weight: 900; color: #ffffff; text-transform: uppercase; }
    .score-center { width: 250px; text-align: center; border-left: 2px solid rgba(255,255,255,0.15); border-right: 2px solid rgba(255,255,255,0.15); }
    .score-large { font-family: 'Bebas Neue', cursive; font-size: 75px; color: #ffffff; line-height: 0.9; }
    .overs-large { font-size: 18px; font-weight: 900; color: #00e5ff; letter-spacing: 4px; }
    .batsman-panel, .bowler-panel { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 25px; }
    .batsman-panel { width: 300px; } .bowler-panel { width: 350px; } 
    .batsman-row { display:flex; justify-content:space-between; align-items: center; padding: 2px 0; color: #fff;}
    .batsman-name { font-size: 17px; font-weight: 900; text-transform: uppercase; }
    .batsman-score { font-family: 'Bebas Neue', cursive; font-size: 32px; }
    .bowler-name { font-size: 20px; font-weight: 900; color: #00e5ff; text-transform: uppercase; }
    .bowler-figures { font-family: 'Bebas Neue', cursive; font-size: 36px; color: #fff;}

    /* =========================================
       🔥 FEATURE 1: FULL SCREEN PLAYING XI 🔥
       ========================================= */
    #xiBanner {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.2), #020617 70%);
        backdrop-filter: blur(20px); z-index: 990; 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 0; transform: scale(1.05); pointer-events: none; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #xiBanner.active { opacity: 1; transform: scale(1); }
    
    .xi-header { 
        background: linear-gradient(90deg, transparent, #10b981, transparent);
        color: #fff; font-size: 40px; font-weight: 900; text-transform: uppercase;
        padding: 10px 100px; margin-bottom: 40px; text-shadow: 0 5px 15px rgba(0,0,0,1);
        letter-spacing: 5px; border-top: 2px solid #fff; border-bottom: 2px solid #fff;
    }
    
    .xi-grid {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1400px;
    }
    
    .xi-card {
        background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.8));
        border: 2px solid #10b981; border-radius: 12px; overflow: hidden;
        width: 160px; height: 220px; display: flex; flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
    }
    .xi-card img { width: 100%; height: 160px; object-fit: cover; background: #0f172a; }
    .xi-card .name { 
        background: #10b981; color: #000; font-weight: 900; text-align: center; 
        padding: 15px 5px; font-size: 16px; text-transform: uppercase; flex-grow: 1;
        display: flex; align-items: center; justify-content: center;
    }

    /* =========================================
       🔥 FEATURE 2: PRO PLAYER PROFILE (LEFT) 🔥
       ========================================= */
    #profileBanner {
        position: fixed; top: 50%; left: -500px; transform: translateY(-50%);
        width: 450px; z-index: 980; display: flex; align-items: stretch;
        transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #profileBanner.active { left: 50px; }
    
    .prof-img-box {
        width: 200px; height: 250px; background: #84cc16; 
        clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
        box-shadow: 15px 15px 30px rgba(0,0,0,0.8); position: relative; z-index: 2;
    }
    .prof-img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .prof-stats-box {
        background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
        padding: 20px 30px 20px 40px; margin-left: -30px;
        border: 2px solid #334155; border-left: none;
        box-shadow: 15px 15px 30px rgba(0,0,0,0.6);
        display: flex; flex-direction: column; justify-content: center;
    }
    .prof-name { font-size: 32px; font-family: 'Bebas Neue', cursive; color: #84cc16; letter-spacing: 2px; border-bottom: 1px solid #475569; margin-bottom: 10px;}
    .prof-stat-row { margin: 5px 0; }
    .prof-stat-label { font-size: 11px; color: #94a3b8; font-weight: 900; text-transform: uppercase; }
    .prof-stat-val { font-size: 24px; color: #fff; font-family: 'Bebas Neue', cursive; }

    /* =========================================
       🔥 FEATURE 3: VERSUS CLASH (CENTER) 🔥
       ========================================= */
    #vsBanner {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
        width: 1000px; height: 400px; z-index: 985; opacity: 0; pointer-events: none;
        transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex; justify-content: space-between; align-items: center;
    }
    #vsBanner.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    
    .vs-side { width: 48%; height: 100%; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.9); overflow: hidden; }
    
    /* Slanted Cuts exactly like reference */
    .vs-left { background: linear-gradient(45deg, #4c1d95, #7c3aed); clip-path: polygon(0 0, 95% 0, 85% 100%, 0 100%); border-left: 5px solid #fff; }
    .vs-right { background: linear-gradient(-45deg, #7c2d12, #ea580c); clip-path: polygon(15% 0, 100% 0, 100% 100%, 5% 100%); border-right: 5px solid #fff; }
    
    .vs-img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: luminosity; opacity: 0.8; }
    .vs-name { 
        position: absolute; bottom: 0; width: 100%; background: #000; color: #fff;
        padding: 15px; font-family: 'Bebas Neue', cursive; font-size: 40px; text-align: center; letter-spacing: 3px;
    }
    .vs-left .vs-name { clip-path: polygon(0 0, 95% 0, 85% 100%, 0 100%); border-bottom: 4px solid #7c3aed;}
    .vs-right .vs-name { clip-path: polygon(15% 0, 100% 0, 100% 100%, 5% 100%); border-bottom: 4px solid #ea580c;}

    .vs-center-badge {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: #0f172a; border: 4px solid #fff; color: #facc15;
        padding: 20px 40px; font-family: 'Bebas Neue', cursive; font-size: 55px;
        box-shadow: 0 0 30px rgba(0,0,0,1); z-index: 10; border-radius: 12px; letter-spacing: 5px;
    }

</style>
</head>
<body>
<div class="overlay-container">
    
    <!-- FEATURE 1: PLAYING XI FULL SCREEN -->
    <div id="xiBanner">
        <div class="xi-header" id="xiTitle">TEAM PLAYING XI</div>
        <div class="xi-grid" id="xiGrid">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- FEATURE 2: PRO PLAYER PROFILE -->
    <div id="profileBanner">
        <div class="prof-img-box"><img id="pImgOut" src=""></div>
        <div class="prof-stats-box">
            <div class="prof-name" id="pNameOut">PLAYER NAME</div>
            <div class="prof-stat-row"><div class="prof-stat-label" id="pS1L">MATCHES</div><div class="prof-stat-val" id="pS1V">0</div></div>
            <div class="prof-stat-row"><div class="prof-stat-label" id="pS2L">RUNS</div><div class="prof-stat-val" id="pS2V">0</div></div>
            <div class="prof-stat-row"><div class="prof-stat-label" id="pS3L">SR</div><div class="prof-stat-val" id="pS3V">0</div></div>
        </div>
    </div>

    <!-- FEATURE 3: VERSUS CLASH -->
    <div id="vsBanner">
        <div class="vs-side vs-left">
            <img id="vImgL" class="vs-img" src="">
            <div class="vs-name" id="vNameL">PLAYER A</div>
        </div>
        <div class="vs-center-badge" id="vTitleOut">VS</div>
        <div class="vs-side vs-right">
            <img id="vImgR" class="vs-img" src="">
            <div class="vs-name" id="vNameR">PLAYER B</div>
        </div>
    </div>

    <!-- BASE SCOREBOARD -->
    <div class="bottom-scorebar" id="scoreBarEl">
        <div class="team-section"><div class="team-name" id="team1Name">TEAM A</div></div>
        <div class="score-center"><div id="scoreLarge" class="score-large">0-0</div><div id="oversLarge" class="overs-large">0.0 OVERS</div></div>
        <div class="batsman-panel">
            <div class="batsman-row"><div class="batsman-name" id="b1NameDisplay">BAT 1</div><div class="batsman-score" id="b1ScoreDisplay">0</div></div>
            <div class="batsman-row"><div class="batsman-name" id="b2NameDisplay">BAT 2</div><div class="batsman-score" id="b2ScoreDisplay">0</div></div>
        </div>
        <div class="bowler-panel"><div class="bowler-name" id="bowlerName">BOWLER</div><div class="bowler-figures" id="bowlerFigures">0-0</div></div>
        <div class="team-section"><div class="team-name" id="team2Name">TEAM B</div></div>
    </div>

</div>

<script>
const DB_KEY = "BPL_ULTRA_V26"; 

function setTxt(id, val) { let el = document.getElementById(id); if(el) el.innerText = val || ""; }
function setImg(id, val) { 
    let el = document.getElementById(id); 
    if(el) { if(!val || val.length < 20) el.style.opacity = "0"; else { el.style.opacity = "1"; el.src = val; } }
}

function loadData() {
    let data; try { let saved = localStorage.getItem(DB_KEY); if(!saved) return; data = JSON.parse(saved); } catch(e) { return; } if(!data) return; 
    
    // Core Scoreboard
    let sBar = document.getElementById("scoreBarEl");
    if(data.showScoreboard) sBar.classList.remove("hidden-board"); else sBar.classList.add("hidden-board");
    
    setTxt("scoreLarge", data.score + "-" + data.wickets);
    setTxt("oversLarge", Math.floor(data.balls/6) + "." + (data.balls%6) + " OVERS");
    setTxt("team1Name", data.teamA); setTxt("team2Name", data.teamB);
    setTxt("b1NameDisplay", data.b1Name); setTxt("b1ScoreDisplay", data.b1Runs);
    setTxt("b2NameDisplay", data.b2Name); setTxt("b2ScoreDisplay", data.b2Runs);
    setTxt("bowlerName", data.bowler); setTxt("bowlerFigures", `${data.bowlerWickets}-${data.bowlerRuns}`);

    // 🔥 FEATURE 1: PLAYING XI LOGIC
    let xiBanner = document.getElementById("xiBanner");
    if(data.showXiA || data.showXiB) {
        let teamData = data.showXiA ? data.xiA : data.xiB;
        setTxt("xiTitle", (data.showXiA ? data.teamA : data.teamB) + " PLAYING XI");
        let html = "";
        teamData.forEach(p => {
            if(p.name || p.img) {
                let imgSrc = (p.img && p.img.length > 20) ? p.img : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='; // Transparent blank
                html += `<div class="xi-card"><img src="${imgSrc}"><div class="name">${p.name}</div></div>`;
            }
        });
        document.getElementById("xiGrid").innerHTML = html;
        xiBanner.classList.add("active");
    } else {
        xiBanner.classList.remove("active");
    }

    // 🔥 FEATURE 2: PROFILE LOGIC
    let profBanner = document.getElementById("profileBanner");
    if(data.showProfile) {
        setTxt("pNameOut", data.profName); setImg("pImgOut", data.profImg);
        setTxt("pS1L", data.profS1L); setTxt("pS1V", data.profS1V);
        setTxt("pS2L", data.profS2L); setTxt("pS2V", data.profS2V);
        setTxt("pS3L", data.profS3L); setTxt("pS3V", data.profS3V);
        profBanner.classList.add("active");
    } else { profBanner.classList.remove("active"); }

    // 🔥 FEATURE 3: VERSUS LOGIC
    let vsBanner = document.getElementById("vsBanner");
    if(data.showVs) {
        setTxt("vTitleOut", data.vsTitle);
        setTxt("vNameL", data.vsLeftName); setImg("vImgL", data.vsLeftImg);
        setTxt("vNameR", data.vsRightName); setImg("vImgR", data.vsRightImg);
        vsBanner.classList.add("active");
    } else { vsBanner.classList.remove("active"); }
}

window.addEventListener('storage', loadData); 
setInterval(loadData, 300); 
loadData();
</script>
</body>
</html>
