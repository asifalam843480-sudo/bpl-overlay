<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket OBS Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        
        /* Strict 1920x1080 Canvas for OBS */
        body {
            margin: 0; padding: 0; width: 1920px; height: 1080px;
            overflow: hidden; background: transparent;
            font-family: 'Montserrat', sans-serif;
        }

        /* ----- SCOREBOARD LOWER THIRD (UNTOUCHED) ----- */
        .scoreboard-container {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: stretch;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px);
            border-top: 3px solid #d4af37; border-bottom: 3px solid #6b5711;
            border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.15);
            color: #fff; width: 1200px; height: 90px; overflow: hidden;
        }
        .team-box {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: 42px; font-weight: 900; letter-spacing: 3px;
            background: linear-gradient(90deg, #111, #1a1a1a);
        }
        .vs { font-size: 20px; color: #d4af37; font-weight: 700; margin: 0 15px; opacity: 0.7;}
        .score-box {
            padding: 0 50px; background: #d4af37; color: #0a0a0a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        .runs-wickets { font-size: 50px; font-weight: 900; line-height: 1; }
        .runs-wickets span { font-size: 30px; font-weight: 700; }
        .overs-box {
            padding: 0 40px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; background: #0a0a0a;
        }
        .overs-text { font-size: 14px; color: #d4af37; text-transform: uppercase; letter-spacing: 2px;}
        .overs-val { font-size: 36px; font-weight: 700; }

        /* ----- ADVANCED CENTER CINEMATICS ----- */
        .event-canvas {
            position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
            display: flex; justify-content: center; align-items: center; pointer-events: none;
            perspective: 1000px; /* For 3D rotation */
        }

        .event-plate {
            position: relative;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(25px);
            padding: 40px 120px;
            border-radius: 16px;
            border: 2px solid transparent;
            opacity: 0;
            transform: scale(0.8) rotateX(40deg);
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }

        /* Sweeping Light Glare */
        .event-plate::after {
            content: ''; position: absolute; top: 0; left: -150%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-30deg);
        }

        .cinematic-text {
            font-size: 160px; font-weight: 900; letter-spacing: 20px; text-transform: uppercase;
            margin: 0; line-height: 1; text-align: center;
            background-size: 200% auto;
            color: transparent; -webkit-background-clip: text; background-clip: text;
        }

        /* --- THEMES --- */
        /* 1. GOLD (FOUR / SIX) */
        .theme-gold .event-plate {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.3), inset 0 0 40px rgba(212, 175, 55, 0.1);
        }
        .theme-gold .cinematic-text {
            background-image: linear-gradient(45deg, #FFDF73, #D4AF37, #997A15, #FFDF73);
            filter: drop-shadow(0 0 30px rgba(212,175,55,0.6));
        }

        /* 2. RED (WICKET) */
        .theme-red .event-plate {
            border-color: rgba(255, 30, 30, 0.6);
            box-shadow: 0 0 100px rgba(255, 30, 30, 0.4), inset 0 0 50px rgba(255, 30, 30, 0.2);
        }
        .theme-red .cinematic-text {
            background-image: linear-gradient(45deg, #ff6b6b, #cc0000, #800000, #ff6b6b);
            filter: drop-shadow(0 0 40px rgba(204,0,0,0.8));
        }

        /* 3. BLUE (WIDE / NO BALL) */
        .theme-blue .event-plate {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 80px rgba(0, 229, 255, 0.3), inset 0 0 40px rgba(0, 229, 255, 0.1);
        }
        .theme-blue .cinematic-text {
            background-image: linear-gradient(45deg, #80ffff, #00e5ff, #0088cc, #80ffff);
            filter: drop-shadow(0 0 30px rgba(0,229,255,0.6));
            font-size: 130px; /* Slightly smaller to fit long words */
        }

        /* --- MASTER ANIMATION --- */
        .trigger .event-plate {
            animation: broadcastCrash 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .trigger .event-plate::after {
            animation: lightSweep 4s ease-in-out forwards;
        }
        .trigger.theme-red .event-plate {
            animation: wicketCrash 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes broadcastCrash {
            0% { opacity: 0; transform: scale(0.4) rotateX(60deg) translateY(200px); filter: blur(20px); }
            10% { opacity: 1; transform: scale(1.1) rotateX(-10deg) translateY(0); filter: blur(0); }
            15% { transform: scale(1) rotateX(0deg); }
            85% { opacity: 1; transform: scale(1.05) rotateX(0deg); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.4) rotateX(30deg) translateY(-100px); filter: blur(15px); }
        }

        @keyframes wicketCrash {
            0% { opacity: 0; transform: scale(2) translateY(-200px); filter: blur(20px); }
            10% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
            12% { transform: translateX(-10px) rotate(-1deg); }
            14% { transform: translateX(10px) rotate(1deg); }
            16% { transform: translateX(-5px) rotate(0deg); }
            85% { opacity: 1; transform: scale(1.05); filter: blur(0); }
            100% { opacity: 0; transform: scale(0.5) translateY(100px); filter: blur(20px); }
        }

        @keyframes lightSweep {
            0% { left: -150%; }
            20% { left: 150%; }
            100% { left: 150%; }
        }
    </style>
</head>
<body>

    <!-- Center Cinematic Popups (Advanced Geometry) -->
    <div class="event-canvas" id="canvasWrapper">
        <div class="event-plate" id="eventPlate">
            <h1 id="eventPopup" class="cinematic-text"></h1>
        </div>
    </div>

    <!-- Lower Third Scoreboard (Untouched) -->
    <div class="scoreboard-container">
        <div class="team-box">
            <span id="displayTeam1">TEAM A</span>
            <span class="vs">VS</span>
            <span id="displayTeam2">TEAM B</span>
        </div>
        <div class="score-box">
            <div class="runs-wickets" id="displayScore">0<span>/0</span></div>
        </div>
        <div class="overs-box">
            <div class="overs-text">Overs</div>
            <div class="overs-val" id="displayOvers">0.0</div>
        </div>
    </div>

    <script>
        // Listen for storage events from admin.html
        window.addEventListener('storage', function(e) {
            
            // Scoreboard Updates
            if (e.key === 'cricket_score' && e.newValue) {
                const data = JSON.parse(e.newValue);
                document.getElementById('displayTeam1').innerText = data.team1;
                document.getElementById('displayTeam2').innerText = data.team2;
                document.getElementById('displayScore').innerHTML = `${data.runs}<span>/${data.wickets}</span>`;
                document.getElementById('displayOvers').innerText = data.overs;
            }

            // Cinematic Popup Triggers
            if (e.key === 'cricket_event' && e.newValue) {
                const eventData = JSON.parse(e.newValue);
                fireCinematicEvent(eventData.type, eventData.theme);
            }
        });

        // Load initial state
        window.onload = () => {
            const initialScore = localStorage.getItem('cricket_score');
            if(initialScore) {
                const data = JSON.parse(initialScore);
                document.getElementById('displayTeam1').innerText = data.team1;
                document.getElementById('displayTeam2').innerText = data.team2;
                document.getElementById('displayScore').innerHTML = `${data.runs}<span>/${data.wickets}</span>`;
                document.getElementById('displayOvers').innerText = data.overs;
            }
        }

        let animationTimeout;
        function fireCinematicEvent(type, theme) {
            const canvasWrapper = document.getElementById('canvasWrapper');
            const popup = document.getElementById('eventPopup');
            
            // Clean slate for instant re-trigger
            canvasWrapper.className = 'event-canvas'; 
            void canvasWrapper.offsetWidth; // Reflow hack
            
            // Apply text and correct color theme
            popup.innerText = type;
            canvasWrapper.classList.add(`theme-${theme.toLowerCase()}`);
            
            // Ignite the animation
            canvasWrapper.classList.add('trigger');

            // Reset after 4 seconds
            clearTimeout(animationTimeout);
            animationTimeout = setTimeout(() => {
                canvasWrapper.className = 'event-canvas'; // removes all classes
            }, 4000);
        }
    </script>
</body>
</html>
