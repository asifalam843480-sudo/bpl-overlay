<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPL Season 4 Overlay</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="overlay-container">

    <!-- TOP RIGHT SCORE BOX -->

    <div class="score-box">

        <div class="league-logo">
            <img src="assets/bpl-logo.png" alt="">
        </div>

        <div class="score-details">

            <div id="totalScore" class="main-score">
                124/4
            </div>

            <div id="overs" class="overs">
                15.2 OVERS
            </div>

        </div>

    </div>

    <!-- MAIN SCOREBAR -->

    <div class="bottom-scorebar">

        <!-- TEAM LEFT -->

        <div class="team-section left">

            <div class="team-logo">
                <img id="team1Logo" src="logos/team1.png">
            </div>

            <div class="team-name" id="team1Name">
                ROYAL WARRIORS
            </div>

        </div>

        <!-- SCORE -->

        <div class="score-center">

            <div id="scoreLarge" class="score-large">
                124/4
            </div>

            <div id="oversLarge" class="overs-large">
                15.2 OVERS
            </div>

        </div>

        <!-- BATSMAN -->

        <div class="batsman-panel">

            <div class="batsman-row">

                <div class="batsman-name" id="batsman1">
                    ASIF*
                </div>

                <div class="batsman-score" id="batsman1Score">
                    45 (31)
                </div>

            </div>

            <div class="batsman-row">

                <div class="batsman-name" id="batsman2">
                    RAHUL
                </div>

                <div class="batsman-score" id="batsman2Score">
                    22 (18)
                </div>

            </div>

        </div>

        <!-- NEED -->

        <div class="need-panel">

            <div class="need-title">
                NEED
            </div>

            <div id="needRuns" class="need-runs">
                41
            </div>

            <div id="needBalls" class="need-balls">
                RUNS IN 28 BALLS
            </div>

        </div>

        <!-- BOWLER -->

        <div class="bowler-panel">

            <div class="bowler-name" id="bowlerName">
                IMRAN
            </div>

            <div class="bowler-figures" id="bowlerFigures">
                2-18 (3.2)
            </div>

            <div class="this-over">

                <span class="ball">1</span>
                <span class="ball four">4</span>
                <span class="ball">0</span>
                <span class="ball wicket">W</span>
                <span class="ball">1</span>
                <span class="ball six">6</span>

            </div>

        </div>

        <!-- TEAM RIGHT -->

        <div class="team-section right">

            <div class="team-logo">
                <img id="team2Logo" src="logos/team2.png">
            </div>

            <div class="team-name" id="team2Name">
                TIGER STRIKERS
            </div>

        </div>

    </div>

    <!-- SPONSOR BAR -->

    <div class="ticker-bar">

        <div class="ticker-content">

            DIGITAL PROMOTION |
            ALL TYPE DIGITAL & PHYSICAL PROMOTION |
            CONTACT : 8252001148 |
            WHATSAPP : 8252001148 |
            BHIKHANPUR PREMIUM LEAGUE SEASON - 4

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
