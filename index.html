<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cricket Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Center Screen Animations (Wicket, 4, Hat-tricks) -->
    <div id="animation-layer" class="hidden">
        <h1 id="anim-text">WICKET</h1>
    </div>

    <!-- Bottom Scoreboard -->
    <div id="overlay-container">
        <div class="team-info">
            <div class="team-name" id="batting-team">IND</div>
            <div class="score-box">
                <span id="runs">0</span> - <span id="wickets">0</span>
                <span class="overs">(<span id="overs">0.0</span>)</span>
            </div>
        </div>
        
        <div class="match-info">
            <div class="target-text hidden" id="target-box">Target: <span id="target">0</span></div>
            <div class="batsman">Striker: <span id="striker-name">Player 1</span> (<span id="striker-runs">0</span>)</div>
        </div>

        <div class="bowler-info">
            Bowler: <span id="bowler-name">Bowler 1</span> 
            <span class="bowler-stats"><span id="bowler-runs">0</span>/<span id="bowler-wickets">0</span></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
