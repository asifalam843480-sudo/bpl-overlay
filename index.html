<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPL Premium Overlay V9 - Titanium Clarity</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: transparent; overflow: hidden; font-family: 'Montserrat', sans-serif; }
    .overlay-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    
    /* --- TITANIUM SOLID SCOREBAR (MAXIMUM CLARITY) --- */
    .bottom-scorebar { 
        position:absolute; bottom:55px; left:50%; transform:translateX(-50%); width:94%; height:100px; 
        background: linear-gradient(90deg, #020612 0%, #0a142e 50%, #020612 100%); /* Solid Dark for extreme contrast */
        border-top: 4px solid #00f0ff; 
        border-bottom: 4px solid #000;
        display:flex; align-items:center; 
        box-shadow: 0 20px 50px rgba(0,0,0,1), 0 0 15px rgba(0,240,255,0.2); 
        border-radius: 8px;
    }
    
    .team-section { width: 230px; display:flex; align-items:center; justify-content:center; gap:15px; padding:0 15px; }
    .team-logo img { width: 75px; height: 75px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,1)); display: none; }
    .team-name { font-size: 26px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 3px 3px 0px #000; }
    
    /* Center Score with sweeping light animation */
    .score-center { 
        width: 250px; text-align: center; background: #000000; height: 100%; 
        display: flex; flex-direction: column; justify-content: center; 
        border-left: 2px solid #00f0ff; border-right: 2px solid #00f0ff; 
        position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,240,255,0.2);
    }
    .score-center::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); animation: sweep 3s infinite; }
    @keyframes sweep { 100% { left: 200%; } }
    
    .score-large { font-family: 'Bebas Neue', cursive; font-size: 75px; color: #ffffff; line-height: 0.85; text-shadow: 4px 4px 0px #000, 0 0 20px rgba(0,240,255,0.5); padding-top: 5px; }
    .overs-large { font-size: 17px; font-weight: 900; color: #ffd700; letter-spacing: 4px; text-shadow: 2px 2px 0px #000; }
    
    .batsman-panel, .bowler-panel { width: 300px; padding: 0 30px; }
    .batsman-row { display:flex; justify-content:space-between; align-items: center; padding: 5px 0; }
    .batsman-name { font-size: 17px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; gap:8px; text-shadow: 2px 2px 0px #000; }
    .batsman-score { font-family: 'Bebas Neue', cursive; font-size: 32px; letter-spacing: 1px; text-shadow: 2px 2px 0px #000; }
    .batsman-score span { font-family: 'Montserrat', sans-serif; font-size: 14px; color: #b0c4de; font-weight: 900; }
    
    .on-strike { color: #ffffff; } .on-strike .batsman-score { color: #00f0ff; }
    .off-strike { color: #8892b0; } .off-strike .batsman-score { color: #8892b0; }
    
    /* Animated Striker Icon */
    .striker-icon { color: #00f0ff; font-size: 14px; opacity: 0; animation: pulse 1s infinite alternate; } 
    .on-strike .striker-icon { opacity: 1; }
    @keyframes pulse { from { transform: scale(1); opacity: 0.5; } to { transform: scale(1.3); opacity: 1; text-shadow: 0 0 10px #00f0ff; } }
    
    .bowler-name { font-size: 19px; font-weight: 900; color: #ffd700; text-transform: uppercase; text-shadow: 2px 2px 0px #000; }
    .bowler-figures { font-family: 'Bebas Neue', cursive; font-size: 36px; color: #ffffff; letter-spacing: 2px; text-shadow: 2px 2px 0px #000; }
    
    .this-over { display:flex; gap:6px; margin-top:5px; }
    .ball { width: 26px; height: 26px; border-radius: 4px; background: #111; color: #fff; display:flex; align-items:center; justify-content:center; font-size: 14px; font-weight: 900; border: 1px solid #444; box-shadow: 2px 2px 0px #000; }
    .ball.run { background: #0056b3; border-color: #003d82; } .ball.four { background: #00b85c; color:#000; border-color: #008a45; } .ball.six { background: #9d4edd; border-color: #7209b7; } .ball.wicket { background: #e60000; color:#fff; border-color: #8b0000; } .ball.extra { background: #e67e22; border-color: #a85112; }
    
    .need-panel { width: 150px; text-align: center; background: #1a0000; padding: 5px; border-radius: 6px; border: 2px solid #ff0000; margin: 0 15px; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
    .need-title { font-size: 13px; font-weight: 900; color: #ff4136; letter-spacing: 1px; } .need-runs { font-family: 'Bebas Neue', cursive; font-size: 42px; color: white; line-height: 1; text-shadow: 2px 2px 0px #000; }
    
    .ticker-bar { position:absolute; bottom:15px; left:50%; transform:translateX(-50%); width:92%; height:32px; background: #000; border-radius: 4px; border:2px solid #222; overflow:hidden; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,1);}
    .ticker-content { white-space: nowrap; font-size: 15px; font-weight: 900; color: #ffffff; line-height: 28px; letter-spacing: 2px; animation: tickerMove 20s linear infinite; }
    .ticker-highlight { color: #ffd700; }
    @keyframes tickerMove { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    /* --- SHARP BROADCAST ALERTS (HIGH VISIBILITY) --- */
    #animation-container { position: fixed; bottom: 170px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; justify-content: center; align-items: flex-end; width: 100%; pointer-events: none; }
    
    .anim-graphic { 
        font-family: 'Bebas Neue', cursive; font-size: 65px; letter-spacing: 6px; line-height: 1; text-transform: uppercase;
        padding: 10px 60px; background: #000; border: 4px solid; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        display: flex; align-items: center; opacity: 0; transform-origin: bottom;
    }
    
    .anim-4 { color: #00f0ff; border-color: #00f0ff; text-shadow: 3px 3px 0px #000; animation: hardPop 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .anim-6 { color: #ffd700; border-color: #ffd700; text-shadow: 3px 3px 0px #000; animation: hardPop 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .anim-w { color: #ffffff; border-color: #ff0000; background: #660000; text-shadow: 3px 3px 0px #000; animation: hardPop 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    @keyframes hardPop { 
        0% { transform: scaleY(0); opacity: 0; } 
        15% { transform: scaleY(1); opacity: 1; } 
        85% { transform: scaleY(1); opacity: 1; } 
        100% { transform: scaleY(0); opacity: 0; } 
    }

    /* --- CINEMATIC SOLID WINNER BANNER --- */
    #winnerBanner { display: none; position: fixed; inset: 0; z-index: 999999; flex-direction: column; justify-content: center; align-items: center; background: #020612; pointer-events: none; }
    #winnerBanner::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(0,0,0,0.2), rgba(0,0,0,0.2) 10px, transparent 10px, transparent 20px); }
    
    .winner-content { text-align: center; opacity: 0; z-index: 2; transform: scale(1.5); animation: slamDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    @keyframes slamDown { to { opacity: 1; transform: scale(1); } }
    
    #winnerTitle { color: #ffffff; font-size: 35px; letter-spacing: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; text-shadow: 4px 4px 0px #000; }
    #winnerDisplayHtml { color: #ffd700; font-size: 130px; font-family: 'Bebas Neue', cursive; text-transform: uppercase; text-shadow: 8px 8px 0px #000; line-height: 1; letter-spacing: 5px; }
</style>
</head>
<body>
<div class="overlay-container">
    <div id="animation-container"></div>
    
    <div id="winnerBanner">
        <div class="winner-content">
            <div id="winnerTitle">MATCH CHAMPION</div>
            <div id="winnerDisplayHtml">TEAM WON</div>
        </div>
    </div>
    
    <div class="bottom-scorebar">
        <div class="team-section left">
            <div class="team-logo"><img id="team1Logo" src=""></div>
            <div class="team-name" id="team1Name">TEAM A</div>
        </div>
        <div class="score-center"><div id="scoreLarge" class="score-large">0-0</div><div id="oversLarge" class="overs-large">0.0 OVERS</div></div>
        <div class="batsman-panel">
            <div class="batsman-row" id="rowB1"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b1NameDisplay">BAT 1</span></div><div class="batsman-score" id="b1ScoreDisplay">0 <span>(0)</span></div></div>
            <div class="batsman-row" id="rowB2"><div class="batsman-name"><span class="striker-icon">▶</span> <span id="b2NameDisplay">BAT 2</span></div><div class="batsman-score" id="b2ScoreDisplay">0 <span>(0)</span></div></div>
        </div>
        <div class="need-panel" id="targetBox" style="display:none;"><div class="need-title">TARGET</div><div id="needRuns" class="need-runs">0</div></div>
        <div class="bowler-panel"><div class="bowler-name" id="bowlerName">BOWLER</div><div class="bowler-figures" id="bowlerFigures">0-0</div><div class="this-over" id="thisOverBalls"></div></div>
        <div class="team-section right">
            <div class="team-name" id="team2Name">TEAM B</div>
            <div class="team-logo"><img id="team2Logo" src=""></div>
        </div>
    </div>
    <div class="ticker-bar"><div class="ticker-content"><span class="ticker-highlight">🏆 BHIKHANPUR PREMIUM LEAGUE LIVE 🏆</span> &nbsp;|&nbsp; POWERED BY DIGITAL PROMOTION &nbsp;|&nbsp; FOR INQUIRIES CALL: 8252001148</div></div>
</div>

<script>
let lastFlashId = 0; 
const DB_KEY = "BPL_PRO_V8_FINAL"; 
const syncChannel = new BroadcastChannel('bpl_live_sync');

function fireAnimation(type) {
    const container = document.getElementById("animation-container"); 
    container.innerHTML = ""; 
    const box = document.createElement("div");
    
    if(type === 4 || type === "4") { box.className = "anim-graphic anim-4"; box.innerHTML = "BOUNDARY FOUR"; }
    else if(type === 6 || type === "6") { box.className = "anim-graphic anim-6"; box.innerHTML = "MAXIMUM SIX"; }
    else if(type === "W") { box.className = "anim-graphic anim-w"; box.innerHTML = "WICKET!"; }
    else if(type === "RO") { box.className = "anim-graphic anim-w"; box.innerHTML = "RUN OUT!"; }
    
    if(box.className) {
        container.appendChild(box); 
        setTimeout(() => { if(container.contains(box)) box.remove(); }, 3500); 
    }
}

function setTxt(id, val) { let el = document.getElementById(id); if(el && el.innerText !== val) el.innerText = val || ""; }
function setHtml(id, val) { let el = document.getElementById(id); if(el && el.innerHTML !== val) el.innerHTML = val || ""; }
function setImg(id, val) { 
    let el = document.getElementById(id); 
    if(el) { if(!val) el.style.display = "none"; else { el.style.display = "block"; if(el.src !== val) el.src = val; } }
}

function renderData(data) {
    if(!data) return; 
    
    let wBanner = document.getElementById("winnerBanner");
    if(wBanner) { 
        if(data.showWinner) {
            wBanner.style.display = "flex";
            setTxt("winnerDisplayHtml", data.winnerText); 
        } else {
            wBanner.style.display = "none";
        }
    }
    
    if (data.flashId && data.flashId !== lastFlashId) { fireAnimation(data.flashEvent); lastFlashId = data.flashId; }
    
    setTxt("scoreLarge", data.score + "-" + data.wickets);
    setTxt("oversLarge", Math.floor(data.balls/6) + "." + (data.balls%6) + " OVERS");
    setTxt("team1Name", data.teamA); setTxt("team2Name", data.teamB);
    setImg("team1Logo", data.teamALogo); setImg("team2Logo", data.teamBLogo);
    
    setTxt("b1NameDisplay", data.b1Name); setHtml("b1ScoreDisplay", `${data.b1Runs} <span>(${data.b1Balls})</span>`);
    setTxt("b2NameDisplay", data.b2Name); setHtml("b2ScoreDisplay", `${data.b2Runs} <span>(${data.b2Balls})</span>`);
    document.getElementById("rowB1").className = data.onStrike === 1 ? "batsman-row on-strike" : "batsman-row off-strike";
    document.getElementById("rowB2").className = data.onStrike === 2 ? "batsman-row on-strike" : "batsman-row off-strike";
    
    setTxt("bowlerName", data.bowler); setTxt("bowlerFigures", `${data.bowlerWickets}-${data.bowlerRuns}`);
    const tb = document.getElementById("targetBox");
    if(tb) { tb.style.display = (data.innings === 2 && data.target > 0) ? "block" : "none"; setTxt("needRuns", data.target); }
    
    let tob = document.getElementById("thisOverBalls");
    if(tob) {
        let html = ""; (data.thisOver || []).forEach(ball => {
            let cls = "ball"; if(ball === 4 || ball === "4") cls += " four"; else if(ball === 6 || ball === "6") cls += " six"; else if(ball === "W" || ball === "RO") cls += " wicket"; else if(["WD","NB","1LB","4LB","5WD"].includes(ball)) cls += " extra"; else cls += " run";
            html += `<span class="${cls}">${ball}</span>`;
        }); setHtml("thisOverBalls", html);
    }
}

syncChannel.onmessage = (event) => { renderData(event.data); };
function loadInitial() { try { let saved = localStorage.getItem(DB_KEY); if(saved) renderData(JSON.parse(saved)); } catch(e) {} }
loadInitial();
</script>
</body>
</html>
